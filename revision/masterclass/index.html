<h2 class="sec"><span class="k">9.1</span>Workflow fundamentals</h2>
<x-q n="9.1" tag="must basic"><x-t>What is a workflow?</x-t><x-say>A defined sequence or graph of steps, with data flowing from one step to the next, executed by an engine that tracks each step’s status and can retry, pause and resume.</x-say><x-ev>Basics.</x-ev></x-q>
<x-q n="9.2" tag="must basic"><x-t>What is the difference between a workflow and an agent?</x-t><x-say>In a workflow, code decides the order of steps; in an agent, the model decides the next action at runtime. Workflows are predictable and easy to retry and audit; agents are flexible for open-ended tasks.</x-say><x-ev>Key distinction.</x-ev></x-q>
<x-q n="9.3" tag="must basic"><x-t>What is a deterministic workflow?</x-t><x-say>One where the same input always follows the same path of steps. LLM outputs inside steps can vary, but the structure doesn’t.</x-say><x-ev>Precision.</x-ev></x-q>
<x-q n="9.4" tag="must basic"><x-t>What is a non-deterministic process?</x-t><x-say>A process whose path or result can differ between runs with the same input, like an agent choosing tools, or any LLM sampling at temperature &gt; 0.</x-say><x-ev>Precision.</x-ev></x-q>
<x-q n="9.5" tag="must basic"><x-t>What are workflow steps?</x-t><x-say>Units of work with a defined input, output and execute function: validate, call an LLM, write to the DB. In Mastra: <code>createStep({ id, inputSchema, outputSchema, execute })</code>.</x-say><x-ev>Basics.</x-ev></x-q>
<x-q n="9.6" tag="must basic"><x-t>What is sequential execution?</x-t><x-say>Running steps one after another, each receiving the previous step’s output.</x-say><x-ev>Basics.</x-ev></x-q>
<x-q n="9.7" tag="must basic"><x-t>What is parallel execution?</x-t><x-say>Running independent steps at the same time and continuing when all finish; total time is the slowest step instead of the sum.</x-say><x-ev>Basics.</x-ev></x-q>
<x-q n="9.8" tag="must basic"><x-t>What is conditional branching?</x-t><x-say>Choosing which step(s) to run based on data, e.g. a short course skips quiz generation. In Mastra, <code>.branch()</code> runs every step whose condition is true.</x-say><x-ev>Basics.</x-ev></x-q>
<x-q n="9.9" tag="must basic"><x-t>What is workflow state?</x-t><x-say>Everything about a run so far: input, current status, each step’s status and output, suspend payloads. It’s what you need to continue the run.</x-say><x-ev>Basics.</x-ev></x-q>
<x-q n="9.10" tag="must basic"><x-t>What is workflow persistence?</x-t><x-say>Saving workflow state to durable storage (Postgres, etc.) after steps, so a run survives restarts and can be resumed by any instance.</x-say><x-ev>Basics.</x-ev></x-q>
<x-q n="9.11" tag="must basic"><x-t>What is suspend/resume?</x-t><x-say>Pausing a run inside a step and saving its state (suspend), then continuing it later with new data such as a user’s answer (resume), possibly in a different process.</x-say><x-ev>Basics.</x-ev></x-q>
<x-q n="9.12" tag="must basic"><x-t>Why would a workflow need to suspend?</x-t><x-say>To wait for something outside its control: human approval, a user’s choice, an external webhook, a scheduled time, without holding a process or HTTP request open.</x-say><x-ev>Purpose.</x-ev></x-q>
<x-q n="9.13" tag="must solid"><x-t>What happens if a workflow crashes halfway through?</x-t><x-say>Without persistence, the run is lost. With persistence, the last snapshot shows which steps finished; the engine (or your code) re-runs from the first unfinished step. The step that was in progress runs again, so it must be idempotent.</x-say><x-ev>Failure reasoning.</x-ev></x-q>
<x-q n="9.14" tag="must solid"><x-t>How do you resume execution?</x-t><x-say>Load the run by id from storage and call resume with the suspended step and the resume data (Mastra: <code>createRun({ runId })</code> then <code>run.resume({ step, resumeData })</code>). For crashed running runs, Mastra’s recovery re-drives them at boot by default.</x-say><x-ev>Mechanics.</x-ev></x-q>
<x-q n="9.15" tag="must basic"><x-t>What is a human-in-the-loop workflow?</x-t><x-say>A workflow that pauses for a person to review, edit, approve or choose before continuing, typically for quality control or risky actions.</x-say><x-ev>Basics.</x-ev></x-q>
<x-q n="9.16" tag="must solid"><x-t>What is idempotency in workflows?</x-t><x-say>Designing each step so running it twice has the same effect as once (skip if done, upsert by natural key), because retries, crashes and recovery can re-run steps.</x-say><x-ev>Key reliability idea.</x-ev></x-q>
<x-q n="9.17" tag="must solid"><x-t>How do you prevent duplicate execution?</x-t><x-say>Dedupe at the start (idempotency key → one run per request), claim resumes atomically (suspended → running in one conditional update), make side effects idempotent with unique constraints, and use stable job/run ids.</x-say><x-ev>Practical safety.</x-ev></x-q>
<x-q n="9.18" tag="must solid"><x-t>How would you handle workflow retries?</x-t><x-say>Step-level retries with backoff for transient failures, limited counts, only on idempotent steps; don’t stack retries at several layers; after exhausting them, fail the run with state saved so it can be re-run from the failed step.</x-say><x-ev>Design.</x-ev></x-q>
<x-q n="9.19" tag="must solid"><x-t>What is a compensating action?</x-t><x-say>A step that undoes the business effect of an earlier completed step when a later one fails, because you can’t roll back across systems: refund a charge, cancel a reservation, delete unpublished drafts.</x-say><x-ev>Saga awareness.</x-ev></x-q>
<x-q n="9.20" tag="must solid"><x-t>When would you use a workflow instead of a single agent?</x-t><x-say>When the steps and order are known, the process is long-running, needs pauses for people, must survive restarts, needs per-step retries, or must be auditable and cost-predictable.</x-say><x-ev>Judgement.</x-ev></x-q>

<h2 class="sec"><span class="k">9.2</span>Mastra</h2>
<x-q n="9.21" tag="must basic"><x-t>What is Mastra?</x-t><x-say>An open-source TypeScript framework for AI applications: agents with tools and memory, workflows with suspend/resume and storage, RAG helpers, evals and observability, with a model router for many providers.</x-say><x-ev>Awareness.</x-ev></x-q>
<x-q n="9.22" tag="must basic"><x-t>What problems does Mastra solve?</x-t><x-say>It packages the plumbing you’d otherwise hand-write: the agent tool loop, provider adapters, workflow graphs with typed steps, persisted snapshots, suspend/resume and recovery, tool approval, memory, tracing.</x-say><x-ev>Purpose.</x-ev></x-q>
<x-q n="9.23" tag="must basic"><x-t>What is a Mastra agent?</x-t><x-say>An <code>Agent</code> instance with an id, instructions, a model and tools; <code>generate()</code> or <code>stream()</code> runs the tool loop with options like <code>maxSteps</code>.</x-say><x-code><pre data-l="js">const agent = new Agent({ id: 'doc-agent', name: 'Docs', instructions: '…', model: process.env.MASTRA_MODEL, tools: { searchDocuments } });
const out = await agent.generate('What is chunk overlap?', { maxSteps: 4 });</pre></x-code><x-ev>API familiarity.</x-ev></x-q>
<x-q n="9.24" tag="must basic"><x-t>What is a Mastra tool?</x-t><x-say>A typed function created with <code>createTool({ id, description, inputSchema, outputSchema, execute })</code> that agents can call; options include <code>requireApproval</code>. execute receives the validated input first and a context (with requestContext, abortSignal) second.</x-say><x-ev>API familiarity.</x-ev></x-q>
<x-q n="9.25" tag="must basic"><x-t>What is a Mastra workflow?</x-t><x-say>A graph of steps built with <code>createWorkflow({ id, inputSchema, outputSchema })</code> and <code>.then / .parallel / .branch / .foreach / .map</code>, finished with <code>.commit()</code>, executed through runs that persist snapshots to storage.</x-say><x-ev>API familiarity.</x-ev></x-q>
<x-q n="9.26" tag="must solid"><x-t>How do agents and workflows interact?</x-t><x-say>A workflow step can call an agent (for an open-ended sub-task) and an agent can be given a workflow as a tool. The workflow keeps the overall process predictable; the agent handles the part that needs judgement.</x-say><x-ev>Architecture.</x-ev></x-q>
<x-q n="9.27" tag="must basic"><x-t>How do you define a custom tool?</x-t><x-say><code>createTool</code> with a unique id, a description that says when to use it, Zod input/output schemas, and an execute that takes scope (user id) from the request context rather than from the input.</x-say><x-ev>API.</x-ev></x-q>
<x-q n="9.28" tag="must basic"><x-t>How do you define a workflow step?</x-t><x-say><code>createStep({ id, inputSchema, outputSchema, execute: async ({ inputData, ... }) => output })</code>, optionally with <code>suspendSchema</code>, <code>resumeSchema</code> and <code>retries</code>.</x-say><x-ev>API.</x-ev></x-q>
<x-q n="9.29" tag="must solid"><x-t>How do you pass data between workflow steps?</x-t><x-say>Each step’s output becomes the next step’s <code>inputData</code>; <code>.map()</code> reshapes it; after <code>.parallel()</code> the output is keyed by step id; <code>await getStepResultAsync(stepOrId)</code> reads an earlier step’s output (the sync <code>getStepResult</code> is deprecated); workflow state (<code>stateSchema</code>/<code>setState</code>) holds shared values.</x-say><x-ev>Data flow.</x-ev></x-q>
<x-q n="9.30" tag="must basic"><x-t>How do you validate step input and output?</x-t><x-say>With the step’s Zod <code>inputSchema</code> and <code>outputSchema</code>, which Mastra validates at runtime, plus your own Zod validation of any LLM output inside the step before returning it.</x-say><x-ev>Correctness.</x-ev></x-q>
<x-q n="9.31" tag="must solid"><x-t>How would you handle workflow errors?</x-t><x-say>Retries for transient failures (<code>retries</code> / <code>retryConfig</code>), catch-and-return for optional parallel work, <code>bail()</code> for expected early exits, check <code>result.status</code> after start/resume, record failures on your own tables, and make re-runs resume from the failed step through idempotent steps.</x-say><x-ev>Robustness.</x-ev></x-q>
<x-q n="9.32" tag="must solid"><x-t>How does suspend/resume work in your implementation?</x-t><x-say>The approval step calls <code>suspend({ outline })</code> when there’s no resumeData; the snapshot goes to Postgres and the API returns 202. The approval endpoint claims the course row for that user, then calls <code>run.resume({ step: 'approve-outline', resumeData })</code>; the step runs again from the top, sees resumeData, and continues or bails.</x-say><x-dm>For DocMind this is planned, not built (Phase 8). Say so honestly and walk through the plan.</x-dm><x-ev>Ownership of your design.</x-ev></x-q>
<x-q n="9.33" tag="must solid"><x-t>How would you persist workflow state?</x-t><x-say>Configure Mastra storage (e.g. <code>PostgresStore</code> from <code>@mastra/pg</code>, or only the workflows domain with <code>WorkflowsPG</code>), which saves snapshots per run; keep your own business tables for what users see, linked by run id.</x-say><x-ev>Design.</x-ev></x-q>
<x-q n="9.34" tag="must solid"><x-t>How would you implement human approval?</x-t><x-say>A step with suspend/resume schemas; the UI shows the suspend payload; an authenticated endpoint checks ownership and claims the pending state once, then resumes with the decision. For tool-level approval in agents, <code>requireApproval</code> + <code>approveToolCall()</code>.</x-say><x-ev>Design.</x-ev></x-q>
<x-q n="9.35" tag="must solid"><x-t>What happens when an external API fails during workflow execution?</x-t><x-say>The step throws; if it has retries, it’s retried with delay; if retries run out, the run fails with the snapshot saved; your code marks the business record failed and the user can retry, which skips completed work thanks to idempotent steps. For optional work, catch and continue.</x-say><x-ev>Failure handling.</x-ev></x-q>
<x-q n="9.36" tag="must solid"><x-t>What are the benefits and limitations of using a framework instead of implementing orchestration yourself?</x-t><x-say>Benefits: tested persistence, resume, claims, recovery, retries, typed steps and tracing without writing them. Limitations: a dependency that changes fast, abstractions that can hide behaviour (bail ends as success, cancel doesn’t stop a running step), extra tables and memory, and debugging through someone else’s code.</x-say><x-dm>DocMind hand-wrote its agent loop to learn it, and chose Mastra only for workflows after reading its 1.82 source and docs (dual CJS/ESM build, Node ≥ 22.13, atomic resume claim on Postgres).</x-dm><x-ev>Balanced judgement.</x-ev></x-q>

<h2 class="sec"><span class="k">9.3</span>Workflow scenarios</h2>
<x-scn t="Scenario A: course generation" tag="must solid">
<x-sit>A user asks an AI system to generate a complete course: understand the topic → outline → modules → lessons → quizzes → save.</x-sit>
<x-sq q="Would you use an agent or workflow?">A workflow: the steps and order are known, it’s long-running, needs approval and must survive failures. Individual steps call the LLM; an agent could be used inside one step if research is needed.</x-sq>
<x-sq q="Which steps should be sequential?">Understand → outline → approval → (content) → save. Lessons inside one module can be sequential if each builds on the previous one.</x-sq>
<x-sq q="Which could run in parallel?">Different modules’ lessons, and quizzes per module once their lessons exist, with a concurrency cap.</x-sq>
<x-sq q="How would you handle failure in lesson generation?">Step retries with backoff; a failed lesson fails the step after retries; drafts already saved stay; the run can be re-run and skips completed lessons.</x-sq>
<x-sq q="How would you resume after a crash?">Persisted snapshots + recovery re-drive the run from the last finished step; idempotent lesson writes prevent duplicates.</x-sq>
<x-sq q="How would you prevent saving an incomplete course?">Drafts table + a final publish step that checks counts and flips status in one transaction; readers only see published courses.</x-sq>
<x-say>“A workflow with an approval suspend, parallel lesson generation under a concurrency cap, idempotent drafts, and a transactional publish at the end.”</x-say>
</x-scn>
<x-scn t="Scenario B: human approval" tag="must solid">
<x-sit>A workflow generates a course outline but requires the user to approve it before lesson generation.</x-sit>
<x-sq q="How would you suspend execution?">The approval step calls <code>suspend({ outline })</code> when it has no resumeData.</x-sq>
<x-sq q="Where would you save the state?">In the workflow storage (Postgres snapshot) plus the outline and status on the course row for the UI.</x-sq>
<x-sq q="How would the frontend communicate approval?">It shows the outline from <code>GET /courses/:id</code> (status awaiting_approval) and calls <code>POST /courses/:id/approval { approved }</code> with the user’s token.</x-sq>
<x-sq q="How would you resume the workflow?">Check ownership and claim the waiting state with a conditional update, then <code>run.resume({ step: 'approve-outline', resumeData })</code>, ideally in the background with the client polling.</x-sq>
<x-sq q="What if the user never approves?">A scheduled job expires runs waiting longer than N days: <code>run.cancel()</code> and status expired; reminders before that; nothing is running meanwhile, so waiting costs only storage.</x-sq>
<x-vis><x-w w="workflow"></x-w></x-vis>
<x-say>“Suspend with the outline, persist, show it, resume through an owner-checked, claim-once endpoint, and expire stale waits.”</x-say>
</x-scn>
<x-scn t="Scenario C: partial failure (lessons 1–6 ok, 7 fails)" tag="must solid">
<x-sit>A workflow generates 10 lessons. Lessons 1–6 succeed, lesson 7 fails.</x-sit>
<x-sq q="Would you regenerate everything?">No. That wastes LLM spend and may change lessons the user already saw.</x-sq>
<x-sq q="How would you identify completed steps?">From persisted results: the lesson_drafts rows (course_id, module_no, lesson_no), and the workflow snapshot’s step results.</x-sq>
<x-sq q="How would you resume from the failed step?">Re-run with the same course: earlier steps detect they’re done and return stored results; the lesson step skips existing drafts and only generates 7–10.</x-sq>
<x-sq q="How would you avoid duplicate database records?">Primary key on (course_id, module_no, lesson_no) with <code>ON CONFLICT DO NOTHING</code>, and the skip check before calling the LLM.</x-sq>
<x-say>“State tells me what’s done; idempotent steps skip it; unique keys make duplicates impossible.”</x-say>
</x-scn>
<x-scn t="Scenario D: 20 quizzes for 20 modules" tag="must solid">
<x-sit>You need to generate 20 quizzes for 20 different modules.</x-sit>
<x-sq q="Would you execute them sequentially or in parallel?">In parallel with a cap (e.g. 3–5 at a time): <code>.foreach(writeQuiz, { concurrency: 4 })</code>.</x-sq>
<x-sq q="What are the benefits of parallel execution?">Total time drops from the sum to roughly (20 / concurrency) × average call time.</x-sq>
<x-sq q="What could go wrong?">429s from the provider, token-per-minute limits, DB pool exhaustion, higher cost spikes, one failure failing the whole block, logs interleaving.</x-sq>
<x-sq q="How would you implement concurrency limits?">The framework’s concurrency option, or a pool of N workers pulling from a queue (Phase 11, exercise 2), or a job queue with worker concurrency.</x-sq>
<x-sq q="How would you handle rate limits from the LLM provider?">Cap concurrency below the limit, retry 429s with backoff + jitter honouring Retry-After, a shared token bucket across workers, and spread work over time for very large batches.</x-sq>
<x-vis><x-w w="concurrency"></x-w></x-vis>
<x-say>“Parallel with a concurrency cap tuned to the provider limits, plus backoff on 429 and per-item retries so one failure doesn’t sink the batch.”</x-say>
</x-scn>

<h2 class="sec"><span class="k">✓</span>Checkpoint</h2>
<x-quiz id="qz-p09">
<x-mcq a="2"><x-t>A step inserts a row, then calls suspend(). After resume, the table has two rows. Why?</x-t><x-o>A Mastra bug</x-o><x-o>The resume ran twice</x-o><x-o>On resume, the suspended step’s execute runs again from the top</x-o><x-o>The snapshot was lost</x-o><x-why>Side effects go below the suspend check (or in the next step).</x-why></x-mcq>
<x-mcq a="0"><x-t>A Mastra run ends with bail({ outcome: 'rejected' }). Its status is…</x-t><x-o>success, with the bail payload as result</x-o><x-o>failed</x-o><x-o>canceled</x-o><x-o>suspended</x-o><x-why>Read result.outcome, not only status.</x-why></x-mcq>
<x-mcq a="3"><x-t>Two approval clicks arrive at once. What stops a double resume?</x-t><x-o>A longer timeout</x-o><x-o>Disabling the button only</x-o><x-o>Nothing</x-o><x-o>An atomic claim: UPDATE … WHERE status = 'awaiting' RETURNING (and Mastra’s own suspended→running claim)</x-o><x-why>One conditional update wins; the other gets 0 rows → 409.</x-why></x-mcq>
<x-mcq a="1"><x-t>Default concurrency of <code>.foreach()</code> in Mastra?</x-t><x-o>Unlimited</x-o><x-o>1 (sequential)</x-o><x-o>4</x-o><x-o>10</x-o><x-why>Set it explicitly.</x-why></x-mcq>
</x-quiz>

</template>
<template id="tpl-p10">
<x-obj><ul><li>Run a 15-minute system design conversation with a repeatable method.</li><li>Design four AI applications end to end: document chat, quiz generator, support assistant, AI search.</li><li>Justify each component and say what you’d leave out at small scale.</li></ul></x-obj>
<x-pre><ul><li>Phases 3–9. System design reuses all of them.</li></ul></x-pre>

<h2 class="sec"><span class="k">10.A</span>The method</h2>
<x-lesson t="How to run a junior system design interview" tag="must">
<x-def>System design = turning a vague product request into components, data, APIs and flows, then stress-testing it with failures and growth.</x-def>
<x-in><ol><li><b>Requirements (3 min):</b> users, core actions, non-functional needs (latency, scale: “1,000 users, 10 uploads/day each?”, privacy, cost). Write assumptions down out loud.</li><li><b>Components (3 min):</b> client, API, auth, database, object storage, queue + workers, LLM/embedding providers, cache, observability.</li><li><b>Data model (3 min):</b> tables and keys; who owns what.</li><li><b>API (2 min):</b> the 4–6 endpoints, request/response, sync vs async (202 + polling/SSE).</li><li><b>Data flow (3 min):</b> walk one request through every box. Interviewers explicitly want the flow, not just boxes.</li><li><b>Failure and scale (rest):</b> what if the LLM is down, a worker crashes, a user uploads 2,000 pages, traffic ×10. Where’s the bottleneck? What’s the first thing you’d add?</li></ol></x-in>
<x-mist><ul><li>Starting with Kubernetes and microservices for 1,000 users.</li><li>Drawing boxes without data flow or ownership.</li><li>Forgetting authorization, cost and observability.</li></ul></x-mist>
</x-lesson>

<h2 class="sec"><span class="k">10.1</span>Document chat application</h2>
<x-lesson t="Walkthrough: document chat" tag="must">
<x-vis><x-w w="flow" f="sd_docchat"></x-w></x-vis>
<x-impl><pre data-l="text">API
POST /documents            → presigned upload URL + document row (status: uploading)
POST /documents/:id/finish → enqueue ingest job → 202 { status: processing }
GET  /documents            → list with status/progress
DELETE /documents/:id      → owner check, delete row (cascade), delete file
POST /conversations        → { documentIds[] }
POST /conversations/:id/messages (SSE) → streamed answer + sources
GET  /conversations/:id/messages

TABLES  users · documents(user_id, storage_key, sha256, status, pages_done, pages_total)
        chunks(document_id, chunk_index, content, embedding, page, heading)
        conversations(user_id) · conversation_documents · messages(conversation_id, role, content, metadata jsonb)</pre></x-impl>
<x-walk><ol><li>Upload: browser → presigned PUT to object storage (API never holds the bytes) → finish call → job queued.</li><li>Worker: download → extract → chunk → embed (batched, rate-limited) → insert chunks → status ready; progress counters updated.</li><li>Chat: auth → conversation owned by user? → rewrite query with history → embed → hybrid search filtered by the conversation’s documents and user → rerank → prompt with sources → stream → save both messages with sources and token usage.</li></ol></x-walk>
<x-dm>DocMind is this design at a smaller scale: no object storage (PDF parsed in the request, 10 MB cap), BullMQ for embedding only, pgvector without an index, no conversations table (session ids on messages), SSE streaming, per-user scoping everywhere.</x-dm>
</x-lesson>
<x-q n="10.1.1" tag="must solid"><x-t>What components would you need?</x-t><x-say>Web client, API server with auth and rate limiting, Postgres with pgvector, object storage for files, a queue with workers for ingestion, embedding and LLM providers, and logging/metrics/tracing. Redis for the queue and caching.</x-say><x-ev>Completeness without over-building.</x-ev></x-q>
<x-q n="10.1.2" tag="must basic"><x-t>How would the frontend communicate with the backend?</x-t><x-say>HTTPS JSON REST for CRUD, Server-Sent Events for streamed answers, direct-to-storage presigned uploads for files, and polling or SSE for ingestion status. Auth token in the Authorization header (or httpOnly cookie on the same site).</x-say><x-ev>Protocol choices.</x-ev></x-q>
<x-q n="10.1.3" tag="must basic"><x-t>Where would you store uploaded documents?</x-t><x-say>In object storage (S3, R2, GCS) under a key like <code>users/{userId}/{documentId}.pdf</code>, private, accessed through short-lived signed URLs; the database stores only the key and metadata.</x-say><x-ev>Right storage for blobs.</x-ev></x-q>
<x-q n="10.1.4" tag="must basic"><x-t>Where would you store extracted text?</x-t><x-say>Chunk text in the chunks table next to its embedding (needed for prompts and keyword search); optionally the full extracted text as a file in object storage for re-chunking later without re-extracting.</x-say><x-ev>Reasoning.</x-ev></x-q>
<x-q n="10.1.5" tag="must basic"><x-t>Where would you store embeddings?</x-t><x-say>In Postgres with pgvector on the chunks table at this scale (joins with ownership, transactions, one system); a dedicated vector DB only when scale or features demand it.</x-say><x-ev>Pragmatism.</x-ev></x-q>
<x-q n="10.1.6" tag="must solid"><x-t>How would you structure the database?</x-t><x-say>users → documents (owner, status, hash) → chunks (embedding, text, page, heading); conversations (owner) ↔ documents via a join table; messages per conversation with metadata JSONB for sources and usage. Foreign keys with cascade, indexes on owner and conversation, unique (document_id, chunk_index).</x-say><x-ev>Data modelling.</x-ev></x-q>
<x-q n="10.1.7" tag="must solid"><x-t>How would you process uploaded documents?</x-t><x-say>Asynchronously: the API records the document and enqueues a job; workers extract, clean, chunk, embed in batches and store; the job is idempotent and retried; status and progress are updated; failures are recorded with a reason.</x-say><x-ev>Async design.</x-ev></x-q>
<x-q n="10.1.8" tag="must solid"><x-t>How would you implement RAG?</x-t><x-say>Rewrite the question with history, embed it, hybrid retrieval scoped to the conversation’s documents and the user, rerank the top 30–50 to 5–8, build a labelled context, generate with grounding and citations, stream, and evaluate offline with a labelled set.</x-say><x-ev>Applied RAG.</x-ev></x-q>
<x-q n="10.1.9" tag="must basic"><x-t>How would you manage chat history?</x-t><x-say>Store every message in the database; send the last N turns (by token budget) to the model; summarise older turns into a running summary when conversations get long; keep sources and tool results in metadata so reopened chats are complete.</x-say><x-ev>Memory management.</x-ev></x-q>
<x-q n="10.1.10" tag="must basic"><x-t>How would you handle multiple users?</x-t><x-say>Authentication on every request, an owner column on every user-owned table, every query filtered by the user id from the token, per-user quotas and rate limits.</x-say><x-ev>Multi-tenancy basics.</x-ev></x-q>
<x-q n="10.1.11" tag="must solid"><x-t>How would you enforce document permissions?</x-t><x-say>In the data layer: repository functions require a userId and include it in every WHERE/JOIN (including vector search); someone else’s id returns 404; shared documents use an ACL table checked the same way; optionally Postgres row-level security as a backstop.</x-say><x-ev>Security.</x-ev></x-q>
<x-q n="10.1.12" tag="must basic"><x-t>How would you track ingestion status?</x-t><x-say>A status column (uploading, processing, ready, failed) plus progress counters and an error message on the document row, updated by workers; the client polls or subscribes via SSE; chat refuses non-ready documents with 409.</x-say><x-ev>UX + correctness.</x-ev></x-q>
<x-q n="10.1.13" tag="must solid"><x-t>How would you handle large files?</x-t><x-say>Size and page limits, direct-to-storage uploads, workers processing page ranges with bounded memory, batched embeddings, progress tracking, partial retries per range.</x-say><x-ev>Scale thinking.</x-ev></x-q>
<x-q n="10.1.14" tag="must solid"><x-t>How would you scale document processing?</x-t><x-say>Add workers horizontally (the queue distributes jobs), split big documents into page-range jobs, cap per-worker concurrency to provider rate limits, prioritise small/paid jobs, and autoscale on queue depth.</x-say><x-ev>Scaling.</x-ev></x-q>

<h2 class="sec"><span class="k">10.2</span>AI quiz generator</h2>
<x-lesson t="Walkthrough: quiz generator" tag="must"><x-vis><x-w w="flow" f="sd_quiz"></x-w></x-vis>
<x-impl><pre data-l="sql">quizzes(id, user_id, document_id, status, idempotency_key UNIQUE per user, created_at)
questions(id, quiz_id, position, question, options jsonb, correct_index, explanation, source_chunk_id,
          question_embedding vector(768), status)   -- draft | approved | rejected</pre></x-impl></x-lesson>
<x-q n="10.2.1" tag="must basic"><x-t>How would you extract information?</x-t><x-say>Reuse the ingestion pipeline (extract, clean, chunk); for quizzes, sample chunks to cover the whole material (per section or evenly spaced), not a similarity search.</x-say><x-dm>DocMind’s quiz uses <code>sampleChunks</code> for broad coverage, not <code>searchSimilar</code>.</x-dm><x-ev>Coverage awareness.</x-ev></x-q>
<x-q n="10.2.2" tag="must basic"><x-t>How would you generate questions?</x-t><x-say>An LLM call per section or batch in structured-output mode with a schema (question, 4 options, correct index, explanation, source chunk), low-moderate temperature, instructions to use only the given text and vary difficulty.</x-say><x-ev>Structured generation.</x-ev></x-q>
<x-q n="10.2.3" tag="must solid"><x-t>How would you validate generated questions?</x-t><x-say>Zod schema (exactly 4 distinct options, index 0–3), business checks (answer supported by the source chunk, no “all of the above”), an optional judge pass that answers the question from the source to confirm the key, shuffle options in code, retry invalid ones.</x-say><x-dm>DocMind retries once, then 502, and shuffles options because answer positions were skewed (22/36/32/10%).</x-dm><x-ev>Quality control.</x-ev></x-q>
<x-q n="10.2.4" tag="must solid"><x-t>How would you prevent duplicate questions?</x-t><x-say>Normalise and compare text, embed each question and drop any with cosine similarity above a threshold to existing ones in the quiz, pass existing questions to the generator as “don’t repeat”, and a unique constraint on normalised text per quiz.</x-say><x-ev>Dedup techniques.</x-ev></x-q>
<x-q n="10.2.5" tag="must basic"><x-t>How would you store questions and answers?</x-t><x-say>A quizzes table and a questions table (one row per question with options JSONB, correct index, explanation, source chunk id, position, status), plus attempts/answers tables if users take quizzes server-side.</x-say><x-ev>Modelling.</x-ev></x-q>
<x-q n="10.2.6" tag="must solid"><x-t>How would you handle partially completed generation?</x-t><x-say>Generate in batches saved as drafts with a status; on failure keep finished batches and retry only missing ones (idempotent by quiz + batch number); show progress; mark the quiz ready only when the target count is met or let the user accept fewer.</x-say><x-ev>Resilience.</x-ev></x-q>
<x-q n="10.2.7" tag="must basic"><x-t>How would you allow users to regenerate individual questions?</x-t><x-say><code>POST /quizzes/:id/questions/:qid/regenerate</code>: owner check, regenerate from the same source chunk with the other questions as “avoid”, validate, replace that row (or version it), keep position.</x-say><x-ev>API design.</x-ev></x-q>
<x-q n="10.2.8" tag="must solid"><x-t>How would you evaluate question quality?</x-t><x-say>Automatic checks (answerable from source, single correct option, distractor plausibility via a judge model, difficulty spread), user signals (reports, skip rate, correct rate per question), and periodic human review of samples.</x-say><x-ev>Evaluation mindset.</x-ev></x-q>

<h2 class="sec"><span class="k">10.3</span>AI customer support assistant</h2>
<x-lesson t="Walkthrough: support assistant" tag="must"><x-vis><x-w w="flow" f="sd_support"></x-w></x-vis></x-lesson>
<x-q n="10.3.1" tag="must basic"><x-t>How would you ingest company documents?</x-t><x-say>Connectors or uploads for help-centre articles, PDFs and FAQs; scheduled re-sync with change detection (hash/updated_at) to re-embed only changed docs; structure-aware chunking by heading; metadata for product, version, audience and visibility.</x-say><x-ev>Freshness.</x-ev></x-q>
<x-q n="10.3.2" tag="must basic"><x-t>How would you retrieve relevant information?</x-t><x-say>Hybrid search (product names and error codes need keywords) with metadata filters (product, version, public vs internal), reranking, and query rewriting from the conversation.</x-say><x-ev>Retrieval design.</x-ev></x-q>
<x-q n="10.3.3" tag="must solid"><x-t>How would you maintain customer context?</x-t><x-say>The authenticated customer’s profile, plan and recent orders loaded through read-only tools scoped to their id; conversation history with summaries; a ticket id linking sessions.</x-say><x-ev>Context design.</x-ev></x-q>

async function handleChat(body, llm) {
  const message = typeof body?.message === 'string' ? body.message.trim() : '';
  if (!message) return { status: 400, json: { error: 'message is required' } };
  if (message.length > 4000) return { status: 400, json: { error: 'message must be at most 4000 characters' } };
  try {
    const reply = await llm.generate(message);
    if (!reply || !reply.trim()) return { status: 502, json: { error: 'The AI service returned an empty answer. Please retry.' } };
    return { status: 200, json: { reply } };
  } catch (err) {
    console.log('llm failed:', err.message);               // real code: structured log with request id
    if (err.status === 429 || err.status >= 500 || err.name === 'TimeoutError') {
      return { status: 503, json: { error: 'The AI service is busy. Please retry in a moment.' } };
    }
    return { status: 502, json: { error: 'The AI service failed. Please retry.' } };
  }
}
</x-ref>
</x-run>

<x-ref>
async function mapWithConcurrency(items, limit, fn) {
  const results = new Array(items.length);
  let next = 0;                                   // shared cursor: safe because JS runs one callback at a time
  async function worker() {
    while (next &lt; items.length) {
      const i = next++;
      try {
        results[i] = { status: 'fulfilled', value: await fn(items[i], i) };
      } catch (reason) {
        results[i] = { status: 'rejected', reason };
      }
    }
  }
  const n = Math.max(1, Math.min(limit, items.length));
  await Promise.all(Array.from({ length: n }, worker));
  return results;
}
</x-ref>
</x-run>
<x-expl><code>next++</code> is safe without locks: the event loop runs one callback at a time and the read-and-increment happens synchronously. Each worker awaits one call at a time, so at most <code>n</code> are in flight. try/catch inside the loop isolates failures. Usage: <code>const r = await mapWithConcurrency(docs, 3, (d) => embed(d.text)); const ok = r.filter(x => x.status === 'fulfilled')</code>.</x-expl>
<x-cx>Time ≈ (sum of durations) / limit in the best case; O(n) extra space for results.</x-cx>
<x-mist><ul><li><code>Promise.all(items.map(fn))</code>: all at once.</li><li>Chunking into fixed batches of 3 (<code>for … await Promise.all(batch)</code>): works, but each batch waits for its slowest item, wasting time.</li><li>Letting one rejection reject everything.</li></ul></x-mist>
<x-fu q="How would you retry failed requests without exceeding provider rate limits?">Wrap fn with retryWithBackoff (exercise 3) for retryable errors only, keep the concurrency cap, honour Retry-After, and add a shared rate limiter (token bucket: e.g. 100 requests/min) that every worker awaits before calling; collect permanent failures for a later re-run.</x-fu>
</x-ex>

test('delay is capped', async () => { const d = []; await retryWithBackoff(failTimes(4, 500), 4, { baseMs: 1000, maxMs: 3000, jitter: false, sleep: async (ms) => d.push(ms) }); eq(d, [1000, 2000, 3000, 3000]); });

<x-ref>
function isRetryable(err) {
  if (typeof err?.status === 'number') return err.status === 429 || err.status >= 500;
  return true;                                     // no HTTP status: timeout / connection reset → transient
}
async function retryWithBackoff(fn, maxRetries, { baseMs = 100, maxMs = 10000, jitter = true, sleep: wait = sleep } = {}) {
  for (let attempt = 0; ; attempt++) {
    try {
      return await fn(attempt);
    } catch (err) {
      if (attempt >= maxRetries || !isRetryable(err)) throw err;
      const cap = Math.min(maxMs, baseMs * 2 ** attempt);
      const delay = err.retryAfterMs ?? (jitter ? Math.round(Math.random() * cap) : cap);
      console.log(`attempt ${attempt + 1} failed (${err.status ?? err.message}); retrying in ${delay} ms`);
      await wait(delay);
    }
  }
}
</x-ref>
</x-run>
<x-expl>The loop tries, and on failure decides: give up (out of retries, or not retryable) or wait and loop. Exponential growth gives the provider room; the cap bounds the worst case; injectable sleep keeps tests fast.</x-expl>
<x-cx>At most maxRetries + 1 calls; worst-case waiting ≈ sum of caps.</x-cx>
<x-mist><ul><li>Retrying 400/401 (wastes calls, delays the real error).</li><li>Off-by-one: maxRetries = 3 should mean 4 attempts total.</li><li>Swallowing the final error.</li></ul></x-mist>
<x-fu q="How would you add jitter?">Full jitter: wait a random time between 0 and the exponential cap (<code>Math.random() * cap</code>), as in the reference. It spreads out clients that failed at the same moment so they don’t retry in lockstep (thundering herd). “Equal jitter” keeps half the cap fixed plus a random half.</x-fu>
</x-ex>

<h2 class="sec"><span class="k">11.4</span>Exercise 4: SQL</h2>
<x-ex t="Exercise 4: six queries on users and documents" tag="must basic" open>
<x-prob><p>Given:</p><div class="two"><table><thead><tr><th>users.id</th><th>name</th></tr></thead><tbody><tr><td>1</td><td>Alex</td></tr><tr><td>2</td><td>John</td></tr></tbody></table><table><thead><tr><th>documents.id</th><th>user_id</th><th>title</th></tr></thead><tbody><tr><td>1</td><td>1</td><td>AI Basics</td></tr><tr><td>2</td><td>1</td><td>RAG Guide</td></tr><tr><td>3</td><td>2</td><td>Node.js Guide</td></tr></tbody></table></div>

<x-sol><pre data-l="sql">-- 1. all documents
SELECT id, user_id, title FROM documents;

-- 2. Alex's documents (join on the relationship, filter by name; in an app you'd filter by user id)
SELECT d.id, d.title FROM documents d JOIN users u ON u.id = d.user_id WHERE u.name = 'Alex';
-- → (1, AI Basics), (2, RAG Guide)

-- 3. count per user, including users with zero
SELECT u.id, u.name, count(d.id) AS document_count
FROM users u LEFT JOIN documents d ON d.user_id = u.id
GROUP BY u.id, u.name ORDER BY document_count DESC;
-- → Alex 2, John 1

-- 4. users with no documents
SELECT u.id, u.name FROM users u
WHERE NOT EXISTS (SELECT 1 FROM documents d WHERE d.user_id = u.id);
-- → (empty with this data; add user 3 'Mira' to see a row)

-- 5. latest five (needs created_at; the table shown has none)
SELECT id, title, created_at FROM documents ORDER BY created_at DESC, id DESC LIMIT 5;
-- without created_at: ORDER BY id DESC LIMIT 5 (only valid if ids increase with time)

-- 6. user with the most documents (all users in case of a tie)
WITH counts AS (SELECT user_id, count(*) AS n FROM documents GROUP BY user_id)
SELECT u.id, u.name, c.n FROM counts c JOIN users u ON u.id = c.user_id
WHERE c.n = (SELECT max(n) FROM counts);

<x-expl>3 uses LEFT JOIN and <code>count(d.id)</code> so zero-document users show 0. 4: NOT EXISTS is clear and handles NULLs safely (NOT IN breaks if the subquery returns a NULL). 5: point out the missing timestamp instead of guessing. 6: mention ties; the CTE version returns all tied users.</x-expl>
<x-mist><ul><li><code>count(*)</code> with LEFT JOIN (counts 1 for users with none).</li><li><code>WHERE id NOT IN (SELECT user_id FROM documents)</code> when user_id can be NULL.</li><li>Ordering by title for “latest”.</li></ul></x-mist>

const tools = {
  getWeather: { params: { city: { type: 'string', required: true, maxLength: 100 } }, run: async ({ city }) => ({ city, tempC: 31 }) },
  searchDocuments: { params: { query: { type: 'string', required: true, maxLength: 500 } }, run: async ({ query }, ctx) => ctx.search(ctx.userId, query) },
  getUserProfile: {
    params: { userId: { type: 'string', required: true } },
    authorize: (args, ctx) => args.userId === ctx.userId || ctx.role === 'admin',   // ownership rule in code
    run: async ({ userId }, ctx) => ctx.profiles[userId],
  },
};

function validate(params, args) {
  if (typeof args !== 'object' || args === null || Array.isArray(args)) return 'arguments must be an object';
  for (const key of Object.keys(args)) if (!Object.hasOwn(params, key)) return `unexpected argument "${key}"`;
  for (const [key, rule] of Object.entries(params)) {
    const v = args[key];
    if (v === undefined) { if (rule.required) return `"${key}" is required`; continue; }
    if (typeof v !== rule.type) return `"${key}" must be a ${rule.type}`;
    if (rule.maxLength &amp;&amp; v.length > rule.maxLength) return `"${key}" is too long`;
    if (rule.type === 'string' &amp;&amp; !v.trim()) return `"${key}" must not be empty`;
  }
  return null;
}

const timeout = (ms) => new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms));

async function executeToolCall(call, ctx) {
  const fail = (error) => ({ toolCallId: call.id, ok: false, error });
  if (!Object.hasOwn(tools, call.name)) return fail(`Unknown tool "${call.name}"`);
  const tool = tools[call.name];
  let args;
  try { args = JSON.parse(call.arguments ?? '{}'); } catch { return fail('arguments are not valid JSON'); }
  const problem = validate(tool.params, args);
  if (problem) return fail(problem);
  if (tool.authorize &amp;&amp; !tool.authorize(args, ctx)) return fail('not allowed');
  try {
    const result = await Promise.race([tool.run(args, ctx), timeout(5000)]);
    return { toolCallId: call.id, ok: true, result };
  } catch (err) {
    console.log(`tool ${call.name} failed: ${err.message}`);     // internal detail stays in logs
    return fail('The tool failed. Try again later.');
  }
}
</x-ref>
</x-run>
<x-expl>Order matters: lookup (own properties only) → parse → validate (types, required, unknown keys, lengths) → authorize (in code, using ctx from the session) → execute with a timeout → result or safe error. Returning data instead of throwing keeps the agent loop alive and lets the model react.</x-expl>
<x-cx>O(size of arguments) for parse + validation.</x-cx>
<x-mist><ul><li><code>tools[call.name]</code> without an own-property check (prototype keys).</li><li>Trusting <code>userId</code> from the model.</li><li>Throwing on bad input instead of returning an error result.</li></ul></x-mist>
<x-fu q="How would you prevent a user from invoking tools they aren’t authorized to use?">Only send the model the tools this user’s role allows (so it can’t even ask), and still check permissions in <code>executeToolCall</code> (role/ownership from the session), plus approval for sensitive tools and audit logs.</x-fu>
</x-ex>

<x-ref>
function cosine(a, b) {
  if (a.length !== b.length) return null;
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i &lt; a.length; i++) { dot += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
  if (na === 0 || nb === 0) return null;
  return dot / (Math.sqrt(na) * Math.sqrt(nb));
}
function topK(query, chunks, { k = 5, filter = {} } = {}) {
  if (!Array.isArray(chunks) || chunks.length === 0) return [];
  const matches = (c) => Object.entries(filter).every(([key, v]) => c.metadata?.[key] === v);
  const scored = [];
  for (const c of chunks) {
    if (!matches(c)) continue;                         // filter first: it's a permission check
    const score = cosine(query, c.embedding);
    if (score !== null) scored.push({ id: c.id, score });
  }
  scored.sort((x, y) => y.score - x.score || String(x.id).localeCompare(String(y.id)));  // stable tie-break
  return scored.slice(0, k);
}
</x-ref>
</x-run>
<x-cx>O(n·d) to score n chunks of dimension d, O(n log n) to sort (O(n log k) with a size-k heap). That linear scan is exactly what ANN indexes (HNSW) avoid at scale.</x-cx>
<x-mist><ul><li>Filtering after taking the top 5 (returns fewer results or leaks).</li><li>Sorting ascending.</li><li>Dividing by zero for empty vectors.</li></ul></x-mist>
<x-fu q="How would you improve retrieval?">Hybrid search with keywords, query rewriting, better chunking, a reranker, a relevance threshold, and measuring recall@k on a labelled set.</x-fu>
<x-fu q="Would you use a vector database?">Yes beyond small collections: pgvector or a vector DB with an ANN index, metadata filtering and persistence instead of an in-memory scan.</x-fu>
<x-fu q="Where would reranking fit?">After this first-stage retrieval: take the top 30–50, rerank with a cross-encoder, keep 5.</x-fu>
</x-ex>

<h2 class="sec"><span class="k">11.9</span>Exercise 9: Streaming</h2>
<x-ex t="Exercise 9: stream an LLM response" tag="must solid" open>
<x-prob>Build a basic backend endpoint that streams an LLM response to the client.</x-prob>
<x-sol><p>Server: the SSE relay in Phase 5 (“Streaming LLM output to the client”). Client:</p>
<pre data-l="js">// browser: read the SSE stream with fetch (EventSource can't send an Authorization header or a POST body)
async function streamChat(messages, onText, signal) {
  const res = await fetch('/chat/stream', { method: 'POST', signal,
    headers: { 'content-type': 'application/json', authorization: `Bearer ${token}` }, body: JSON.stringify({ messages }) });
  if (!res.ok) throw new Error((await res.json()).error);    // errors before the stream starts are plain JSON
  const reader = res.body.getReader(); const decoder = new TextDecoder(); let buf = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) throw new Error('Connection lost');               // ended without a done event
    buf += decoder.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) !== -1) {
      const raw = buf.slice(0, i); buf = buf.slice(i + 2);
      const event = raw.match(/^event: (.*)$/m)?.[1] ?? 'message';
      const data = JSON.parse(raw.match(/^data: (.*)$/m)?.[1] ?? '{}');
      if (event === 'done') return;
      if (event === 'error') throw new Error(data.error);
      if (event === 'message') onText(data.text);
    }
  }
}</pre></x-sol>
<x-fu q="What is Server-Sent Events?">A standard for a server to push a stream of text events over one long HTTP response (<code>Content-Type: text/event-stream</code>), each event as <code>event:</code>/<code>data:</code> lines ending with a blank line. One direction (server → client), plain HTTP, works through most proxies, automatic reconnection in EventSource.</x-fu>
<x-fu q="How does streaming differ from WebSockets?">WebSockets are a separate bidirectional protocol (upgrade handshake, frames) for real-time two-way traffic (multiplayer, collaborative editing). SSE is one-way over HTTP, simpler, enough for token streaming, and easier with auth headers via fetch.</x-fu>
<x-fu q="How do you handle client disconnection?">Listen to <code>res.on('close')</code> (or <code>req.on('close')</code>), abort the upstream fetch with an AbortController so you stop paying for tokens, and decide whether to save the partial answer.</x-fu>
<x-fu q="How do you clean up an ongoing generation?">Abort the provider request, release resources (DB clients, timers), end the response, mark the message as interrupted, and make sure no later code writes to a closed response.</x-fu>
<x-mist><ul><li>Splitting on single newlines; not using <code>{ stream: true }</code> in TextDecoder.</li><li>Treating a stream that just ends as success.</li><li>Sending JSON errors after headers were sent (status is already 200: send an <code>event: error</code>).</li></ul></x-mist>
</x-ex>

<h2 class="sec"><span class="k">11.10</span>Exercise 10: Workflow implementation</h2>
<x-ex t="Exercise 10: a simplified course-generation workflow" tag="must solid" open>
<x-prob>Steps: 1) generate outline, 2) generate modules, 3) generate lessons, 4) save course. Pass data between steps, handle failures, retry selected operations, prevent duplicate saves, record execution status.</x-prob>
<x-req><ul><li>Pass data between steps.</li><li>Handle failures.</li><li>Retry selected operations.</li><li>Prevent duplicate saves.</li><li>Record execution status.</li></ul></x-req>
<x-hint>A run record <code>{ status, results: { stepId: output } }</code> saved after every step. On start, load it: skip steps that already have results. Each step has <code>retries</code>. The save step upserts by an idempotency key.</x-hint>

// steps: [{ id, retries, run: async (input, ctx) => output }]  — each step gets the previous step's output

<x-ref>
async function runWorkflow({ runId, steps, input, store, ctx }) {
  const record = (await store.get(runId)) ?? { status: 'pending', input, results: {}, error: null };
  if (record.status === 'success') return { status: 'success', result: record.result };   // idempotent: never re-run
  record.status = 'running'; record.error = null;
  await store.set(runId, record);

  let data = record.input;
  for (const step of steps) {
    if (step.id in record.results) { data = record.results[step.id]; continue; }          // completed earlier: skip
    let lastErr;
    for (let attempt = 0; attempt &lt;= (step.retries ?? 0); attempt++) {
      try {
        data = await step.run(data, ctx);
        lastErr = null;
        break;
      } catch (err) {
        lastErr = err;
        console.log(`${runId}/${step.id} attempt ${attempt + 1} failed: ${err.message}`);
      }
    }
    if (lastErr) {
      record.status = 'failed'; record.error = { step: step.id, message: lastErr.message };
      await store.set(runId, record);
      return { status: 'failed', error: record.error };
    }
    record.results[step.id] = data;                                                        // persist after each step
    await store.set(runId, record);
  }
  record.status = 'success'; record.result = data;
  await store.set(runId, record);
  return { status: 'success', result: data };
}
</x-ref>
</x-run>
<x-expl>Three layers prevent duplicates: a finished run returns its stored result; completed steps are skipped on re-run; and the save step itself is keyed by an idempotency key, so even two different runs for the same request create one course (in a real DB that’s a UNIQUE constraint + <code>ON CONFLICT</code>). Status is persisted after each step, which is what a framework like Mastra does with snapshots.</x-expl>
<x-cx>O(steps × (retries + 1)) step executions in the worst case.</x-cx>
<x-mist><ul><li>Saving status only at the end (a crash loses everything).</li><li>Retrying non-idempotent steps.</li><li>Relying only on the run id for dedupe (two runs for the same request still duplicate).</li></ul></x-mist>
</x-ex>

<template id="tpl-p12">
<x-obj><ul><li>Apply one debugging method to any production problem, out loud.</li><li>Answer all 10 production scenarios from the bank with causes, investigation, fix and what to say.</li><li>Diagnose broken snippets before reading the answer.</li></ul></x-obj>

<h2 class="sec"><span class="k">12.A</span>The method</h2>
<x-lesson t="A repeatable debugging methodology" tag="must">
<x-def>A fixed sequence you follow for every incident, so you don’t guess-and-patch under pressure.</x-def>
<x-in><ol><li><b>Reproduce</b> the issue (or find a request that shows it). Note exact input, user, time, environment.</li><li><b>Collect evidence:</b> logs by request id, error messages and cause chains, metrics (latency, error rate, saturation), recent deploys/config changes, traces.</li><li><b>Identify the failing component:</b> client, API, DB, queue, worker, LLM provider, network. Narrow by timing each stage.</li><li><b>Form hypotheses</b> ranked by likelihood × ease of checking.</li><li><b>Test hypotheses</b> one at a time with a measurement, not a feeling. Change one thing.</li><li><b>Fix the root cause</b>, not the symptom (raising a timeout is rarely the fix).</li><li><b>Add a regression test</b> (and an alert if it could recur silently).</li><li><b>Monitor</b> the result after deploy; write down what happened.</li></ol></x-in>
<x-dm><p>Real examples from DocMind’s logs: a stream that showed nothing (Gemini’s <code>\r\n</code> line endings split across reads → normalise on the whole buffer); the rate limiter keying on proxies (measured the <code>RateLimit-Policy</code> partition key against <code>sha256(client IP)</code> for hop counts 1, 2, 3); production sharing the laptop’s queue (found because there were 0 keys under the <code>docmind:</code> prefix); a DNS resolver refusing the Neon hostname on a hotspot (not a code bug).</p></x-dm>
<x-mist><ul><li>Changing several things at once.</li><li>“Works on my machine” without comparing environments.</li><li>Declaring victory without a test or a metric.</li></ul></x-mist>
</x-lesson>

<h2 class="sec"><span class="k">12.B</span>Diagnose these snippets first</h2>
<x-ex t="Snippet 1: the leaking pool" tag="must solid">
<x-prob><pre data-l="js">async function transfer(from, to, amount) {
  const client = await pool.connect();
  await client.query('BEGIN');
  await client.query('UPDATE accounts SET balance = balance - $1 WHERE id = $2', [amount, from]);
  if (amount > 1000) throw new Error('limit');
  await client.query('UPDATE accounts SET balance = balance + $1 WHERE id = $2', [amount, to]);
  await client.query('COMMIT');
  client.release();
}</pre>What breaks under load?</x-prob>
<x-sol>Any throw (the limit check or a failed query) skips ROLLBACK and <code>release()</code>: the transaction stays open holding a row lock and the client never returns to the pool. After <code>max</code> such errors, every request waits forever for a connection. Fix: <code>try { … COMMIT } catch (e) { await client.query('ROLLBACK'); throw e; } finally { client.release(); }</code>, and validate the limit before BEGIN.</x-sol>
</x-ex>
<x-ex t="Snippet 2: the silent stream" tag="must solid">
<x-prob><pre data-l="js">for await (const chunk of res.body) {
  for (const line of chunk.toString().split('\n')) {
    if (line.startsWith('data: ')) send(JSON.parse(line.slice(6)).text);
  }
}</pre>Sometimes the stream crashes with a JSON error, or characters like “é” turn into garbage. Why?</x-prob>
<x-sol>Network chunks don’t align with events or characters. A <code>data:</code> line split across two chunks → <code>JSON.parse</code> of half a line throws; a multi-byte UTF-8 character split across chunks → <code>toString()</code> per chunk produces replacement characters. Fix: one <code>TextDecoder</code> with <code>{ stream: true }</code>, accumulate into a buffer, split on the blank line between events (after normalising <code>\r\n</code>), keep the trailing partial event for the next chunk.</x-sol>
</x-ex>
<x-ex t="Snippet 3: the agent that never stops" tag="must solid">
<x-prob><pre data-l="js">while (true) {
  const msg = await callModel({ messages, tools });
  messages.push(msg);
  if (!msg.tool_calls) break;
  for (const c of msg.tool_calls) messages.push(await runTool(c));
}</pre></x-prob>
<x-sol>No step limit, no final no-tools call, no repeated-call detection, and <code>runTool</code> errors throw out of the loop. One confused model can loop until the token budget is gone. Fix: <code>for (let step = 1; step &lt;= MAX; step++)</code>, drop tools on the last step, block identical repeated calls, catch tool errors into results, log steps and usage.</x-sol>
</x-ex>

<h2 class="sec"><span class="k">12.C</span>Production scenarios</h2>
<x-scn t="Scenario 1: API is slow (500 ms → 5 s)" tag="must solid">
<x-sit>Your backend API normally responds in 500 milliseconds. Suddenly, it takes five seconds.</x-sit>
<x-sq q="What would you inspect first?">What changed (deploy, config, traffic, data volume), which endpoints are slow (all → shared dependency; one → its code path), and the latency breakdown per stage for one slow request.</x-sq>
<x-sq q="How would you investigate database latency?">Query timing logs, <code>pg_stat_statements</code> for the slowest/most frequent queries, <code>EXPLAIN (ANALYZE, BUFFERS)</code> on them, lock waits (<code>pg_stat_activity</code>, <code>pg_locks</code>), pool wait time vs query time, missing indexes after data growth.</x-sq>
<x-sq q="How would you identify external API delays?">Time every outbound call (LLM, embeddings, payments) with status and retry count; compare to their status pages; check whether retries are hiding failures.</x-sq>
<x-sq q="What is request tracing?">Following one request across components with a shared trace id: each component records spans (start, end, attributes), so you see a waterfall of where the 5 seconds went (OpenTelemetry is the standard).</x-sq>
<x-sq q="What metrics would you collect?">p50/p95/p99 latency per endpoint and per dependency, request rate, error rate, saturation (CPU, event-loop lag, DB pool in-use/waiting, queue depth), LLM tokens and time to first token.</x-sq>
<x-say>“I’d find which stage got slower using traces and per-dependency timings, check what changed, then dig into that dependency: slow queries with EXPLAIN, pool waits, or provider latency and hidden retries.”</x-say>
</x-scn>
<x-scn t="Scenario 2: database connection exhaustion" tag="must solid">
<x-sit>Your application starts returning database connection errors.</x-sit>
<x-sq q="What could cause this?">Leaked clients (no release on an error path), long transactions (an LLM call inside a transaction), traffic spike beyond pool size, too many app instances × pool size above the server’s <code>max_connections</code>, slow queries holding connections, idle-in-transaction sessions.</x-sq>
<x-sq q="What is connection pooling?">A fixed set of reusable DB connections lent to requests; requests queue when all are busy.</x-sq>
<x-sq q="How would you identify leaked connections?">Pool metrics (totalCount, idleCount, waitingCount) climbing and never returning; <code>pg_stat_activity</code> showing many <code>idle in transaction</code> sessions from the app; code review for <code>pool.connect()</code> without <code>finally { release() }</code>; set <code>idle_in_transaction_session_timeout</code>.</x-sq>
<x-sq q="How would you recover?">Short term: restart instances to free connections, kill stuck sessions, add a server-side pooler (PgBouncer / provider pooled endpoint). Root cause: fix the leak, move slow work out of transactions, size pools against max_connections, add connection and statement timeouts and alerts.</x-sq>
<x-say>“Usually a leak or long transactions. I’d confirm with pool metrics and pg_stat_activity, fix the release/transaction code, and add timeouts and a pooler so it fails fast next time.”</x-say>
</x-scn>
<x-scn t="Scenario 3: duplicate document processing" tag="must solid">
<x-sit>A user uploads the same document three times accidentally.</x-sit>
<x-sq q="How would you detect duplicates?">Hash the file bytes (SHA-256) at upload and look for an existing document with the same hash for that user.</x-sq>
<x-sq q="Would you use file hashes?">Yes for exact duplicates (cheap, reliable). Near-duplicates (re-exported PDF) need text or embedding similarity, usually only worth it later.</x-sq>
<x-sq q="How would you prevent duplicate ingestion?">A unique constraint on <code>(user_id, sha256)</code>; on conflict return the existing document (200) instead of creating a new one; the job id = document id so it can’t be queued twice.</x-sq>
<x-sq q="How would you handle concurrent uploads?">Let the unique constraint decide: three concurrent inserts → one wins, two get a conflict and return the winner’s row. Check-then-insert in code would race. Also disable the upload button while uploading.</x-sq>
<x-dm>DocMind has <code>jobId = documentId</code> (one job per document) but no file hashing, so three uploads make three documents (and count toward the 5/10 cap).</x-dm>
<x-say>“Hash the bytes, put a unique constraint on owner + hash, return the existing document on conflict, and keep jobs keyed by document id.”</x-say>
</x-scn>
<x-scn t="Scenario 4: LLM provider outage" tag="must solid">
<x-sit>Your LLM provider becomes unavailable.</x-sit>
<x-sq q="Should the entire application stop working?">No. Login, documents, history and anything non-LLM should keep working; AI features degrade with a clear message.</x-sq>
<x-sq q="How would you implement provider fallback?">A provider-neutral interface with an ordered fallback list per task; on timeout/5xx/429 after retries, try the next model or provider; validate its output the same way; log which provider answered.</x-sq>
<x-sq q="What is a circuit breaker?">A wrapper that counts failures; after a threshold it “opens” and fails fast (or goes to fallback) without calling the provider for a cool-down period, then lets a few test calls through (“half-open”) and closes if they succeed. It stops you from piling timeouts onto a dead service.</x-sq>
<x-sq q="How would you communicate the failure to the user?">Honest, specific UI: “The AI service is temporarily unavailable. Your documents are safe; please try again in a few minutes.” Queue non-urgent work (ingestion) to retry later; show status.</x-sq>
<x-dm>DocMind’s design already isolates this partly: chat failures don’t affect uploads/listing, and a Redis outage only blocks uploads (503). No provider fallback or circuit breaker yet; Gemini 503 “high demand” was hit for real.</x-dm>
<x-say>“Degrade gracefully: circuit breaker + fallback model behind one interface, clear messages, queued work retried later, and the rest of the app unaffected.”</x-say>
</x-scn>
<x-scn t="Scenario 5: hallucinated answers" tag="must solid">
<x-sit>Your RAG application generates answers that aren’t present in the source documents.</x-sit>
<x-sq q="What could cause this?">Retrieval missed the right chunk (so the model filled the gap), weak grounding instructions, too much loosely related context, high temperature, the model’s prior knowledge overriding the context, or a question with no answer in the documents.</x-sq>
<x-sq q="How would you improve retrieval?">Query rewriting, hybrid search, reranking, better chunking, metadata filters; measure recall@k on a labelled set.</x-sq>
<x-sq q="How would you improve grounding?">Strict system rules (answer only from sources, cite each claim, fixed not-found sentence), labelled sources, lower temperature, fewer but better chunks, citation verification.</x-sq>
<x-sq q="How would you handle insufficient context?">Relevance threshold → don’t answer, say it’s not in the documents and suggest next steps.</x-sq>
<x-sq q="How would you evaluate hallucination frequency?">Faithfulness scoring (claims supported by context) on an eval set including unanswerable questions, plus sampled production review and user reports.</x-sq>
<x-say>“First check whether retrieval found the right evidence. Then tighten grounding with citations and a not-found path, and track faithfulness on an eval set so it’s a number, not an impression.”</x-say>
</x-scn>
<x-scn t="Scenario 6: agent loop" tag="must solid">
<x-sit>Your agent repeatedly invokes the same tool without reaching a conclusion.</x-sit>
<x-sq q="Why might this happen?">Unhelpful tool results (empty, error, or too large and truncated), a vague tool description, the model not seeing earlier results (history trimmed), a task the tools can’t accomplish, or an error that tells it to retry.</x-sq>
<x-sq q="How would you limit iterations?">A max step count in code; the last step without tools; per-request token and time budgets.</x-sq>
<x-sq q="How would you detect repeated tool calls?">Keep a set of (tool name + normalised args) per run; on a repeat, return an error result (“you already ran this; use the earlier result or answer”) instead of executing.</x-sq>
<x-sq q="How would you terminate execution safely?">Make one final call without tools so the model summarises what it has, or return a clear fallback message; log the run for review.</x-sq>
<x-vis><x-w w="agent"></x-w></x-vis>
<x-say>“Bound it in code: step limit, final tools-off call, duplicate-call detection, and then fix why the tool results didn’t let it finish.”</x-say>
</x-scn>
<x-scn t="Scenario 7: workflow crash at 60%" tag="must solid">
<x-sit>Your course-generation workflow crashes after completing 60% of the work.</x-sit>
<x-sq q="How would you identify completed steps?">From the persisted run snapshot (step statuses and outputs) and from the business tables (lesson drafts already saved).</x-sq>
<x-sq q="How would you persist execution state?">Workflow storage writes a snapshot after each step (Mastra + Postgres), plus your own drafts table keyed by (course, module, lesson).</x-sq>
<x-sq q="How would you resume execution?">Recovery on boot re-drives running runs from the last snapshot (Mastra default), or re-run the workflow with the same course key; idempotent steps skip finished work.</x-sq>
<x-sq q="How would you prevent duplicate records?">Unique keys + <code>ON CONFLICT DO NOTHING</code>, “skip if exists” checks before LLM calls, and a final transactional publish.</x-sq>
<x-sq q="Would you restart the entire workflow?">No: wasted cost and different content for parts the user may have seen. Resume from the first unfinished step.</x-sq>
<x-vis><x-w w="workflow"></x-w></x-vis>
<x-say>“State tells me what’s done; resume from the first unfinished step; idempotent writes make the half-finished step safe to repeat.”</x-say>
</x-scn>
<x-scn t="Scenario 8: changing a document id exposes another user’s document" tag="must solid">
<x-sit>A user discovers they can access another user’s document by changing a document ID in an API request.</x-sit>
<x-sq q="What vulnerability is this?">Broken object-level authorization, also called IDOR (insecure direct object reference): the top item on the OWASP API Security Top 10.</x-sq>
<x-sq q="Why isn’t authentication alone sufficient?">Authentication proves who the user is; it doesn’t check whether this particular object belongs to them. Any logged-in user can try any id.</x-sq>
<x-sq q="Where would you enforce authorization?">In the data access layer for every query: <code>WHERE id = $1 AND user_id = $2</code> with the user from the token (including vector search and tools), returning 404 for “not yours”.</x-sq>
<x-sq q="How would you prevent similar problems?">Make userId a required parameter of every repository function, default-deny routing, tests that try cross-user access for every endpoint, optional Postgres row-level security, and code review checklists.</x-sq>
<x-dm>This exact risk was DocMind’s reason for the auth phase: before it, anyone with a documentId could chat with it. Now every repository read/delete takes a required userId (forgetting it is a compile error), and the live check confirmed two guests can’t see, chat with, quiz or delete each other’s documents.</x-dm>
<x-say>“That’s IDOR. The fix is ownership in every query, enforced structurally, plus cross-user tests.”</x-say>
</x-scn>
<x-scn t="Scenario 9: LLM cost explosion (3×)" tag="must solid">
<x-sit>Your application suddenly consumes three times its usual token budget.</x-sit>
<x-sq q="How would you investigate?">Break usage down by feature, endpoint, model, user and day from your usage logs; compare tokens per request and requests per user before/after; check recent deploys and prompt changes.</x-sq>
<x-sq q="Could conversation history be responsible?">Yes: unbounded history (or counting messages, not tokens) makes every turn more expensive as chats grow.</x-sq>
<x-sq q="Could repeated agent calls be responsible?">Yes: loops, more steps per request after a prompt change, retries stacking at several layers, or tool results bloating context.</x-sq>
<x-sq q="How would you introduce token budgets?">Per request (max input + output tokens, max steps), per user per day (deny or downgrade the model when exceeded), and per feature; alert at thresholds.</x-sq>
<x-sq q="How would you track cost per user?">Log usage with user id per call into a table, multiply by model prices, aggregate daily; show it on a dashboard and enforce limits from it.</x-sq>
<x-say>“Find the driver in usage logs (feature, user, tokens per call, calls per request), then cap it: history budgets, step limits, retry discipline, and per-user budgets with alerts.”</x-say>
</x-scn>
<x-scn t="Scenario 10: poor retrieval despite correct embeddings" tag="must solid">
<x-sit>The embedding generation process appears correct, but search results are poor.</x-sit>
<x-sq q="What else could be responsible?">Bad extraction (garbled text, missing tables), chunking (too big/small, split answers), the query (raw follow-ups, typos, exact codes), filters excluding documents, wrong distance operator or sort order, an ANN index with low recall or post-filtering, a model mismatch between query and corpus, stale or failed documents.</x-sq>
<x-sq q="How would you inspect query embeddings?">Log the exact text embedded; check model name and dimension; compare its similarity with known-good chunks; try the same query without filters and with exact search (no index).</x-sq>
<x-sq q="Would you inspect chunk boundaries?">Yes: read the chunks that should match. Often the answer is split or buried in a 2,000-token chunk.</x-sq>
<x-sq q="Could metadata filters be excluding relevant records?">Yes: wrong user/tenant id, status not ready, a date filter, or ANN post-filtering returning too few rows.</x-sq>
<x-sq q="Would hybrid search or reranking help?">Hybrid for exact terms and names; reranking when the right chunk is in the top 50 but not the top 5. Measure before and after.</x-sq>
<x-say>“Embeddings are one link. I’d check extraction, chunks, the exact query, filters and the index, find where the right chunk drops out, then fix that link.”</x-say>
</x-scn>

<h2 class="sec"><span class="k">✓</span>Checkpoint</h2>
<x-quiz id="qz-p12">
<x-mcq a="2"><x-t>First step of the debugging method?</x-t><x-o>Fix the most likely cause</x-o><x-o>Raise timeouts</x-o><x-o>Reproduce and collect evidence</x-o><x-o>Restart the server</x-o><x-why>Evidence before hypotheses.</x-why></x-mcq>
<x-mcq a="0"><x-t>A circuit breaker…</x-t><x-o>fails fast after repeated failures, then probes recovery</x-o><x-o>retries forever</x-o><x-o>limits users</x-o><x-o>encrypts traffic</x-o><x-why>Protects you and the failing service.</x-why></x-mcq>
