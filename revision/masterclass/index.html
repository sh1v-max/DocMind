<h2 class="sec"><span class="k">2.A</span>Lessons</h2>

<x-lesson t="Values, types and coercion" tag="must">
<x-def>Every value in JavaScript has a type. There are 7 primitive types (string, number, bigint, boolean, undefined, null, symbol) and one non-primitive: object (arrays, functions, dates, maps are all objects).</x-def>
<x-why>Types decide what operations mean. <code>"5" + 1</code> and <code>5 + 1</code> do different things. JavaScript was designed to “keep going” instead of throwing, so it converts types automatically (coercion). That convenience causes many bugs.</x-why>
<x-in><p><b>Primitives are stored by value</b>: copying a primitive copies the value. <b>Objects are stored by reference</b>: a variable holds a pointer to the object on the heap; copying the variable copies the pointer.</p>
<pre data-l="js">let a = 1; let b = a; b = 2;        // a is still 1
const o1 = { n: 1 }; const o2 = o1; o2.n = 2;  // o1.n is now 2: same object</pre>
<p><b>Coercion rules you must know:</b></p><ul><li><code>+</code> with a string → string concatenation: <code>"5" + 1 === "51"</code>.</li><li>Other math operators convert to number: <code>"5" - 1 === 4</code>, <code>"abc" * 2</code> is <code>NaN</code>.</li><li><code>==</code> converts before comparing; <code>===</code> doesn’t.</li><li>Falsy values: <code>false, 0, -0, 0n, "", null, undefined, NaN</code>. Everything else is truthy, including <code>"0"</code>, <code>[]</code> and <code>{}</code>.</li></ul>
<pre data-l="js">typeof null            // "object"  (a historic bug, kept for compatibility)
typeof function(){}    // "function"
typeof []              // "object" → use Array.isArray([])
0.1 + 0.2 === 0.3      // false: numbers are 64-bit floating point
Number.isNaN(NaN)      // true; NaN !== NaN</pre></x-in>
<x-an>Primitives are like writing a number on a sticky note and handing over a copy. Objects are like handing over the address of a house: two people with the same address walk into the same house.</x-an>
<x-real>Query params and form fields always arrive as strings. <code>req.query.page</code> is <code>"2"</code>, so <code>req.query.page + 1</code> is <code>"21"</code>. That’s why you parse with Zod (<code>z.coerce.number().int().min(1)</code>).</x-real>
<x-mist><ul><li>Using <code>==</code> and being surprised by <code>0 == ""</code> (true).</li><li>Checking arrays with <code>typeof</code>.</li><li>Comparing money as floats. Use integer cents.</li></ul></x-mist>
</x-lesson>

<x-lesson t="Scope, hoisting, the TDZ and closures" tag="must">
<x-def><b>Scope</b> is where a variable can be seen. <b>Hoisting</b> is the engine registering declarations before running the code. A <b>closure</b> is a function together with the variables it captured from where it was created.</x-def>
<x-why>Closures are how JavaScript keeps private state (counters, caches, configured functions) without classes, and how every callback remembers its context. Hoisting explains why some code works before the line that declares it and some throws.</x-why>
<x-in><p>Before running a scope, the engine creates bindings for its declarations:</p><ul><li><code>var x</code> → created and set to <code>undefined</code> (function-scoped).</li><li><code>let</code>/<code>const</code>/<code>class</code> → created but <b>uninitialised</b> until the declaration line runs. Touching them before is a ReferenceError. That window is the <b>temporal dead zone</b>.</li><li>Function declarations → created with the whole function, callable before the line.</li></ul>
<p><b>Lexical scope</b>: a function sees variables based on where it is <i>written</i>, not where it is called. When a function is created it keeps a reference to its surrounding scope. If it outlives that scope (returned, passed as a callback), the variables stay alive: that is the closure.</p>
<pre data-l="js">function makeCounter() {
  let count = 0;                 // lives on after makeCounter returns
  return () => ++count;          // closure over `count`
}
const next = makeCounter();
next(); next();                  // 1, 2  — nobody else can touch `count`

// The classic loop bug
for (var i = 0; i &lt; 3; i++) setTimeout(() => console.log(i));  // 3 3 3 (one shared i)
for (let j = 0; j &lt; 3; j++) setTimeout(() => console.log(j));  // 0 1 2 (new j per iteration)</pre></x-in>
<x-an>A closure is a backpack. A function packs the variables it needs from the room where it was made and carries them wherever it goes.</x-an>
<x-real>Express middleware factories are closures: <code>rateLimit({ max: 20 })</code> returns a middleware function that remembers <code>max</code>. Memoisation caches, once-only init functions and React hooks all rely on closures.</x-real>
<x-mist><ul><li>Thinking <code>let</code> isn’t hoisted. It is; it just isn’t initialised (TDZ).</li><li>Memory leaks from closures holding large objects in long-lived callbacks.</li></ul></x-mist>
</x-lesson>

<x-lesson t="this, call/apply/bind and prototypes" tag="must">
<x-def><code>this</code> is a hidden parameter set by <b>how a function is called</b>. Prototypes are how objects inherit: each object has a hidden link to another object, and property lookups follow that chain.</x-def>
<x-in><table><thead><tr><th>Call style</th><th>this is</th></tr></thead><tbody>
<tr><td><code>obj.method()</code></td><td><code>obj</code></td></tr>
<tr><td><code>fn()</code> plain call</td><td><code>undefined</code> in strict mode / modules (global object in sloppy scripts)</td></tr>
<tr><td><code>new Fn()</code></td><td>the new object</td></tr>
<tr><td><code>fn.call(x, a, b)</code> / <code>fn.apply(x, [a, b])</code></td><td><code>x</code>, called now</td></tr>
<tr><td><code>const g = fn.bind(x)</code></td><td><code>x</code> forever, called later</td></tr>
<tr><td>arrow function</td><td>no own <code>this</code>: uses the surrounding one</td></tr>
</tbody></table>
<pre data-l="js">const user = { name: 'Asha', hi() { return 'hi ' + this.name; } };
const f = user.hi;
f();                    // TypeError in strict mode: this is undefined (method "lost" its object)
f.call({ name: 'Ravi' }); // 'hi Ravi'
const g = user.hi.bind(user); g(); // 'hi Asha'

// prototypes
const animal = { speak() { return this.sound; } };
const dog = Object.create(animal); dog.sound = 'woof';
dog.speak();            // 'woof' — speak found on the prototype, this = dog
class Cat { meow() {} } // class methods live on Cat.prototype</pre>
<p>Lookup <code>dog.speak</code>: own properties of <code>dog</code> → not found → <code>dog.[[Prototype]]</code> (animal) → found. If not found anywhere up to <code>Object.prototype</code>, the result is <code>undefined</code>.</p></x-in>
<x-real>Passing <code>this.handle</code> as a callback (e.g. <code>emitter.on('data', this.handle)</code>) loses <code>this</code>. Fix with an arrow function or <code>.bind(this)</code>.</x-real>
<x-mist><ul><li>Using arrow functions as object methods and expecting <code>this</code> to be the object.</li><li>Saying “JavaScript has classical inheritance”. <code>class</code> is syntax over prototypes.</li></ul></x-mist>
</x-lesson>

<x-lesson t="Arrays, copies, destructuring, spread and rest" tag="must">
<x-def>Higher-order functions take or return functions. <code>map</code>, <code>filter</code>, <code>reduce</code> are higher-order array methods. Spread copies elements out; rest collects them in. Destructuring unpacks values into variables.</x-def>
<x-impl><pre data-l="js">const chunks = [
  { doc: 'a', words: 480, distance: 0.21 },
  { doc: 'b', words: 120, distance: 0.55 },
  { doc: 'a', words: 500, distance: 0.30 },
];
const close = chunks.filter((c) => c.distance &lt; 0.4);          // keep 2
const ids = close.map((c) => c.doc);                             // ['a', 'a']
const wordsPerDoc = chunks.reduce((acc, c) => {
  acc[c.doc] = (acc[c.doc] ?? 0) + c.words;                      // group + sum
  return acc;
}, {});                                                          // { a: 980, b: 120 }

const { doc, ...rest } = chunks[0];       // destructuring + rest: doc='a', rest={words, distance}
const merged = { ...defaults, ...options };   // spread: later keys win
function log(level, ...parts) { /* parts is a real array */ }

// shallow vs deep copy
const orig = { user: { name: 'A' }, tags: ['x'] };
const shallow = { ...orig };        // new outer object, SAME inner user/tags
shallow.user.name = 'B';            // orig.user.name is now 'B' too!
const deep = structuredClone(orig); // copies nested objects (not functions)</pre></x-impl>
<x-mist><ul><li>Forgetting <code>reduce</code>’s initial value (crashes on an empty array).</li><li>Using <code>JSON.parse(JSON.stringify(x))</code> as deep copy: it drops <code>undefined</code>, functions, and turns Dates into strings.</li><li><code>forEach</code> with an async callback doesn’t wait.</li></ul></x-mist>
</x-lesson>

<x-lesson t="Promises and async/await" tag="must">
<x-def>A Promise is an object representing a value that will be available later (or an error). <code>async/await</code> is syntax for writing promise code that reads top to bottom.</x-def>
<x-why>Network calls, database queries and file reads take milliseconds to seconds. Blocking the single JavaScript thread while waiting would freeze the whole server. Callbacks solved this but nested badly (“callback hell”) and made error handling inconsistent. Promises give one composable object with one error channel.</x-why>
<x-in><p>A promise is <b>pending</b>, then settles once to <b>fulfilled</b> (with a value) or <b>rejected</b> (with a reason). <code>.then</code>/<code>.catch</code> register reactions; when the promise settles, the reactions are queued as <b>microtasks</b>.</p>
<p><code>await p</code> inside an async function: the function pauses, returns control to the caller (the async function itself already returned a pending promise), and when <code>p</code> settles, the rest of the function is scheduled as a microtask. It does <b>not</b> block the thread.</p>
<pre data-l="js">// sequential: total ≈ a + b
const user = await getUser(id);
const docs = await getDocs(id);

// concurrent: total ≈ max(a, b)
const [user2, docs2] = await Promise.all([getUser(id), getDocs(id)]);

// errors: one try/catch covers every await
async function load(id) {
  try {
    const doc = await db.getDocument(id);
    if (!doc) throw new NotFoundError(id);
    return doc;
  } catch (err) {
    logger.error({ err, id }, 'load failed');
    throw err;                     // rethrow so the caller knows
  }
}</pre>
<table><thead><tr><th>Combinator</th><th>Resolves when</th><th>Rejects when</th></tr></thead><tbody>
<tr><td><code>Promise.all</code></td><td>all fulfil (array of values)</td><td>the first rejection (others keep running, results ignored)</td></tr>
<tr><td><code>Promise.allSettled</code></td><td>all settle: <code>[{status, value | reason}]</code></td><td>never</td></tr>
<tr><td><code>Promise.race</code></td><td>first to settle, if it fulfilled</td><td>first to settle, if it rejected</td></tr>
<tr><td><code>Promise.any</code></td><td>first to fulfil</td><td>all reject (AggregateError)</td></tr>
</tbody></table></x-in>
<x-real>Timeout for an LLM call: <code>Promise.race([callModel(), timeout(30000)])</code>, or better, <code>AbortSignal.timeout(30000)</code> passed to fetch so the request is actually cancelled. Embedding 10 chunks where some may fail: <code>allSettled</code>.</x-real>
<x-mist><ul><li><code>await</code> inside a <code>for</code> loop when the calls are independent (slow), or <code>Promise.all</code> over 10,000 calls (rate limit explosion). Use a concurrency limit (Phase 11, exercise 2).</li><li>Forgetting <code>await</code>: you get a Promise object instead of the value, and errors become unhandled rejections.</li><li>Thinking <code>Promise.race</code> cancels the losers. It doesn’t.</li></ul></x-mist>
</x-lesson>

<x-lesson t="The event loop: browser and Node.js" tag="must">
<x-def>The event loop is the mechanism that lets one JavaScript thread handle many waiting operations: run code until the stack is empty, then take the next queued callback.</x-def>
<x-why>JavaScript runs your code on one thread. I/O (network, disk, timers) is done by the runtime (browser Web APIs, or libuv in Node). The event loop is how the results come back to your code without blocking.</x-why>
<x-in><ol><li><b>Call stack:</b> the functions currently running. Synchronous code runs to completion; nothing interrupts it.</li><li><b>Runtime facilities:</b> timers, sockets, file reads are handed off. libuv uses the OS (epoll/kqueue/IOCP) for network I/O and a thread pool (default 4 threads) for file system, DNS lookup, crypto and zlib.</li><li><b>Queues:</b> when an operation completes, its callback is queued.</li><li><b>Microtasks</b> (promise reactions, queueMicrotask) run as soon as the stack empties, all of them, before anything else. In Node, the <b>process.nextTick</b> queue runs even before promise microtasks.</li><li><b>Node’s loop phases</b>, each with its own queue: <code>timers</code> (setTimeout/setInterval) → <code>pending callbacks</code> → <code>idle/prepare</code> → <code>poll</code> (wait for and run I/O callbacks) → <code>check</code> (setImmediate) → <code>close callbacks</code>. Between every callback, Node drains nextTick then microtasks.</li></ol></x-in>
<x-vis><x-w w="eventloop"></x-w></x-vis>
<x-an>A chef (the one thread) cooks one dish at a time. Ovens and fryers (libuv, the OS) run in the background and ring a bell when done. Orders behind the counter are the queues. Some notes are marked urgent (microtasks): the chef handles every urgent note before taking the next normal order.</x-an>
<x-real>A CPU-heavy loop (parsing a 50 MB JSON, hashing with a high cost synchronously, a long regex) blocks the stack, so no other request’s callback can run: the whole server stalls. Fix: worker threads, a job queue, or streaming parsers.</x-real>
<x-mist><ul><li>“setTimeout(fn, 0) runs immediately.” It runs after the current code and all microtasks, in a later timers phase.</li><li>“Node is multi-threaded so CPU work is fine.” Your JavaScript runs on one thread unless you use worker_threads.</li><li>A recursive <code>process.nextTick</code> or microtask loop starves I/O forever.</li></ul></x-mist>
</x-lesson>

<h2 class="sec"><span class="k">2.1</span>Core JavaScript</h2>

<x-q n="2.1" tag="must basic"><x-t>What are the different data types in JavaScript?</x-t>
<x-say>Seven primitives: string, number, bigint, boolean, undefined, null and symbol. Everything else is an object, including arrays, functions, dates and maps.</x-say>
<x-simple><p>Primitives are immutable values. Objects are mutable collections of properties accessed by reference. <code>typeof</code> returns "object" for null (historic bug) and "function" for functions.</p></x-simple>
<x-fu q="Why bigint?">Number is a 64-bit float and is exact only up to 2^53 − 1 (<code>Number.MAX_SAFE_INTEGER</code>). Large ids (e.g. some database bigint columns, Twitter-style ids) need bigint or strings.</x-fu>
<x-no>“Array is a separate type.” It’s an object.</x-no>
<x-ev>Basic language knowledge.</x-ev></x-q>

<x-q n="2.2" tag="must basic"><x-t>What’s the difference between primitive and reference types?</x-t>
<x-say>Primitives are copied by value. Objects are accessed by reference: assigning or passing an object copies the reference, so both variables point to the same object.</x-say>
<x-code><pre data-l="js">function rename(u) { u.name = 'X'; }
const user = { name: 'A' }; rename(user);  // user.name === 'X'
function reassign(u) { u = { name: 'Y' }; } reassign(user); // user unchanged: only the local copy of the reference changed</pre></x-code>
<x-fu q="Is JavaScript pass-by-reference then?">No, it’s pass-by-value where the value of an object variable is a reference (sometimes called “call by sharing”). That’s why mutating works but reassigning doesn’t.</x-fu>
<x-ev>Understanding of mutation bugs.</x-ev></x-q>

<x-q n="2.3" tag="must basic"><x-t>What’s the difference between var, let and const?</x-t>
<x-say><code>var</code> is function-scoped and initialised to undefined when hoisted. <code>let</code> and <code>const</code> are block-scoped and in the temporal dead zone until declared. <code>const</code> can’t be reassigned, but a const object can still be mutated.</x-say>
<x-code><pre data-l="js">if (true) { var a = 1; let b = 2; }
a; // 1
b; // ReferenceError
const cfg = { port: 3000 }; cfg.port = 4000; // allowed
cfg = {};                                     // TypeError</pre></x-code>
<x-no>“const makes objects immutable.” Use <code>Object.freeze</code> (shallow) for that.</x-no>
<x-ev>Scope understanding.</x-ev></x-q>

<x-q n="2.4" tag="must basic"><x-t>What is hoisting?</x-t>
<x-say>Before a scope runs, the engine registers its declarations. var becomes undefined, function declarations are fully available, and let/const/class exist but are uninitialised until their line.</x-say>
<x-code><pre data-l="js">sayHi();                 // works: function declaration hoisted
function sayHi() {}
console.log(x);          // undefined
var x = 5;
greet();                 // TypeError: greet is not a function (var greet is undefined)
var greet = () => {};</pre></x-code>
<x-no>“Hoisting physically moves code to the top.” Nothing moves; declarations are processed first.</x-no>
<x-ev>Mental model of execution.</x-ev></x-q>

<x-q n="2.5" tag="must basic"><x-t>What is the temporal dead zone?</x-t>
<x-say>The time between entering a scope and reaching a let/const/class declaration. The binding exists but accessing it throws a ReferenceError.</x-say>
<x-code><pre data-l="js">{
  // TDZ for `limit` starts here
  console.log(limit);   // ReferenceError: Cannot access 'limit' before initialization
  const limit = 10;     // TDZ ends
}</pre></x-code>
<x-fu q="Why was it designed that way?">To catch bugs early: reading a variable before it has a meaningful value is almost always a mistake, and const must never be seen without its value.</x-fu>
<x-ev>Precise vocabulary.</x-ev></x-q>

<x-q n="2.6" tag="must basic"><x-t>What’s the difference between == and ===?</x-t>
<x-say><code>===</code> compares value and type with no conversion. <code>==</code> converts types first using coercion rules. Use <code>===</code> except for the idiom <code>x == null</code>, which checks null or undefined.</x-say>
<x-code><pre data-l="js">0 == ''            // true
0 == '0'           // true
'' == '0'          // false (not transitive!)
null == undefined  // true
null === undefined // false
NaN === NaN        // false → Number.isNaN</pre></x-code>
<x-ev>Avoiding coercion bugs.</x-ev></x-q>

<x-q n="2.7" tag="must basic"><x-t>What is type coercion?</x-t>
<x-say>Automatic conversion of a value from one type to another, for example to string with <code>+</code> or to number with <code>-</code>, or to boolean in an <code>if</code>. Explicit conversion is <code>Number(x)</code>, <code>String(x)</code>, <code>Boolean(x)</code>.</x-say>
<x-code><pre data-l="js">'3' * '4'   // 12
'3' + 4     // '34'
[] + {}     // '[object Object]'
if ('0') {} // runs: non-empty string is truthy
Number('')  // 0   — careful with empty form fields</pre></x-code>
<x-eg>Pagination bug: <code>offset = req.query.page * 20</code> works by accident, but <code>req.query.page + 1</code> gives "21". Validate and convert at the boundary with Zod.</x-eg>
<x-ev>Practical awareness.</x-ev></x-q>

<x-q n="2.8" tag="must basic"><x-t>What’s the difference between null and undefined?</x-t>
<x-say><code>undefined</code> means “no value was assigned” (missing property, missing argument, function with no return). <code>null</code> is an intentional “empty” value that a programmer sets.</x-say>
<x-simple><p>JSON has <code>null</code> but no <code>undefined</code>: <code>JSON.stringify({ a: undefined })</code> gives <code>"{}"</code>. In SQL, NULL maps to JS <code>null</code>. Use <code>??</code> (nullish coalescing) to default only on null/undefined, not on 0 or "".</p></x-simple>
<x-code><pre data-l="js">const limit = req.query.limit ?? 20;   // keeps 0
const limit2 = req.query.limit || 20;  // replaces 0 with 20 (bug if 0 is valid)</pre></x-code>
<x-ev>Precision with absent values.</x-ev></x-q>

<x-q n="2.9" tag="must solid"><x-t>What are closures?</x-t>
<x-say>A closure is a function plus the variables from the scope where it was created. The function keeps access to them even after that outer function has returned.</x-say>
<x-code><pre data-l="js">function createRateLimiter(max) {
  const hits = new Map();                      // private state
  return function allow(ip) {
    const n = (hits.get(ip) ?? 0) + 1;
    hits.set(ip, n);
    return n &lt;= max;                           // remembers `max` and `hits`
  };
}
const allow = createRateLimiter(3);</pre></x-code>
<x-fu q="Any downside?">Captured variables stay in memory as long as the function is reachable. A long-lived closure capturing a big object (a whole request, a large array) is a common memory leak.</x-fu>
<x-no>“A closure is a function inside a function.” That’s nesting; the key is captured variables outliving their scope.</x-no>
<x-ev>Core JS understanding, used everywhere in Node.</x-ev></x-q>

<x-q n="2.10" tag="must basic"><x-t>What is lexical scope?</x-t>
<x-say>Variable visibility is decided by where code is written. An inner function can see outer variables; the lookup goes outward through the nesting at write time, not through the call stack.</x-say>
<x-code><pre data-l="js">const x = 'global';
function outer() { const x = 'outer'; return inner; function inner() { return x; } }
function caller() { const x = 'caller'; return outer()(); }
caller(); // 'outer' — not 'caller'</pre></x-code>
<x-ev>Foundation for closures.</x-ev></x-q>

<x-q n="2.11" tag="must basic"><x-t>Explain the difference between function declarations and function expressions.</x-t>
<x-say>A declaration (<code>function f() {}</code>) is hoisted with its body, so it can be called before its line. An expression (<code>const f = function () {}</code> or an arrow) is a value assigned to a variable and only exists after that line runs.</x-say>
<x-simple><p>Expressions can be anonymous, passed as arguments, and created conditionally. Named function expressions (<code>const f = function fact(n) {...}</code>) help stack traces and recursion.</p></x-simple>
<x-ev>Hoisting applied.</x-ev></x-q>

<x-q n="2.12" tag="must basic"><x-t>What are arrow functions?</x-t>
<x-say>A shorter function syntax with no own <code>this</code>, <code>arguments</code>, <code>super</code> or <code>prototype</code>, and they can’t be used with <code>new</code>. They take <code>this</code> from the surrounding scope.</x-say>
<x-code><pre data-l="js">class Uploader {
  constructor() { this.count = 0; }
  start(emitter) {
    emitter.on('file', () => { this.count++; });  // arrow: this = the Uploader
    // emitter.on('file', function () { this.count++; }) → this = the emitter
  }
}</pre></x-code>
<x-no>“Arrow functions are just shorter.” The <code>this</code> behaviour is the important difference.</x-no>
<x-ev>Practical use in callbacks.</x-ev></x-q>

<x-q n="2.13" tag="must solid"><x-t>How does this work in JavaScript?</x-t>
<x-say><code>this</code> is decided at call time by how a function is called: the object before the dot, the new object with <code>new</code>, an explicit value with call/apply/bind, or undefined for a plain call in strict mode. Arrow functions use the surrounding <code>this</code>.</x-say>
<x-simple><p>See the table in the lesson above. Priority: <code>new</code> &gt; explicit bind/call/apply &gt; method call &gt; plain call.</p></x-simple>
<x-fu q="What is this inside an Express route handler?">Nothing useful: Express calls handlers as plain functions. Use <code>req</code>, <code>res</code>, closures or module variables instead.</x-fu>
<x-ev>Precision under a commonly confused topic.</x-ev></x-q>

<x-q n="2.14" tag="must basic"><x-t>What’s the difference between call(), apply() and bind()?</x-t>
<x-say>All three set <code>this</code>. call runs the function now with arguments listed; apply runs it now with arguments as an array; bind returns a new function with <code>this</code> (and optionally arguments) fixed, to call later.</x-say>
<x-code><pre data-l="js">function greet(greeting, mark) { return `${greeting}, ${this.name}${mark}`; }
const u = { name: 'Asha' };
greet.call(u, 'Hi', '!');        // 'Hi, Asha!'
greet.apply(u, ['Hi', '!']);     // same
const hiAsha = greet.bind(u, 'Hi'); hiAsha('?');  // 'Hi, Asha?'  (partial application)</pre></x-code>
<x-ev>Function mechanics.</x-ev></x-q>

<x-q n="2.15" tag="must solid"><x-t>What is prototypal inheritance?</x-t>
<x-say>Objects link to a prototype object. When a property isn’t found on the object, JavaScript looks it up on the prototype, then that one’s prototype, up to Object.prototype. Classes are syntax on top of this.</x-say>
<x-code><pre data-l="js">class HttpError extends Error {
  constructor(status, msg) { super(msg); this.status = status; }
}
const e = new HttpError(404, 'Not found');
Object.getPrototypeOf(e) === HttpError.prototype;            // true
Object.getPrototypeOf(HttpError.prototype) === Error.prototype; // true
e instanceof Error;  // true: walks the chain</pre></x-code>
<x-eg>Custom error classes for an API (NotFoundError, ValidationError) are prototypal inheritance in practice: the error handler checks <code>instanceof</code> to pick the status code.</x-eg>
<x-ev>Whether you know what <code>class</code> really does.</x-ev></x-q>

<x-q n="2.16" tag="must basic"><x-t>What are higher-order functions?</x-t>
<x-say>Functions that take functions as arguments or return functions. map, filter, reduce, setTimeout, Express’s <code>app.use</code> and middleware factories are all examples.</x-say>
<x-code><pre data-l="js">// returns a function: wraps any async route so errors reach the error handler
const asyncHandler = (fn) => (req, res, next) => Promise.resolve(fn(req, res, next)).catch(next);
// (Express 5 does this automatically; Express 4 needs it)</pre></x-code>
<x-ev>Functional thinking.</x-ev></x-q>

<x-q n="2.17" tag="must basic"><x-t>Explain map(), filter() and reduce().</x-t>
<x-say>map transforms each element into a new array of the same length; filter keeps elements that pass a test; reduce folds the array into one value (a sum, an object, a map). None of them mutate the original array.</x-say>
<x-code><pre data-l="js">const totalTokens = calls.reduce((sum, c) => sum + c.inputTokens + c.outputTokens, 0);
const failed = jobs.filter((j) => j.status === 'failed').map((j) => j.id);</pre></x-code>
<x-fu q="When would you not use them?">When you need to stop early (use <code>find</code>, <code>some</code>, or a <code>for…of</code> with break), or when the callback is async and must be awaited in order.</x-fu>
<x-ev>Fluency with everyday code.</x-ev></x-q>

<x-q n="2.18" tag="must basic"><x-t>What’s the difference between shallow copy and deep copy?</x-t>
<x-say>A shallow copy creates a new top-level object but nested objects are shared. A deep copy copies every level. Spread and Object.assign are shallow; structuredClone is deep.</x-say>
<x-eg>Copying a default config with spread and then mutating <code>config.retry.attempts</code> changes the default for every later request. Use structuredClone, or never mutate nested config.</x-eg>
<x-ev>Awareness of shared-state bugs.</x-ev></x-q>

<x-q n="2.19" tag="must basic"><x-t>What is destructuring?</x-t>
<x-say>Syntax to unpack array elements or object properties into variables, with optional defaults and renaming.</x-say>
<x-code><pre data-l="js">const { message, sessionId = crypto.randomUUID(), documentId: docId } = req.body;
const [first, , third] = results;
function search({ query, topK = 5 } = {}) {}   // named arguments with defaults</pre></x-code>
<x-ev>Modern syntax fluency.</x-ev></x-q>

<x-q n="2.20" tag="must basic"><x-t>What are spread and rest operators?</x-t>
<x-say>Same <code>...</code> syntax, opposite jobs. Spread expands an array or object into elements or properties. Rest collects remaining elements or properties into one array or object.</x-say>
<x-code><pre data-l="js">const all = [...a, ...b];                 // spread
const update = { ...doc, status: 'ready' }; // spread, override one key
const { password_hash, ...safeUser } = row;  // rest: strip a field before sending
function sum(...nums) { return nums.reduce((x, y) => x + y, 0); } // rest parameters</pre></x-code>
<x-ev>Practical syntax.</x-ev></x-q>

<h2 class="sec"><span class="k">2.2</span>Asynchronous JavaScript</h2>

<x-q n="2.21" tag="must basic"><x-t>What is synchronous versus asynchronous execution?</x-t>
<x-say>Synchronous code runs line by line and each line finishes before the next. Asynchronous code starts an operation, continues with other work, and handles the result later through a callback or promise.</x-say>
<x-simple><p>In a server, one request waiting 2 seconds for an LLM shouldn’t stop 100 other requests. Async I/O lets the single thread serve them all while waiting.</p></x-simple>
<x-ev>Fundamental Node model.</x-ev></x-q>

<x-q n="2.22" tag="must basic"><x-t>What are callbacks?</x-t>
<x-say>Functions passed to another function to be called later, for example when I/O finishes. Node’s classic style is error-first: <code>(err, result) => {}</code>.</x-say>
<x-code><pre data-l="js">fs.readFile('a.txt', 'utf8', (err, text) => {
  if (err) return console.error(err);
  console.log(text.length);
});</pre></x-code>
<x-ev>History of async in Node.</x-ev></x-q>

<x-q n="2.23" tag="must basic"><x-t>What is callback hell?</x-t>
<x-say>Deeply nested callbacks where each async step depends on the previous one. It’s hard to read, error handling is repeated at every level, and it’s easy to forget a branch.</x-say>
<x-code><pre data-l="js">getUser(id, (e1, user) => {
  if (e1) return done(e1);
  getDocs(user.id, (e2, docs) => {
    if (e2) return done(e2);
    embed(docs, (e3, vectors) => { /* ...and so on */ });
  });
});
// the same with async/await:
const user = await getUser(id); const docs = await getDocs(user.id); const vectors = await embed(docs);</pre></x-code>
<x-ev>Why promises exist.</x-ev></x-q>

<x-q n="2.24" tag="must basic"><x-t>What are Promises?</x-t>
<x-say>An object representing the eventual result of an async operation. It settles once, to a value or an error, and you attach handlers with then/catch/finally or await it.</x-say>
<x-code><pre data-l="js">const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
function readJson(path) {
  return new Promise((resolve, reject) => {
    fs.readFile(path, 'utf8', (err, txt) => {
      if (err) return reject(err);
      try { resolve(JSON.parse(txt)); } catch (e) { reject(e); }
    });
  });
}</pre></x-code>
<x-ev>Core async primitive.</x-ev></x-q>

<x-q n="2.25" tag="must basic"><x-t>Explain the different states of a Promise.</x-t>
<x-say>Pending (not settled yet), fulfilled (has a value), rejected (has a reason). Fulfilled and rejected are both “settled”, and a settled promise never changes again.</x-say>
<x-simple><p>Calling resolve twice, or resolve then reject, does nothing after the first. A promise resolved with another promise “follows” it (adopts its eventual state).</p></x-simple>
<x-ev>Precision.</x-ev></x-q>

<x-q n="2.26" tag="must basic"><x-t>What’s the difference between .then() and async/await?</x-t>
<x-say>Same mechanism. async/await is syntax over promises that reads like synchronous code and lets you use try/catch and normal loops. <code>.then</code> chains are useful for small transforms or when you don’t want to pause.</x-say>
<x-code><pre data-l="js">// then-chain
getUser(id).then((u) => getDocs(u.id)).then(render).catch(handle);
// async/await
try { const u = await getUser(id); render(await getDocs(u.id)); } catch (e) { handle(e); }</pre></x-code>
<x-ev>Practical choice.</x-ev></x-q>

<x-q n="2.27" tag="must solid"><x-t>What happens internally when you use await?</x-t>
<x-say>The async function runs synchronously until the await. Then it suspends: its state is saved, and the caller gets back the function’s pending promise. When the awaited promise settles, the rest of the function is queued as a microtask and resumes with the value, or throws the rejection at the await line.</x-say>
<x-simple><p>Use the “async / await” example in the event-loop widget above: code after <code>await null</code> runs only after the current synchronous code finishes, even though null is not a real promise.</p></x-simple>
<x-no>“await blocks the thread.” Only that function pauses; the thread keeps serving other work.</x-no>
<x-ev>Deeper mental model.</x-ev></x-q>

<x-q n="2.28" tag="must solid"><x-t>What’s the difference between Promise.all() and Promise.allSettled()?</x-t>
<x-say><code>all</code> fails fast: it rejects as soon as one promise rejects. <code>allSettled</code> always waits for all and gives a status object per promise. Use all when you need everything; allSettled when partial success is fine.</x-say>
<x-code><pre data-l="js">const results = await Promise.allSettled(chunks.map(embed));
const ok = results.filter((r) => r.status === 'fulfilled').map((r) => r.value);
const failed = results.flatMap((r, i) => (r.status === 'rejected' ? [{ i, reason: String(r.reason) }] : []));</pre></x-code>
<x-fu q="With Promise.all, do the other operations stop after one rejects?">No. They keep running; their results are just ignored. To actually stop them, pass an AbortController signal and abort it.</x-fu>
<x-ev>Error-handling design.</x-ev></x-q>

<x-q n="2.29" tag="should solid"><x-t>What’s the difference between Promise.race() and Promise.any()?</x-t>
<x-say>race settles with whichever promise settles first, success or failure. any resolves with the first success and only rejects (AggregateError) if all fail.</x-say>
<x-eg>race: timeouts (<code>race([call(), rejectAfter(5000)])</code>). any: ask two replicas or providers and use whoever answers successfully first (hedged requests).</x-eg>
<x-ev>Concurrency tools.</x-ev></x-q>

<x-q n="2.30" tag="must basic"><x-t>How do you handle errors in asynchronous functions?</x-t>
<x-say>try/catch around awaits, or .catch on the promise. Rethrow or convert to a meaningful error; never swallow silently. At the edges, a central handler (Express error middleware, a job’s failed handler) logs and responds.</x-say>
<x-code><pre data-l="js">app.post('/chat', async (req, res, next) => {
  try { res.json(await chatService.answer(req.user.id, req.body)); }
  catch (err) { next(err); }           // Express 5 also forwards a rejected promise automatically
});</pre></x-code>
<x-no>Wrapping everything in try/catch that logs and returns nothing; callers then think it succeeded.</x-no>
<x-ev>Robustness.</x-ev></x-q>

<x-q n="2.31" tag="must solid"><x-t>What happens when a Promise rejects and nobody handles the rejection?</x-t>
<x-say>Node emits an <code>unhandledRejection</code> event. Since Node 15 the default is to treat it like an uncaught exception: print it and exit the process.</x-say>
<x-simple><p>Common causes: a missing await, a fire-and-forget call, a <code>.then</code> without <code>.catch</code>. Fix the cause; a global <code>process.on('unhandledRejection')</code> handler should log and then exit cleanly (the app state may be inconsistent), not keep running.</p></x-simple>
<x-ev>Production awareness.</x-ev></x-q>

<x-q n="2.32" tag="must basic"><x-t>Can you execute multiple asynchronous operations concurrently?</x-t>
<x-say>Yes: start them without awaiting each one, then await them together with Promise.all/allSettled. For many operations, limit concurrency so you don’t overload a database or hit an API rate limit.</x-say>
<x-code><pre data-l="js">const pUser = getUser(id);          // starts now
const pDocs = listDocuments(id);    // starts now too
const [user, docs] = await Promise.all([pUser, pDocs]);</pre></x-code>
<x-ev>Performance thinking.</x-ev></x-q>

<x-q n="2.33" tag="should solid"><x-t>What’s the difference between concurrency and parallelism?</x-t>
<x-say>Concurrency is dealing with many tasks at once by interleaving them (one thread switching while tasks wait). Parallelism is doing many tasks at the exact same moment on multiple cores. Node’s JS is concurrent on one thread; worker threads and libuv’s thread pool add parallelism.</x-say>
<x-an>One waiter serving ten tables (concurrency) versus ten waiters (parallelism).</x-an>
<x-ev>Precise terms.</x-ev></x-q>

<h2 class="sec"><span class="k">2.3</span>Event loop and Node.js runtime</h2>

<x-q n="2.34" tag="must solid"><x-t>What is the JavaScript event loop?</x-t>
<x-say>The loop that takes completed async callbacks from queues and runs them on the single JS thread whenever the call stack is empty, always draining microtasks before the next macrotask.</x-say>
<x-simple><p>Step through the widget in the lesson above. Order of priority: current synchronous code → nextTick queue (Node) → promise microtasks → the next macrotask (timer, I/O callback, setImmediate…) → microtasks again → …</p></x-simple>
<x-ev>Core Node knowledge; often probed with an output-prediction question.</x-ev></x-q>

<x-q n="2.35" tag="must solid"><x-t>What are the call stack, callback queue and microtask queue?</x-t>
<x-say>The call stack holds currently running functions. The callback (task/macrotask) queue holds callbacks from timers and I/O waiting to run. The microtask queue holds promise reactions and queueMicrotask callbacks, which run as soon as the stack empties, before any macrotask.</x-say>
<x-ev>Vocabulary.</x-ev></x-q>

<x-q n="2.36" tag="must solid"><x-t>What’s the difference between microtasks and macrotasks?</x-t>
<x-say>Microtasks (promise callbacks, queueMicrotask, and in Node process.nextTick in its own higher-priority queue) run all together right after the current task. Macrotasks (setTimeout, setInterval, I/O callbacks, setImmediate) run one at a time per loop step, with all microtasks drained between them.</x-say>
<x-code><pre data-l="js">setTimeout(() => console.log('macro'));
Promise.resolve().then(() => console.log('micro'));
// micro, macro</pre></x-code>
<x-fu q="What if a microtask keeps adding microtasks?">The queue never empties, so timers and I/O never run: the server freezes even though nothing is “blocking” in the usual sense.</x-fu>
<x-ev>Ordering knowledge.</x-ev></x-q>

<x-q n="2.37" tag="must solid"><x-t>What is the Node.js event loop?</x-t>
<x-say>libuv’s loop with six phases: timers, pending callbacks, idle/prepare, poll, check, close callbacks. Each phase has a queue; between every callback Node drains nextTick and promise microtasks.</x-say>
<x-simple><ul><li><b>timers:</b> expired setTimeout/setInterval callbacks.</li><li><b>pending callbacks:</b> some deferred system errors (e.g. TCP errors).</li><li><b>idle/prepare:</b> internal.</li><li><b>poll:</b> wait for new I/O and run its callbacks; if nothing is pending, it may block here until a timer is due.</li><li><b>check:</b> setImmediate callbacks.</li><li><b>close:</b> e.g. <code>socket.on('close')</code>.</li></ul></x-simple>
<x-ev>Node-specific depth.</x-ev></x-q>

<x-q n="2.38" tag="must solid"><x-t>What is libuv?</x-t>
<x-say>The C library under Node that provides the event loop, async networking via the OS (epoll, kqueue, IOCP), a thread pool (default 4 threads) for file system, DNS lookup, some crypto and zlib, plus timers and child processes.</x-say>
<x-fu q="When does the thread pool size matter?">Many concurrent file reads, bcrypt hashes or zlib jobs queue behind 4 threads. You can raise <code>UV_THREADPOOL_SIZE</code> (set before startup). Network sockets don’t use the pool.</x-fu>
<x-ev>Understanding beneath the API.</x-ev></x-q>

<x-q n="2.39" tag="must solid"><x-t>What’s the difference between setTimeout() and setImmediate()?</x-t>
<x-say>setTimeout runs in the timers phase after at least the delay; setImmediate runs in the check phase right after poll. Inside an I/O callback, setImmediate always runs first. In the main module their order is not guaranteed.</x-say>
<x-simple><p>See the “setImmediate vs setTimeout in I/O” example in the widget.</p></x-simple>
<x-ev>Detailed Node knowledge.</x-ev></x-q>

<x-q n="2.40" tag="must solid"><x-t>What is process.nextTick()?</x-t>
<x-say>Node’s way to schedule a callback to run right after the current operation, before promise microtasks and before the event loop continues. It’s used inside Node’s APIs to make callbacks consistently async.</x-say>
<x-fu q="When would you use it over setImmediate?">Almost never in app code. nextTick for “after this function returns but before anything else” (e.g. emit an event after the caller attached listeners). setImmediate for “yield to I/O first”; it’s the safer default.</x-fu>
<x-ev>Node depth.</x-ev></x-q>

<x-q n="2.41" tag="must solid"><x-t>Does Node.js execute JavaScript in multiple threads?</x-t>
<x-say>Your JavaScript runs on one main thread. Node itself uses extra threads (libuv thread pool, V8’s garbage collector and compiler). You get JS parallelism only with worker_threads, child processes, or running several processes (cluster, PM2, containers).</x-say>
<x-ev>Accurate model.</x-ev></x-q>

<x-q n="2.42" tag="should solid"><x-t>What is the worker thread module?</x-t>
<x-say><code>node:worker_threads</code> runs JavaScript in separate threads, each with its own V8 instance and event loop, communicating via messages (and optionally SharedArrayBuffer). Use it for CPU-heavy work so the main thread keeps serving requests.</x-say>
<x-code><pre data-l="js">// main.js
import { Worker } from 'node:worker_threads';
function runHeavy(data) {
  return new Promise((resolve, reject) => {
    const w = new Worker(new URL('./heavy.js', import.meta.url), { workerData: data });
    w.once('message', resolve); w.once('error', reject);
  });
}
// heavy.js
import { parentPort, workerData } from 'node:worker_threads';
parentPort.postMessage(expensiveParse(workerData));</pre></x-code>
<x-ev>Knowing the escape hatch.</x-ev></x-q>

<x-q n="2.43" tag="must basic"><x-t>What is the difference between CPU-bound and I/O-bound operations?</x-t>
<x-say>CPU-bound work is limited by computation (hashing, image resizing, big JSON parsing). I/O-bound work is mostly waiting (database, HTTP, LLM calls). Node is excellent at I/O-bound work and needs help (workers, queues) for CPU-bound work.</x-say>
<x-eg>An LLM call is I/O-bound for your server: 5 seconds of waiting, almost no CPU. Generating embeddings locally with a model would be CPU/GPU-bound.</x-eg>
<x-ev>Architecture judgement.</x-ev></x-q>

<x-q n="2.44" tag="must solid"><x-t>Why can a CPU-intensive operation block a Node.js server?</x-t>
<x-say>Because all requests share one JS thread. While a callback is computing, the stack is never empty, so the event loop can’t run any other callback: every other request waits, timeouts fire, health checks fail.</x-say>
<x-code><pre data-l="js">app.get('/slow', (req, res) => {
  const end = Date.now() + 5000; while (Date.now() &lt; end) {}  // 5 s of CPU
  res.send('done');            // meanwhile /health doesn't answer either
});</pre></x-code>
<x-fu q="How do you fix it?">Move the work off the main thread (worker_threads, a job queue with separate workers), break it into chunks with setImmediate between them, or use async/streaming APIs.</x-fu>
<x-ev>Production reasoning.</x-ev></x-q>

<h2 class="sec"><span class="k">2.4</span>Practical follow-up: predict the output</h2>
<x-ex t="Predict the execution order (console.log, setTimeout, Promise.resolve, process.nextTick)" tag="must solid" open>
<x-prob>Given a snippet containing <code>console.log</code>, <code>setTimeout</code>, <code>Promise.resolve</code> and <code>process.nextTick</code>, predict the execution order.</x-prob>
<x-tests><pre data-l="js">console.log('start');
setTimeout(() => console.log('timeout'), 0);
Promise.resolve().then(() => {
  console.log('promise 1');
  process.nextTick(() => console.log('tick inside promise'));
}).then(() => console.log('promise 2'));
process.nextTick(() => console.log('tick'));
setImmediate(() => console.log('immediate'));
console.log('end');</pre></x-tests>
<x-hint>Sync first. Then nextTick queue, then promise queue. A nextTick added from inside a promise callback runs after the promise queue is empty. Then timers vs check.</x-hint>
<x-sol><pre data-l="text">start
end
tick
promise 1
promise 2
tick inside promise
timeout        (usually before immediate here; not guaranteed in the main module)
immediate</pre>
<p><b>Why:</b> <code>start</code>, <code>end</code> are synchronous. The stack empties: Node drains nextTick (<code>tick</code>), then the promise queue: <code>promise 1</code> runs and adds a nextTick; its <code>.then</code> queues <code>promise 2</code>, which also runs because Node finishes the current microtask queue first. Then the nextTick queue is checked again: <code>tick inside promise</code>. Then the loop: timers phase (<code>timeout</code>, if 1 ms has passed, which is typical) and check phase (<code>immediate</code>).</p></x-sol>
<x-mist><ul><li>Putting <code>timeout</code> before promises.</li><li>Not knowing nextTick beats promises in CommonJS.</li><li>Claiming the timeout/immediate order is guaranteed in the main module.</li></ul></x-mist>
</x-ex>
<x-ex t="Three more predictions" tag="must solid">
<x-prob>Predict each output, then reveal.</x-prob>
<x-tests><pre data-l="js">// (a)
async function a() { console.log(1); await b(); console.log(2); }
async function b() { console.log(3); }
a(); console.log(4);

// (b)
for (var i = 0; i &lt; 3; i++) setTimeout(() => console.log(i), 0);

// (c)
const p = new Promise((resolve) => { console.log('x'); resolve('y'); console.log('z'); });
p.then(console.log); console.log('w');</pre></x-tests>
<x-sol><p>(a) <code>1 3 4 2</code>: async functions run synchronously until the first await; b’s body runs immediately.</p><p>(b) <code>3 3 3</code>: one shared <code>var i</code>, read after the loop ended. With <code>let</code>: 0 1 2.</p><p>(c) <code>x z w y</code>: the executor runs synchronously; resolve doesn’t stop it; the <code>.then</code> callback is a microtask.</p></x-sol>
</x-ex>

<h2 class="sec"><span class="k">✓</span>Checkpoint</h2>
<x-quiz id="qz-p02">
<x-mcq a="2"><x-t>What does <code>[1,2,3].map(async x => x * 2)</code> return?</x-t><x-o>[2, 4, 6]</x-o><x-o>A Promise of [2, 4, 6]</x-o><x-o>An array of three Promises</x-o><x-o>An error</x-o><x-why>map doesn’t await. Wrap it: <code>await Promise.all(arr.map(async ...))</code>.</x-why></x-mcq>
<x-mcq a="1"><x-t>Output order: <code>setTimeout(A); Promise.resolve().then(B); process.nextTick(C); D();</code> (CommonJS, D logs synchronously)</x-t><x-o>A B C D</x-o><x-o>D C B A</x-o><x-o>D B C A</x-o><x-o>C D B A</x-o><x-why>Sync → nextTick → promise microtasks → timers.</x-why></x-mcq>
<x-mcq a="3"><x-t>Which values are falsy?</x-t><x-o>"0" and []</x-o><x-o>{} and "false"</x-o><x-o>" " (space)</x-o><x-o>0, "" and NaN</x-o><x-why>Falsy: false, 0, -0, 0n, "", null, undefined, NaN. Non-empty strings and all objects are truthy.</x-why></x-mcq>
<x-mcq a="0"><x-t>You need 50 embeddings and 3 might fail. You want all successes. Use…</x-t><x-o>Promise.allSettled (ideally with a concurrency limit)</x-o><x-o>Promise.all</x-o><x-o>Promise.race</x-o><x-o>a for loop without await</x-o><x-why>allSettled keeps the successes; a limit protects the provider’s rate limit.</x-why></x-mcq>
<x-mcq a="1"><x-t>A 3-second synchronous loop runs inside one Express handler. What happens to other requests?</x-t><x-o>They run in parallel on other cores</x-o><x-o>They wait until the loop finishes</x-o><x-o>libuv moves the loop to its thread pool</x-o><x-o>They fail immediately</x-o><x-why>One JS thread: nothing else runs until the stack empties.</x-why></x-mcq>

</x-quiz>
