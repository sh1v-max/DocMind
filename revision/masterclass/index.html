<h2 class="sec"><span class="k">13.A</span>The system</h2>
<x-lesson t="DocMind architecture, as built" tag="must">
<x-def>DocMind lets a user (a silent guest by default) upload PDFs, chat with them with memory and streamed answers, and generate a validated 5-question quiz. Free-tier stack: Express 5 + TypeScript on Render, React on Vercel, Neon Postgres with pgvector, Upstash Redis + BullMQ, Gemini (Flash-Lite for generation, gemini-embedding-001 with 3072 dimensions) over plain REST.</x-def>
<x-vis><x-w w="flow" f="docmind"></x-w><x-w w="agent"></x-w></x-vis>
<x-impl><table><thead><tr><th>Area</th><th>What’s really there</th><th>Numbers</th></tr></thead><tbody>
<tr><td>Auth</td><td>Every visitor becomes a guest user row + JWT; sign-up upgrades the guest in place; HS256 Bearer token; every repository read/delete takes a required userId</td><td>tokens 7 d (user) / 30 d (guest); caps 5 / 10 documents; 20 auth requests per 15 min per IP</td></tr>
<tr><td>Ingestion</td><td>pdf-parse v2 in the request, ~500-word chunks (no overlap), row saved as processing, BullMQ job (jobId = documentId) embeds + stores, worker inside the API process</td><td>3 attempts, 5 s → 10 s backoff; live: 202 in ~2 s, ready in ~5 s</td></tr>
<tr><td>Retrieval</td><td>exact cosine search (<code>&lt;=&gt;</code>), INNER JOIN documents on owner + status ready, no vector index</td><td>top 3 per search</td></tr>
<tr><td>Routing</td><td>example-phrase vectors first; LLM classifier (JSON, temperature 0, Zod) on close calls and on any vector “quiz” guess; unsure → document question</td><td>52-message eval: no harmful mistakes, one harmless miss, LLM used on 17</td></tr>
<tr><td>Agent</td><td>one loop (<code>streamAgent</code>), tools <code>searchDocuments({ query })</code> and <code>listDocuments()</code>, history as real turns + systemInstruction</td><td>max 3 model calls, last without tools; 9/9 vs old pipeline 8/9 on the same questions</td></tr>
<tr><td>Streaming</td><td>SSE over POST via fetch: meta, status, sources, action, text, done, error</td><td>saved answer = exactly the streamed text</td></tr>
<tr><td>Quiz</td><td>sampleChunks (coverage), Gemini structured output + Zod, retry once then 502, options shuffled in code</td><td>17/17 valid in testing; answer positions were 22/36/32/10% before shuffling</td></tr></tbody></table></x-impl>
<x-dm>Free-tier limits that shape the design: Flash-Lite 15 requests/min and 500/day; embeddings 100 requests/min, 30K tokens/min, 1K/day; Upstash 500K commands/month (BullMQ tuned from ~34K to ~5.5K commands/day idle).</x-dm>
</x-lesson>

<h2 class="sec"><span class="k">13.1</span>Architecture walkthrough</h2>
<x-q n="13.1" tag="must basic"><x-t>What problem does DocMind solve?</x-t><x-say>Asking questions about your own PDFs and getting answers grounded in them, with sources, plus quick self-testing with generated quizzes. For me it was also the project to learn every part of an AI backend properly.</x-say><x-ev>Clarity of purpose.</x-ev></x-q>
<x-q n="13.2" tag="must solid"><x-t>Explain its complete architecture.</x-t><x-say>React frontend on Vercel talks to an Express 5 API on Render with a Bearer JWT. Uploads are parsed and chunked in the request, saved as processing, and embedded by a BullMQ worker into Neon Postgres with pgvector. Chat embeds the message, routes it (smalltalk, document question, quiz offer), and document questions go to an agent loop on Gemini with two tools; the answer streams back over SSE.</x-say><x-simple><p>Step through the DocMind animation above while saying it. Layers: routes (HTTP only) → services (no req/res) → repositories (the only SQL, every function takes userId).</p></x-simple><x-ev>End-to-end ownership.</x-ev></x-q>
<x-q n="13.3" tag="must basic"><x-t>What are the main backend components?</x-t><x-say>Auth (guest/register/login, requireAuth), upload + ingestion service, the queue and worker, the chat pipeline (prepareChat, router, agent, tools), the quiz service, the LLM and embedding services (plain fetch to Gemini), repositories over Drizzle, and the SSE streaming layer.</x-say><x-ev>Component map.</x-ev></x-q>
<x-q n="13.4" tag="must basic"><x-t>How does the frontend communicate with the backend?</x-t><x-say>JSON over HTTPS with the token in the Authorization header via one <code>authFetch</code> helper; multipart for uploads; and <code>POST /chat-stream</code> read with fetch + a hand-written SSE parser, because EventSource can’t send an Authorization header. The frontend polls <code>GET /documents</code> while anything is processing.</x-say><x-ev>Protocol reasoning.</x-ev></x-q>
<x-q n="13.5" tag="must solid"><x-t>What database do you use, and why?</x-t><x-say>Postgres on Neon with pgvector. My data is relational (users, documents, messages, ownership), and pgvector keeps embeddings next to it, so one query can join chunks to documents and filter by owner and status. One system, free tier, SQL I already know.</x-say><x-fu q="Would you switch to a vector DB?">Not at this scale. With many millions of vectors or heavy QPS I’d first add an index (needs halfvec or fewer dimensions at 3072), then consider a dedicated store.</x-fu><x-ev>Justified choice.</x-ev></x-q>
<x-q n="13.6" tag="must basic"><x-t>What is the role of your embedding model?</x-t><x-say>It turns every chunk, every chat message and the router’s example phrases into 3072-number vectors, so search and routing work by meaning. The message is embedded once and reused for routing and the first search.</x-say><x-ev>Understanding.</x-ev></x-q>
<x-q n="13.7" tag="must basic"><x-t>How do you store documents?</x-t><x-say>I don’t keep the PDF. A <code>documents</code> row stores filename, size, text length, chunk count, owner, status (processing/ready/failed) and an error; the chunk texts and embeddings go into <code>chunks</code>.</x-say><x-fu q="Downside?">No re-chunking or re-embedding without a re-upload, and no “view original page”. Object storage would fix both.</x-fu><x-ev>Honest design.</x-ev></x-q>
<x-q n="13.8" tag="must basic"><x-t>How do you organize document chunks?</x-t><x-say>One row per chunk: content, <code>vector(3072)</code> embedding and document_id. No user_id on chunks on purpose: ownership lives on the document, and every search joins through it.</x-say><x-ev>Data modelling.</x-ev></x-q>
<x-q n="13.9" tag="must solid"><x-t>How does the application handle multiple users?</x-t><x-say>Every visitor is a real user row (guests too), every data route requires a JWT, the user id only ever comes from <code>req.user.id</code>, and every repository function that reads or deletes user data takes userId as a required parameter. Someone else’s document behaves like a missing one (404).</x-say><x-dm>Making userId required turned 15 call sites into compile errors, which became the to-do list. The one thing the compiler can’t catch is two string arguments swapped, so I check argument order.</x-dm><x-ev>Security ownership.</x-ev></x-q>
<x-q n="13.10" tag="must solid"><x-t>What are the major technical challenges you encountered?</x-t><x-say>Three good ones: (1) Gemini rejects a resent function-call turn without its thoughtSignature, so model turns are sent back byte for byte; (2) the rate limiter keyed on proxies until I measured the right trust-proxy hop count on Render (3); (3) making the ingest job idempotent and safe when a user deletes the document mid-job.</x-say><x-ev>Real problem solving.</x-ev></x-q>

<h2 class="sec"><span class="k">13.2</span>Document ingestion</h2>
<x-q n="13.11" tag="must solid"><x-t>Explain what happens when a user uploads a PDF.</x-t><x-say>Auth → document cap checked before multer reads the file → multer (memory, 10 MB) → pdf-parse → 400 if there’s no text → ~500-word chunks → row saved as processing → job queued with jobId = documentId → 202. The worker embeds and stores the chunks and marks it ready; the frontend polls until then.</x-say><x-ev>Precise flow.</x-ev></x-q>
<x-q n="13.12" tag="must basic"><x-t>How do you extract text?</x-t><x-say>pdf-parse v2 (<code>new PDFParse(...)</code>, <code>getText()</code>). It needs a real text layer; there’s no OCR.</x-say><x-ev>Facts.</x-ev></x-q>
<x-q n="13.13" tag="must solid"><x-t>How do you handle empty or corrupted PDFs?</x-t><x-say>A PDF with no text layer gets a 400. I check the per-page texts, because pdf-parse adds a “-- 1 of N --” marker per page and a textless PDF still returned 12 characters. A file that fails to parse ends in a JSON error from the last-resort handler; oversize is a 413.</x-say><x-ev>Edge cases.</x-ev></x-q>
<x-q n="13.14" tag="must basic"><x-t>How do you chunk the extracted text?</x-t><x-say>Split on whitespace into words and take 500 at a time, no overlap. It’s a deliberately simple baseline.</x-say><x-ev>Honesty.</x-ev></x-q>
<x-q n="13.15" tag="must basic"><x-t>How do you generate embeddings?</x-t><x-say>In the BullMQ worker, with gemini-embedding-001 over the REST API (key in the <code>x-goog-api-key</code> header), then the chunks are inserted with their vectors.</x-say><x-ev>Facts.</x-ev></x-q>
<x-q n="13.16" tag="must basic"><x-t>How do you store embeddings in PostgreSQL?</x-t><x-say>A <code>vector(3072)</code> column via pgvector, written through Drizzle; search uses Drizzle’s <code>cosineDistance</code>, which builds the <code>&lt;=&gt;</code> expression.</x-say><x-ev>Facts.</x-ev></x-q>
<x-q n="13.17" tag="must solid"><x-t>Why did you choose your chunk size?</x-t><x-say>Honestly, as a simple starting point: 500 words is about 650–700 tokens, fits the embedding model’s input comfortably, and keeps three chunks small in the prompt. I didn’t tune it with an eval; the next step is overlap and paragraph-aware splitting, compared on my question set.</x-say><x-no>Pretending it was chosen by experiment.</x-no><x-ev>Honest reasoning.</x-ev></x-q>
<x-q n="13.18" tag="must solid"><x-t>How do you handle ingestion failures?</x-t><x-say>The job retries 3 times with 5 s then 10 s backoff. It’s idempotent: it deletes the document’s chunks first, then inserts all of them. After the last attempt (checked with <code>job.getState() === 'failed'</code>), the failed handler deletes partial chunks and sets status failed with a short reason. If Redis is down at upload, the row is removed and the user gets 503.</x-say><x-ev>Reliability depth.</x-ev></x-q>
<x-q n="13.19" tag="must basic"><x-t>Can the user query a document before ingestion completes?</x-t><x-say>No. Chatting with one specific processing or failed document returns 409 before any Gemini call; search and quiz only read ready documents; the UI only lets you pick ready ones.</x-say><x-ev>Correctness.</x-ev></x-q>
<x-q n="13.20" tag="must basic"><x-t>How would you implement ingestion status?</x-t><x-say>It’s implemented: <code>documents.status</code> (processing/ready/failed) with <code>DEFAULT 'ready'</code> so adding it to the live table was safe, plus an <code>error</code> column; the frontend polls every 2 s, slowing to 10 s after a minute, only while something is processing.</x-say><x-ev>Implementation detail.</x-ev></x-q>

<h2 class="sec"><span class="k">13.3</span>Agent architecture</h2>
<x-q n="13.21" tag="must solid"><x-t>How does DocMind identify the user’s intent?</x-t><x-say>A hybrid router. The message is already embedded, so I compare it with example phrases for three intents (smalltalk, document question, quiz request) for free. Document-question guesses are accepted; smalltalk needs a margin of at least 0.03; any quiz guess and close calls go to an LLM classifier (JSON mode, temperature 0, Zod). Anything unsure becomes a document question.</x-say><x-dm>Found while building: vectors route by shared words (“compare the two pdfs” looked like “quiz me about the pdf”), which is why quiz guesses always get the LLM.</x-dm><x-ev>Design + evidence.</x-ev></x-q>
<x-q n="13.22" tag="must solid"><x-t>How does the router select an agent?</x-t><x-say>It doesn’t pick between agents: there’s one agent. The router picks one of three paths: smalltalk (one LLM call, no search), document question (the agent loop), or quiz request (an offer written by code, no LLM).</x-say><x-ev>Correcting the premise.</x-ev></x-q>
<x-q n="13.23" tag="must solid"><x-t>Why did you use multiple agents?</x-t><x-say>I didn’t, and that was deliberate. Only document questions need tool choices; smalltalk and the quiz offer are better as plain code paths: cheaper, predictable, and nothing to go wrong.</x-say><x-ev>Judgement over buzzwords.</x-ev></x-q>
<x-q n="13.24" tag="must solid"><x-t>Could you have implemented the same system with one agent?</x-t><x-say>It is one agent. I could even drop the router and let that agent handle smalltalk too, but then every “thanks!” would cost tool-capable calls and might search. The router saves calls on the free tier (15 requests/min).</x-say><x-ev>Trade-offs.</x-ev></x-q>
<x-q n="13.25" tag="must basic"><x-t>What responsibilities does each agent have?</x-t><x-say>The agent answers questions about the user’s documents: it decides what to search (it writes the query, resolving follow-ups like “who founded it?”), can list documents, and must answer only from tool results. Smalltalk replies without searching and refuses general-knowledge questions; the quiz path only offers a button.</x-say><x-ev>Clear responsibilities.</x-ev></x-q>
<x-q n="13.26" tag="must solid"><x-t>How do agents communicate?</x-t><x-say>They don’t need to: there’s one agent. The router hands one message to one path through <code>prepareChat</code>; the agent talks only to its tools and the model.</x-say><x-ev>Accuracy.</x-ev></x-q>
<x-q n="13.27" tag="must solid"><x-t>How do you handle invalid agent outputs?</x-t><x-say>Tool arguments are validated with Zod; an unknown tool, bad arguments or a throwing tool become <code>{ error }</code> data the model sees. An invalid classifier reply falls back to document question. If steps run out, a give-up line is streamed (and saved). Every model turn is sent back unchanged.</x-say><x-ev>Robustness.</x-ev></x-q>
<x-q n="13.28" tag="must basic"><x-t>How do you maintain context?</x-t><x-say>The last 8 messages of this session, for this user, are loaded and sent as real user/model turns plus a system instruction. The session id comes from the client, but every lookup filters by session and user.</x-say><x-ev>Memory design.</x-ev></x-q>
<x-q n="13.29" tag="must solid"><x-t>How do you handle tool failures?</x-t><x-say>The tool wrapper catches the error and returns <code>{ error }</code> to the model; the loop is capped at 3 calls with the last one tool-free, so the model has to give an answer. Embedding a query is reused when possible to save calls.</x-say><x-ev>Robustness.</x-ev></x-q>
<x-q n="13.30" tag="must solid"><x-t>How would you prevent one agent from accessing another user’s documents?</x-t><x-say>Already prevented in code: searchDocuments only takes <code>{ query }</code>; userId and document scope are closed over from the session before the loop starts, and the SQL joins documents on <code>user_id</code> and <code>status = 'ready'</code>. The model can’t name a user or document id.</x-say><x-ev>Security design.</x-ev></x-q>

<h2 class="sec"><span class="k">13.4</span>Tool implementation</h2>
<x-q n="13.31" tag="must solid"><x-t>Explain your searchDoc tool.</x-t><x-say>It’s called <code>searchDocuments</code>. The model passes a standalone query; I validate it (trimmed, 1–500 chars), embed it, run the owner-scoped vector search (top 3), add new chunks to the turn’s sources, and return <code>{ results: [{ filename, content }] }</code>, or a “nothing relevant” note. The status line shows the model’s query (“Searching for …”).</x-say><x-ev>Implementation detail.</x-ev></x-q>
<x-q n="13.32" tag="must basic"><x-t>Explain your listDoc tool.</x-t><x-say><code>listDocuments</code> takes no arguments and returns the user’s documents: filename, status, chunk count and upload date. It answers “which files do I have?”, which chunk search can’t.</x-say><x-ev>Facts.</x-ev></x-q>
<x-q n="13.33" tag="must basic"><x-t>What inputs do these tools accept?</x-t><x-say>searchDocuments: <code>{ query: string }</code>. listDocuments: nothing. Scope never comes from the model.</x-say><x-ev>Facts.</x-ev></x-q>
<x-q n="13.34" tag="must basic"><x-t>How do you validate their arguments?</x-t><x-say>Zod <code>safeParse</code>, exactly like a request body: the model is an untrusted client. Bad arguments become an error result, never an exception.</x-say><x-ev>Practice.</x-ev></x-q>
<x-q n="13.35" tag="must basic"><x-t>What does each tool return?</x-t><x-say>searchDocuments: results with filename and content (not the distance, which the model would over-read). listDocuments: an array of documents with filename, status, chunkCount, uploadedAt.</x-say><x-ev>Facts.</x-ev></x-q>
<x-q n="13.36" tag="must basic"><x-t>What happens when no documents are found?</x-t><x-say>Search returns an empty results list with “Nothing relevant was found in the documents.” and the instruction makes the model say so. In “All documents” mode with nothing ready, the request gets a 404 before the agent runs; a quiz request with no documents gets a sentence, not an error.</x-say><x-ev>Edge cases.</x-ev></x-q>
<x-q n="13.37" tag="must basic"><x-t>How does the agent use tool results?</x-t><x-say>The results go back as a function-response turn; the next model call reads them and answers with them, citing filenames in all-documents chats. The sources list sent to the UI is every chunk the searches returned, deduplicated.</x-say><x-ev>Flow.</x-ev></x-q>
<x-q n="13.38" tag="must basic"><x-t>Can multiple tools be called in a single turn?</x-t><x-say>Yes: Gemini can return several function calls in one turn, and I run them all. In testing it ran two searches in one step for a two-part question. The limit is 2 rounds of tool calls, not 2 searches.</x-say><x-ev>Precision.</x-ev></x-q>
<x-q n="13.39" tag="must solid"><x-t>How would you implement a new document-deletion tool?</x-t><x-say>A <code>deleteDocument({ documentId })</code> tool with the id validated as a UUID; it wouldn’t delete directly: it would return a proposal that the UI shows as a confirm button (like the quiz offer’s action), and the click calls the existing <code>DELETE /documents/:id</code>, which checks ownership and deletes the row first, then chunks and messages.</x-say><x-ev>Safe design.</x-ev></x-q>
<x-q n="13.40" tag="must solid"><x-t>How would you secure that tool?</x-t><x-say>Owner-scoped SQL with userId from the session, a validated single id (no wildcards or bulk delete), human confirmation by click, a rate limit, an audit log, and the system instruction to only offer deletion when explicitly asked.</x-say><x-ev>Defence in depth.</x-ev></x-q>

<h2 class="sec"><span class="k">13.5</span>Architecture decisions</h2>
<x-q n="13.41" tag="must solid"><x-t>Why did you choose Mastra?</x-t><x-say>DocMind doesn’t use Mastra yet: I wrote the agent loop myself on Gemini’s REST API to understand it. I’ve planned Mastra for the next phase, workflows only: durable suspend/resume on Postgres, so a pending quiz offer can survive between two requests. I checked its 1.82 package first: CommonJS build, Zod 4, it can reuse my pg pool, and resume claims are atomic.</x-say><x-no>Claiming you built it with Mastra.</x-no><x-ev>Honesty and reasoning.</x-ev></x-q>
<x-q n="13.42" tag="must basic"><x-t>Why did you choose PostgreSQL?</x-t><x-say>Relational data with ownership, transactions and joins, plus pgvector and full-text search in the same database, on a free managed host.</x-say><x-ev>Justification.</x-ev></x-q>
<x-q n="13.43" tag="must basic"><x-t>Why did you use pgvector?</x-t><x-say>So vector search can join documents and filter by owner and status in one query, with no second system to keep in sync.</x-say><x-ev>Justification.</x-ev></x-q>
<x-q n="13.44" tag="must solid"><x-t>Why did you choose your embedding model?</x-t><x-say>gemini-embedding-001 comes with the same Gemini key and free tier I already use. Its default 3072 dimensions are a trade-off: more storage, and pgvector indexes cap the plain vector type at 2,000 dimensions, so before adding an index I’d use halfvec or ask the model for shorter vectors.</x-say><x-ev>Trade-off awareness.</x-ev></x-q>
<x-q n="13.45" tag="must solid"><x-t>What would happen if you changed the embedding model?</x-t><x-say>Every stored vector becomes incompatible. I’d add a new column, dual-write new uploads, re-embed old chunks in a background job, evaluate, then switch queries and router example vectors together. The router’s example vectors are computed lazily per process, so they’d follow automatically.</x-say><x-ev>Operational thinking.</x-ev></x-q>
<x-q n="13.46" tag="must solid"><x-t>Why did you choose your particular chunking strategy?</x-t><x-say>Simplest thing that works, so I could build the rest first. Its weaknesses are known: no overlap and no structure awareness, so answers can be split across chunks.</x-say><x-ev>Honesty.</x-ev></x-q>
<x-q n="13.47" tag="must solid"><x-t>What would you improve in DocMind?</x-t><x-say>Real document summaries (written by the worker at upload, since a top-3 search can’t summarise a long PDF), fair search across several documents, chunk overlap + hybrid search, timeouts/retries/fallback on Gemini calls, and automated tests.</x-say><x-dm>The first two are logged as important in ISSUES (#36 summary, #37 multi-document search).</x-dm><x-ev>Self-critique.</x-ev></x-q>
<x-q n="13.48" tag="must solid"><x-t>What technical debt exists?</x-t><x-say>No automated tests; no migrations (hand-run SQL on Neon); no foreign keys; no timeout or retry on Gemini fetches; no message length cap; history counted in messages not tokens; sources and tool calls not saved with messages; in-memory rate limiter; a bad API key shows a “check your connection” message; no token/cost logging. I keep them in a numbered issues file.</x-say><x-ev>Ownership.</x-ev></x-q>
<x-q n="13.49" tag="must solid"><x-t>How would you make DocMind production-ready?</x-t><x-say>Tests + CI, drizzle-kit migrations with a baseline, foreign keys, timeouts/retries/circuit breaker and a fallback model, structured logs with request ids and token costs, a separate worker service, a Redis-backed rate limiter, object storage for originals, OCR, an eval set run in CI, refresh tokens, and paid API tiers.</x-say><x-ev>Production thinking.</x-ev></x-q>
<x-q n="13.50" tag="must solid"><x-t>What would happen if 1,000 users used DocMind simultaneously?</x-t><x-say>The Gemini free tier breaks first: 15 generation requests per minute means 429s within seconds. Then: one small Render instance with the worker in the same process and concurrency 1 (upload backlog), an in-memory limiter per instance, Neon free connections, and cross-region latency. Fixes: paid tiers and per-user quotas, horizontal API instances, a separate autoscaled worker, a shared Redis limiter, a pooled DB endpoint, and queueing or shedding load gracefully.</x-say><x-ev>Scaling realism.</x-ev></x-q>

<h2 class="sec"><span class="k">✓</span>Checkpoint</h2>
<x-quiz id="qz-p13">
<x-mcq a="1"><x-t>How many agents does DocMind have?</x-t><x-o>Three</x-o><x-o>One, behind a router with two non-agent paths</x-o><x-o>Two</x-o><x-o>None</x-o><x-why>Smalltalk and the quiz offer are code paths.</x-why></x-mcq>
<x-mcq a="2"><x-t>Where does searchDocuments get the user id?</x-t><x-o>The model’s arguments</x-o><x-o>The session id</x-o><x-o>The tool context set from req.user.id</x-o><x-o>The document row</x-o><x-why>Scope is closed over by code.</x-why></x-mcq>
<x-mcq a="0"><x-t>Live upload timings?</x-t><x-o>202 in ~2 s, ready in ~5 s</x-o><x-o>200 in 30 s</x-o><x-o>202 in 10 ms, ready in 1 min</x-o><x-o>Not measured</x-o><x-why>Measured live on 2026-10-15.</x-why></x-mcq>

<h2 class="sec"><span class="k">14.A</span>The design</h2>
<x-lesson t="Course creation: architecture and workflow" tag="must">
<x-def>A user enters a topic, level and number of modules. The system generates an outline, waits for the user to approve it, generates lessons and quizzes, checks quality, and publishes the course.</x-def>
<x-vis><x-w w="flow" f="course"></x-w><x-w w="workflow"></x-w></x-vis>
<x-impl><table><thead><tr><th>Component</th><th>Job</th></tr></thead><tbody>
<tr><td>API (Express)</td><td>auth, validation, start/approve/status endpoints, idempotency key</td></tr>
<tr><td>Workflow engine (Mastra)</td><td>steps, suspend/resume, retries, snapshots in Postgres, recovery</td></tr>
<tr><td>LLM service</td><td>structured generation with Zod, timeouts, retries, model routing, usage logging</td></tr>
<tr><td>Postgres</td><td>courses (status, outline, request key), lesson_drafts, module_quizzes, generation_events</td></tr>
<tr><td>Frontend</td><td>outline review screen, progress view (polling or SSE), course reader</td></tr></tbody></table>
<pre data-l="text">POST /courses                    { topic, level, modules } + Idempotency-Key → 202 { courseId, status: awaiting_approval, outline }
POST /courses/:id/approval       { approved, feedback? }                     → 202 { status: generating } | 409 already answered
GET  /courses/:id                → { status, progress: { lessonsDone, lessonsTotal }, outline, error? }
POST /courses/:id/lessons/:m/:l/regenerate                                   → 202</pre></x-impl>
<x-walk><p>Full step code: Phase 9, “Build it: course generation in Mastra”. Statuses: draft → awaiting_approval → generating → published, with rejected / failed / expired as exits.</p></x-walk>
</x-lesson>

<h2 class="sec"><span class="k">14.1</span>Architecture</h2>
<x-q n="14.1" tag="must basic"><x-t>What problem does this application solve?</x-t><x-say>Creating a structured, reviewed course (modules, lessons, quizzes) from a topic in minutes instead of days, with the human staying in control of the outline.</x-say><x-ev>Purpose.</x-ev></x-q>
<x-q n="14.2" tag="must basic"><x-t>How does the course-generation process start?</x-t><x-say><code>POST /courses</code> with a validated body and an idempotency key; the API creates (or finds) the course row and starts a workflow run with the user as the resource owner.</x-say><x-ev>Flow.</x-ev></x-q>
<x-q n="14.3" tag="must basic"><x-t>What components are involved?</x-t><x-say>API, workflow engine with Postgres storage, LLM service, app tables, and the frontend’s review and progress screens; optionally a queue for very large courses.</x-say><x-ev>Components.</x-ev></x-q>
<x-q n="14.4" tag="must solid"><x-t>Why did you choose a workflow-based architecture?</x-t><x-say>The steps and order are known, it runs for minutes, it must pause for approval, survive restarts, retry single steps and never duplicate content. Those are exactly what workflows give; an agent would add unpredictability for no gain.</x-say><x-ev>Architecture reasoning.</x-ev></x-q>
<x-q n="14.5" tag="must basic"><x-t>What is the role of the LLM?</x-t><x-say>Content generation inside specific steps (outline, lessons, quizzes, optional quality judging), always with a schema. The LLM never decides the process.</x-say><x-ev>Separation.</x-ev></x-q>
<x-q n="14.6" tag="must basic"><x-t>How do you structure the generated course?</x-t><x-say>Course → modules (title, objectives) → lessons (title, Markdown body) → one quiz per module (5 questions × 4 options), each level validated by a Zod schema.</x-say><x-ev>Modelling.</x-ev></x-q>
<x-q n="14.7" tag="must basic"><x-t>How do you store the output?</x-t><x-say>Course row (status, outline JSONB, request key), <code>lesson_drafts</code> keyed by (course, module, lesson), <code>module_quizzes</code> keyed by (course, module); publish flips the status in one transaction.</x-say><x-ev>Data design.</x-ev></x-q>
<x-q n="14.8" tag="must solid"><x-t>How do you validate generated content?</x-t><x-say>Schema validation (Zod) on every LLM output, deterministic checks (unique titles, lesson length, distinct quiz options, valid answer index), and an optional judge pass for relevance; failures retry the step.</x-say><x-ev>Quality control.</x-ev></x-q>

<h2 class="sec"><span class="k">14.2</span>Workflow design</h2>
<x-q n="14.9" tag="must solid"><x-t>Explain the complete course-generation workflow.</x-t><x-say>prepare (dedupe, create row) → outline (LLM, schema) → approve (suspend until the user answers) → lessons (foreach, concurrency 3, retries) → quizzes (foreach per module) → quality checks → publish (transaction).</x-say><x-ev>End to end.</x-ev></x-q>
<x-q n="14.10" tag="must basic"><x-t>What are the individual steps?</x-t><x-say>Validate and dedupe; generate outline; human approval; generate lessons; generate quizzes; check quality; publish.</x-say><x-ev>Recall.</x-ev></x-q>
<x-q n="14.11" tag="must basic"><x-t>Which steps are deterministic?</x-t><x-say>Validation, dedupe, mapping the outline to work items, quality checks, and publishing. Their output depends only on input and data.</x-say><x-ev>Distinction.</x-ev></x-q>
<x-q n="14.12" tag="must basic"><x-t>Which steps require an LLM?</x-t><x-say>Outline, lessons, quizzes, and optionally a judge for relevance.</x-say><x-ev>Distinction.</x-ev></x-q>
<x-q n="14.13" tag="must solid"><x-t>Which steps can execute in parallel?</x-t><x-say>Lessons across modules (and within a module if they don’t depend on each other), and quizzes per module once that module’s lessons exist. Capped concurrency for rate limits.</x-say><x-ev>Parallelism judgement.</x-ev></x-q>
<x-q n="14.14" tag="must basic"><x-t>How do you pass data between steps?</x-t><x-say>Each step’s output is the next step’s input; <code>.map()</code> turns the outline into lesson items; later steps read the approved outline with <code>getStepResultAsync</code>; large content goes to the database, and steps pass ids rather than big blobs.</x-say><x-ev>Data flow.</x-ev></x-q>
<x-q n="14.15" tag="must solid"><x-t>What happens when one step fails?</x-t><x-say>It retries (step <code>retries: 2</code>); if it still fails the run fails, the course is marked failed with the reason, completed drafts stay, and a re-run continues from the failed step.</x-say><x-ev>Failure handling.</x-ev></x-q>
<x-q n="14.16" tag="must basic"><x-t>How do you implement retries?</x-t><x-say>Step-level retries for LLM steps, transport retries with backoff inside the LLM client for 429/5xx, and no retries on deterministic validation failures that would fail again.</x-say><x-ev>Retry discipline.</x-ev></x-q>
<x-q n="14.17" tag="must solid"><x-t>How do you prevent duplicate course generation?</x-t><x-say>Unique (user_id, request_key) on courses with an upsert, so a repeated POST finds the same course (and returns it if published); the approval endpoint claims the waiting state once.</x-say><x-ev>Idempotency.</x-ev></x-q>
<x-q n="14.18" tag="must basic"><x-t>How do you persist workflow state?</x-t><x-say>Mastra storage on Postgres saves a snapshot per step; app tables hold the content and user-visible status.</x-say><x-ev>Persistence.</x-ev></x-q>

<h2 class="sec"><span class="k">14.3</span>Suspend and resume</h2>
<x-q n="14.19" tag="must basic"><x-t>Why would you suspend course generation?</x-t><x-say>To let the user approve or reject the outline before spending tokens on 30 lessons, and to keep a human in control of what gets generated.</x-say><x-ev>Purpose.</x-ev></x-q>
<x-q n="14.20" tag="must basic"><x-t>How would you request user approval?</x-t><x-say>The approval step suspends with the outline; the API returns 202 with status awaiting_approval and the outline; the UI shows it with Approve and Reject (with feedback).</x-say><x-ev>Flow.</x-ev></x-q>
<x-q n="14.21" tag="must basic"><x-t>Where is the workflow state stored?</x-t><x-say>In Postgres: Mastra’s snapshot table for the run, and the course row for status and outline.</x-say><x-ev>Storage.</x-ev></x-q>
<x-q n="14.22" tag="must basic"><x-t>How does the frontend know the workflow is waiting?</x-t><x-say>The course status is awaiting_approval (returned by POST and by <code>GET /courses/:id</code>); polling or an SSE event updates the screen.</x-say><x-ev>UX.</x-ev></x-q>
<x-q n="14.23" tag="must solid"><x-t>What happens after user approval?</x-t><x-say>The endpoint checks ownership and claims the waiting state, then resumes the run in the background; the approval step re-runs with resumeData, marks the outline approved, and lesson generation begins; the client watches progress.</x-say><x-ev>Resume flow.</x-ev></x-q>
<x-q n="14.24" tag="must solid"><x-t>What happens if the user rejects the outline?</x-t><x-say>Either end the run with <code>bail({ outcome: 'rejected' })</code> (status success, outcome rejected) and mark the course rejected, or loop back to regenerate the outline with the feedback, a bounded number of times (e.g. <code>.dountil</code> or a new run).</x-say><x-ev>Design choice.</x-ev></x-q>
<x-q n="14.25" tag="must solid"><x-t>What happens if the server restarts during suspension?</x-t><x-say>Nothing is lost and nothing is running: the snapshot is in Postgres. After restart the approval can arrive and <code>createRun({ runId })</code> + <code>resume()</code> continues it. Runs that were running (not suspended) are re-driven by recovery at boot.</x-say><x-ev>Durability understanding.</x-ev></x-q>
<x-q n="14.26" tag="must solid"><x-t>How would you handle an approval that arrives twice?</x-t><x-say>The first request claims the state with a conditional UPDATE (awaiting_approval → resuming) and wins; the second updates 0 rows and gets 409. Mastra’s own resume claim (suspended → running) throws <code>WORKFLOW_RESUME_ALREADY_CLAIMED</code> as a second guard.</x-say><x-ev>Concurrency.</x-ev></x-q>

<h2 class="sec"><span class="k">14.4</span>Content quality</h2>
<x-q n="14.27" tag="must solid"><x-t>How do you ensure lessons are relevant to the course topic?</x-t><x-say>Give each lesson call the course topic, module title, objectives and sibling titles; check relevance with embedding similarity between lesson and module objective (threshold) or a judge; regenerate outliers.</x-say><x-ev>Quality methods.</x-ev></x-q>
<x-q n="14.28" tag="must solid"><x-t>How do you prevent duplicate modules?</x-t><x-say>Instruct uniqueness in the outline prompt, then check in code: normalised title equality and embedding similarity between module titles/objectives; regenerate the outline if duplicates appear; the user also sees it at approval.</x-say><x-ev>Dedup.</x-ev></x-q>
<x-q n="14.29" tag="must solid"><x-t>How do you validate quiz questions?</x-t><x-say>Zod (5 questions, 4 distinct options, index 0–3), answerable from the module’s lessons (a judge answers each question from the lesson text and must match the key), shuffle option order in code, no duplicates across modules.</x-say><x-ev>Validation.</x-ev></x-q>
<x-q n="14.30" tag="must solid"><x-t>How do you ensure generated answers are correct?</x-t><x-say>You can’t guarantee it with an LLM alone: ground quizzes in the generated lessons, verify with a second model or a judge, flag low-confidence items for review, let users report errors, and for factual domains retrieve trusted sources (RAG) before generating.</x-say><x-ev>Honest limits.</x-ev></x-q>
<x-q n="14.31" tag="must solid"><x-t>How would you evaluate course quality?</x-t><x-say>Automatic checks (coverage of objectives, readability, duplicate rate, quiz validity), judge scores on a rubric, human review of samples, and learner signals (completion, quiz scores, ratings, reports).</x-say><x-ev>Evaluation.</x-ev></x-q>
<x-q n="14.32" tag="must solid"><x-t>How would you reduce the cost of generating large courses?</x-t><x-say>Approve the outline before spending on lessons; smaller models for quizzes and checks; cap lesson length; reuse content for repeated topics (cache by normalised topic + level); never regenerate finished lessons on retry; batch where possible; log tokens per course and enforce per-user budgets.</x-say><x-ev>Cost engineering.</x-ev></x-q>

<h2 class="sec"><span class="k">✓</span>Checkpoint</h2>
<x-quiz id="qz-p14">
<x-mcq a="0"><x-t>Where should the approval happen to save the most cost?</x-t><x-o>After the outline, before lessons</x-o><x-o>After publishing</x-o><x-o>After lessons</x-o><x-o>Never</x-o><x-why>Cheap step reviewed before the expensive ones.</x-why></x-mcq>
<x-mcq a="2"><x-t>What prevents users from seeing half a course?</x-t><x-o>Faster generation</x-o><x-o>Caching</x-o><x-o>Drafts + a transactional publish step</x-o><x-o>Bigger models</x-o><x-why>Visibility changes atomically at the end.</x-why></x-mcq>
</x-quiz>

<h2 class="sec"><span class="k">15.A</span>Lessons</h2>
<x-lesson t="LangChain, LangGraph and Mastra compared" tag="should">
<x-def><b>LangChain</b>: a library (Python and JS) of building blocks for LLM apps: model wrappers, prompts, document loaders, splitters, retrievers, tools, agents. <b>LangGraph</b>: a library for building stateful, graph-shaped agent and workflow orchestration (nodes, edges, shared state, checkpointing, interrupts for human-in-the-loop). <b>Mastra</b>: a TypeScript framework with agents, tools, workflows (suspend/resume, storage), memory, RAG helpers, evals and tracing.</x-def>
<x-in><table><thead><tr><th></th><th>LangChain</th><th>LangGraph</th><th>Mastra</th><th>Hand-written</th></tr></thead><tbody>
<tr><td>Main idea</td><td>components + chains</td><td>state graph with checkpoints</td><td>agents + workflows in TS</td><td>your own loop and tables</td></tr>
<tr><td>Durable pause/resume</td><td>via LangGraph</td><td>checkpointer + interrupt</td><td>suspend/resume + storage</td><td>you build it</td></tr>
<tr><td>Best when</td><td>quick RAG prototypes, many integrations</td><td>complex cyclic agent flows</td><td>TypeScript backends needing workflows + agents</td><td>learning, small scope, full control</td></tr>
<tr><td>Cost</td><td>abstraction layers to learn and debug</td><td>graph concepts</td><td>fast-moving API</td><td>you maintain everything</td></tr></tbody></table>
<p><b>Implement orchestration yourself</b> when the flow is small (one tool loop, one queue), you need exact control (provider quirks like Gemini’s thoughtSignature), or you’re learning. <b>Use a framework</b> when you need durable state, recovery, approvals, tracing and many providers, and don’t want to maintain them.</p></x-in>
<x-dm>DocMind: agent loop hand-written; Mastra planned only for workflows; LangGraph is mentioned in topic 11 as concept material.</x-dm>
</x-lesson>

<x-lesson t="MCP, A2A and AG-UI" tag="good">
<x-def>Three open protocols that standardise different connections in an AI application: <b>MCP</b> (agent ↔ tools/data), <b>A2A</b> (agent ↔ agent), <b>AG-UI</b> (agent ↔ user interface).</x-def>
<x-vis><x-w w="flow" f="protocols"></x-w></x-vis>
<x-in><ul>
<li><b>MCP (Model Context Protocol)</b>, started by Anthropic: an MCP <b>server</b> exposes <b>tools</b> (functions the model can call), <b>resources</b> (readable data like files or records, addressed by URI) and <b>prompts</b> (reusable templates). An MCP <b>client</b> inside a host app (an IDE, a chat app, your agent) connects to servers, lists what they offer and calls them. Messages are JSON-RPC 2.0 over stdio (local) or Streamable HTTP (remote). Problem solved: write a connector once, use it from any MCP-capable app, instead of N×M custom integrations.</li>
<li><b>A2A (Agent2Agent)</b>, started by Google: agents publish an <b>agent card</b> (JSON describing skills, endpoint, auth); a client agent sends a <b>task</b> with messages; the remote agent works on it (possibly long-running, with status updates and streaming) and returns <b>artifacts</b>. Problem solved: agents from different vendors/frameworks collaborating without sharing internals. MCP = tools for one agent; A2A = peers delegating work.</li>
<li><b>AG-UI (Agent–User Interaction protocol)</b>, from CopilotKit: a stream of typed events from agent backend to frontend (run started/finished, text message start/content/end, tool call start/args/end, state snapshots and deltas, errors) over SSE or similar. Problem solved: any frontend can render any agent backend’s progress, tool calls and shared state.</li></ul>
<p><b>Together:</b> the UI talks AG-UI to your agent; your agent uses MCP servers for tools and data, and A2A to delegate to other agents.</p></x-in>
<x-dm>DocMind’s SSE protocol (meta, status, sources, action, text, done, error) is a small home-made version of the AG-UI idea.</x-dm>
</x-lesson>

<x-lesson t="Performance, reliability and cost techniques" tag="should">
<x-in><ul>
<li><b>Prompt chaining:</b> split a task into several LLM calls where each output feeds the next (outline → sections → polish). Easier to validate and debug than one giant prompt.</li>
<li><b>Context compression:</b> shrink what you send: summarise old history, trim tool results, extract only relevant sentences from chunks, deduplicate; keep a token budget.</li>
<li><b>Semantic caching:</b> embed the incoming prompt; if a previous prompt is similar above a strict threshold (and same user scope/document version), return the cached answer. Risky for personalised or time-sensitive answers; exact caches and provider prompt caching are safer first steps.</li>
<li><b>Guardrails:</b> checks before and after the model: input (length, PII, abuse, injection heuristics, topic scope) and output (schema, toxicity, grounding, no secrets, no HTML).</li>
<li><b>Model routing:</b> choose a model per request by task or difficulty (small model for classification/rewrites, large for hard generation). DocMind’s intent router is routing of a different kind (paths, not models).</li>
<li><b>Fallback routing:</b> an ordered list of models/providers tried on failure (with circuit breakers).</li>
<li><b>Evaluation frameworks:</b> datasets + metrics + runners (e.g. RAGAS-style metrics, promptfoo, framework evals) to compare versions before shipping.</li>
<li><b>Observability:</b> logs (events), metrics (numbers over time), traces (one request’s path as nested spans), plus AI-specific data: prompts, model, tokens, cost, tool calls, latency per step. OpenTelemetry with GenAI attributes, or LLM-tracing tools (Langfuse, LangSmith, Mastra’s tracing).</li></ul></x-in>
</x-lesson>

<h2 class="sec"><span class="k">15.1</span>AI orchestration</h2>
<x-q n="15.1" tag="should basic"><x-t>What is LangChain?</x-t><x-say>A popular open-source library for building LLM applications from components: models, prompts, document loaders, text splitters, retrievers, tools and agents, with many integrations.</x-say><x-ev>Awareness.</x-ev></x-q>
<x-q n="15.2" tag="should basic"><x-t>What is LangGraph?</x-t><x-say>A library from the LangChain team for orchestrating agents and workflows as graphs: nodes do work, edges (including conditional and cyclic ones) decide what runs next, a shared state flows through, and checkpointers persist it for resume and human-in-the-loop interrupts.</x-say><x-ev>Awareness.</x-ev></x-q>
<x-q n="15.3" tag="should solid"><x-t>How does LangChain differ from LangGraph?</x-t><x-say>LangChain gives the building blocks and simple linear chains; LangGraph gives control flow and state for complex, cyclic, long-running agent processes with persistence. They’re often used together.</x-say><x-ev>Distinction.</x-ev></x-q>
<x-q n="15.4" tag="should solid"><x-t>How does Mastra compare with these frameworks?</x-t><x-say>Mastra is TypeScript-first and bundles agents, tools, workflows with suspend/resume and Postgres storage, memory, RAG helpers, evals and tracing in one framework. LangGraph is closer to Mastra’s workflows; LangChain to its building blocks. For a Node backend, Mastra fits naturally.</x-say><x-ev>Comparison.</x-ev></x-q>
<x-q n="15.5" tag="should basic"><x-t>What is an orchestration framework?</x-t><x-say>Software that coordinates multi-step LLM work: calling models and tools in order or in loops, passing state, retrying, pausing and resuming, and tracing what happened.</x-say><x-ev>Definition.</x-ev></x-q>
<x-q n="15.6" tag="should solid"><x-t>When would you implement orchestration yourself?</x-t><x-say>When the flow is small and stable, when you need precise control over a provider’s protocol, when the framework would add more concepts than code it saves, or when learning. Move to a framework once you need durable state, recovery and approvals.</x-say><x-dm>DocMind’s loop is ~1 file and taught me the protocol (thoughtSignature, tools omitted on the last step).</x-dm><x-ev>Judgement.</x-ev></x-q>
<x-q n="15.7" tag="good basic"><x-t>What is a multi-agent system?</x-t><x-say>Several agents with different roles, tools or prompts cooperating on a task, coordinated by a supervisor agent, a workflow, or peer-to-peer messages.</x-say><x-ev>Awareness.</x-ev></x-q>
<x-q n="15.8" tag="good solid"><x-t>What are the challenges of multi-agent communication?</x-t><x-say>Lost or distorted context between agents, error propagation, loops between agents, cost and latency multiplying, unclear responsibility, harder debugging and evaluation, and security boundaries between agents’ permissions.</x-say><x-ev>Realism.</x-ev></x-q>

<h2 class="sec"><span class="k">15.2</span>MCP, A2A and AG-UI</h2>
<x-q n="15.9" tag="should basic"><x-t>What is MCP?</x-t><x-say>The Model Context Protocol: an open standard for connecting AI applications to tools and data sources through MCP servers, so any MCP client can use any server.</x-say><x-ev>Awareness.</x-ev></x-q>
<x-q n="15.10" tag="should basic"><x-t>What problem does MCP solve?</x-t><x-say>The N×M integration problem: without it, every AI app writes its own connector for every system. With it, a system exposes one MCP server and every compatible app can use it.</x-say><x-ev>Purpose.</x-ev></x-q>
<x-q n="15.11" tag="should solid"><x-t>What are MCP clients and servers?</x-t><x-say>A server exposes capabilities (tools, resources, prompts) over JSON-RPC via stdio or HTTP. A client lives in a host application, connects to servers, discovers their capabilities and invokes them on behalf of the model.</x-say><x-ev>Architecture.</x-ev></x-q>
<x-q n="15.12" tag="should solid"><x-t>What are MCP resources, tools and prompts?</x-t><x-say>Tools: functions the model can call (with input schemas). Resources: data the app can read, addressed by URI (files, records). Prompts: reusable prompt templates the user or app can select.</x-say><x-ev>Vocabulary.</x-ev></x-q>
<x-q n="15.13" tag="good basic"><x-t>What is A2A?</x-t><x-say>The Agent2Agent protocol: an open standard for agents to discover each other (agent cards), send tasks, exchange messages and receive results and status updates, across frameworks and vendors.</x-say><x-ev>Awareness.</x-ev></x-q>
<x-q n="15.14" tag="good basic"><x-t>What problem does A2A solve?</x-t><x-say>Interoperability between independently built agents: delegating work to another team’s or vendor’s agent without knowing its internals, including long-running tasks.</x-say><x-ev>Purpose.</x-ev></x-q>
<x-q n="15.15" tag="good solid"><x-t>How is A2A different from MCP?</x-t><x-say>MCP connects an agent to tools and data (the agent stays in charge). A2A connects agents to other agents as peers (the remote agent decides how to do the task).</x-say><x-ev>Distinction.</x-ev></x-q>
<x-q n="15.16" tag="good basic"><x-t>What is AG-UI?</x-t><x-say>The Agent–User Interaction protocol: a standard event stream between an agent backend and a frontend (text deltas, tool calls, state updates, run lifecycle).</x-say><x-ev>Awareness.</x-ev></x-q>
<x-q n="15.17" tag="good solid"><x-t>How does AG-UI connect an agent backend to a user interface?</x-t><x-say>The frontend starts a run; the backend streams typed events (run started, text message content, tool call start/args/end, state snapshot/delta, run finished or error) over SSE or similar; the UI renders them and can send user input back.</x-say><x-ev>Mechanism.</x-ev></x-q>
<x-q n="15.18" tag="good solid"><x-t>How do MCP, A2A and AG-UI fit into an AI application architecture?</x-t><x-say>User ↔ AG-UI ↔ your agent; your agent ↔ MCP ↔ tools and data; your agent ↔ A2A ↔ other agents. Three layers, three protocols.</x-say><x-ev>Big picture.</x-ev></x-q>

<h2 class="sec"><span class="k">15.3</span>AI performance and reliability</h2>
<x-q n="15.19" tag="should basic"><x-t>What is prompt chaining?</x-t><x-say>Breaking a task into several LLM calls in sequence, each with a focused prompt, where one call’s output feeds the next.</x-say><x-ev>Definition.</x-ev></x-q>
<x-q n="15.20" tag="should solid"><x-t>What is context compression?</x-t><x-say>Reducing the tokens sent while keeping what matters: summarising history, trimming tool results, extracting relevant sentences from retrieved chunks, deduplicating.</x-say><x-ev>Definition.</x-ev></x-q>
<x-q n="15.21" tag="good solid"><x-t>What is semantic caching?</x-t><x-say>Reusing a stored answer when a new request is semantically similar (embedding similarity above a threshold) to a previous one, scoped by user/tenant and data version.</x-say><x-fu q="Risk?">False hits: “refund for monthly plan” vs “refund for annual plan” may be very similar but need different answers. Use high thresholds, scope keys, TTLs, and only for non-personal FAQs.</x-fu><x-ev>Trade-offs.</x-ev></x-q>
<x-q n="15.22" tag="should basic"><x-t>What is an LLM guardrail?</x-t><x-say>A check around model input or output that blocks, rewrites or flags content: schema validation, PII filters, topic restrictions, injection detection, grounding checks.</x-say><x-ev>Definition.</x-ev></x-q>
<x-q n="15.23" tag="should basic"><x-t>What is model routing?</x-t><x-say>Choosing which model handles a request based on task type, difficulty, cost or latency targets.</x-say><x-ev>Definition.</x-ev></x-q>
<x-q n="15.24" tag="should basic"><x-t>What is fallback routing?</x-t><x-say>Sending a request to a backup model or provider when the primary fails or times out.</x-say><x-ev>Definition.</x-ev></x-q>
<x-q n="15.25" tag="should solid"><x-t>What is an LLM evaluation framework?</x-t><x-say>Tooling to run a fixed dataset through a model or pipeline and score outputs with metrics (exact match, judge scores, faithfulness, latency, cost), so versions can be compared and regressions caught.</x-say><x-ev>Definition.</x-ev></x-q>
<x-q n="15.26" tag="should basic"><x-t>What is observability in AI applications?</x-t><x-say>Being able to see what happened inside each request: logs, metrics and traces plus prompts, model versions, tokens, cost, tool calls and per-step latency, so you can debug quality and cost, not only errors.</x-say><x-ev>Definition.</x-ev></x-q>
<x-q n="15.27" tag="should basic"><x-t>What is the difference between logging and tracing?</x-t><x-say>Logs are individual events (“tool failed”). Traces connect all the work for one request across components into a tree of timed spans with a shared id, showing order and where time went.</x-say><x-ev>Distinction.</x-ev></x-q>
<x-q n="15.28" tag="should solid"><x-t>How would you monitor an agent’s execution?</x-t><x-say>A trace per run with a span per model call (model, tokens, latency, finish reason) and per tool call (name, args summary, duration, outcome); counters for steps per run, loop-limit hits, tool error rate; sampled transcripts for review.</x-say><x-ev>Practice.</x-ev></x-q>
<x-q n="15.29" tag="should solid"><x-t>How would you track token consumption across multiple agents?</x-t><x-say>Record usage on every model call tagged with run id, agent name, user and feature; roll up per run and per user; propagate a run/trace id through agents so totals add up; budget per run.</x-say><x-ev>Practice.</x-ev></x-q>
<x-q n="15.30" tag="should solid"><x-t>How would you measure end-to-end latency?</x-t><x-say>From request received to last byte sent (and time to first token for streams), as p50/p95/p99, broken down by stage spans (auth, retrieval, each model call, tools, DB writes); also measured from the client for real user experience.</x-say><x-ev>Practice.</x-ev></x-q>

<h2 class="sec"><span class="k">✓</span>Checkpoint</h2>
<x-quiz id="qz-p15">
<x-mcq a="1"><x-t>Agent ↔ tools and data uses…</x-t><x-o>A2A</x-o><x-o>MCP</x-o><x-o>AG-UI</x-o><x-o>REST only</x-o><x-why>MCP connects agents to capabilities.</x-why></x-mcq>
<x-mcq a="2"><x-t>Traces differ from logs because they…</x-t><x-o>are bigger</x-o><x-o>are only for errors</x-o><x-o>link all of one request’s work into timed spans</x-o><x-o>replace metrics</x-o><x-why>Order and timing across components.</x-why></x-mcq>
