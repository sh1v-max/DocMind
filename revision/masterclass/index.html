<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Backend Interview Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: an engineer's workbench. Fixed phase rail on the left, one lesson column on the right,
   amber marks what you are doing now, steel blue marks the system talking back. */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --panel-2:#eceee9; --ink:#1b2128; --muted:#5c6670; --line:#d5d9d3;
  --accent:#b86e00; --accent-ink:#ffffff; --accent-soft:#f6e7cf; --steel:#2f6690; --steel-soft:#dde9f2;
  --ok:#2d7a46; --ok-soft:#dcefe2; --warn:#a46b00; --warn-soft:#f8ecd2; --bad:#b03a2e; --bad-soft:#f6dedb;
  --code-bg:#1d232b; --code-ink:#dfe4ea;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:8px; --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --panel:#171e26; --panel-2:#1e2731; --ink:#e3e7ec; --muted:#93a0ad; --line:#2b3540;
    --accent:#f0a83a; --accent-ink:#1a1206; --accent-soft:#3a2c14; --steel:#7fb2dc; --steel-soft:#1d3346;
    --ok:#6cc58b; --ok-soft:#173326; --warn:#e9b44c; --warn-soft:#3a2e12; --bad:#ef7d70; --bad-soft:#3d1d1a;
    --code-bg:#0b0f14; --code-ink:#dfe4ea; --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --panel:#171e26; --panel-2:#1e2731; --ink:#e3e7ec; --muted:#93a0ad; --line:#2b3540;
  --accent:#f0a83a; --accent-ink:#1a1206; --accent-soft:#3a2c14; --steel:#7fb2dc; --steel-soft:#1d3346;
  --ok:#6cc58b; --ok-soft:#173326; --warn:#e9b44c; --warn-soft:#3a2e12; --bad:#ef7d70; --bad-soft:#3d1d1a;
  --code-bg:#0b0f14; --code-ink:#dfe4ea; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--steel)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
code,kbd,pre{font-family:var(--f-mono);font-size:.88em}
:not(pre)>code{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:0 .3em}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto 1fr;height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:17px;white-space:nowrap}
.brand-mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 13px var(--f-mono)}
.brand small{font:500 12px var(--f-body);color:var(--muted)}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;padding:7px 12px 7px 32px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.top .spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.icon-btn:hover{border-color:var(--accent)}
.menu-btn{display:none}

.side{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:10px 8px 40px}
.side .nav-top a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:14px}
.side .nav-top a:hover{background:var(--panel-2)}
.side .nav-top a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.stage{margin-top:14px}
.stage-h{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 10px}
.ph{border-radius:6px}
.ph-link{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:13.5px;line-height:1.3}
.ph-link:hover{background:var(--panel-2)}
.ph-link.on{background:var(--accent-soft);font-weight:600}
.ph-num{font:500 11px var(--f-mono);color:var(--muted)}
.ph-prog{width:34px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.ph-prog i{display:block;height:100%;background:var(--ok)}
.toc{margin:2px 0 6px 34px;border-left:1px solid var(--line);padding-left:8px;display:none}
.ph.open .toc{display:block}
.toc a{display:block;font-size:12.5px;color:var(--muted);text-decoration:none;padding:3px 4px;line-height:1.35}
.toc a:hover{color:var(--ink)}

.main{overflow-y:auto;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){.main{scroll-behavior:auto}}
.wrap{max-width:980px;margin:0 auto;padding:28px 24px 120px}
.prose{max-width:74ch}
.prose p,.prose li{margin:.5em 0}

/* ---------- phase header ---------- */
.phase-h{display:grid;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.eyebrow{font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.phase-h h1{font-size:34px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 12px var(--f-body);padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);white-space:nowrap}
.pill.must{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.pill.should{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.pill.good{border-color:var(--steel);color:var(--steel);background:var(--steel-soft)}
.pill.basic{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pill.solid{color:var(--steel);border-color:var(--steel);background:var(--steel-soft)}
.pill.bonus{color:var(--muted);border-style:dashed}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.box h4{font-size:15px;margin-bottom:6px}
.box ul{margin:4px 0;padding-left:18px}

h2.sec{font-size:24px;margin:38px 0 14px;padding-top:6px;display:flex;align-items:baseline;gap:10px}
h2.sec .k{font:600 12px var(--f-mono);color:var(--muted)}
h3.grp{font-size:18px;margin:26px 0 10px;color:var(--ink)}
.note{border-left:3px solid var(--steel);background:var(--steel-soft);padding:10px 14px;border-radius:0 6px 6px 0;margin:12px 0}
.warn{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 6px 6px 0;margin:12px 0}
.verify{border-left:3px solid var(--bad);background:var(--bad-soft);padding:10px 14px;border-radius:0 6px 6px 0;margin:12px 0}

/* ---------- lesson ---------- */
.lesson{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:18px 0;box-shadow:var(--shadow)}
.lesson>header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.lesson>header h3{font-size:20px;flex:1}
.lesson .body{padding:6px 18px 18px}
.lesson.closed .body{display:none}
.lesson.closed>header{border-bottom:0}
.lsec{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.lsec:last-child{border-bottom:0}
.lsec.wide{grid-template-columns:1fr;gap:6px}
.lsec>.lab{font:600 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-top:3px}
.lsec>.lab b{display:block;color:var(--accent);font-size:13px}
.lsec>.c{min-width:0}
.lsec>.c>:first-child{margin-top:0}
.chev{transition:transform .2s;color:var(--muted)}
.closed .chev{transform:rotate(-90deg)}
.done-tg{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--panel)}
.done-tg.on{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}

/* ---------- question card ---------- */
.qc{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:8px 0}
.qc>.qh{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 14px;cursor:pointer}
.qc .qn{font:600 12px var(--f-mono);color:var(--muted);padding-top:3px;min-width:44px}
.qc .qt{font-weight:600;line-height:1.4}
.qc .qtags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.qc .qb{display:none;padding:2px 16px 16px 68px}
.qc.open .qb{display:block}
.qc.open{border-color:var(--accent)}
.qc.is-done .qn{color:var(--ok)}
.star{border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 2px}
.star.on{color:var(--accent)}
.part{margin:10px 0}
.part>.pl{font:600 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:3px}
.part.say{background:var(--accent-soft);border-radius:6px;padding:10px 12px}
.part.say>.pl{color:var(--accent)}
.part.no{background:var(--bad-soft);border-radius:6px;padding:8px 12px}
.part.no>.pl{color:var(--bad)}
.part.fu{border-left:3px solid var(--steel);padding:4px 0 4px 12px}
.part.fu .fq{font-style:italic;color:var(--steel);font-weight:500}
.part.ev{color:var(--muted);font-size:14px}
.part.dm{border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--panel-2)}
.part.dm>.pl{color:var(--ok)}
.qactions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* scenario / exercise */
.card-x{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--steel);border-radius:8px;margin:14px 0;box-shadow:var(--shadow)}
.card-x.ex{border-left-color:var(--accent)}
.card-x>header{display:flex;gap:10px;align-items:center;padding:12px 16px;cursor:pointer}
.card-x>header h4{flex:1;font-size:17px}
.card-x .body{padding:0 16px 16px}
.card-x.closed .body{display:none}
.sq{margin:8px 0;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2)}
.sq .sqq{font-weight:600}
.reveal{border:1px dashed var(--line);border-radius:6px;margin:10px 0}
.reveal>button{width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--steel)}
.reveal>.rc{display:none;padding:0 12px 12px}
.reveal.open>.rc{display:block}

/* code */
pre{position:relative;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:14px 16px;overflow-x:auto;line-height:1.55;margin:10px 0;font-size:13px}
pre .copy{position:absolute;top:6px;right:6px;font:500 11px var(--f-body);background:#2b3540;color:#cfd6dd;border:0;border-radius:4px;padding:3px 8px;cursor:pointer;opacity:.75}
pre .copy:hover{opacity:1}
pre .lang{position:absolute;top:7px;right:60px;font:500 10px var(--f-mono);color:#7d8a96;text-transform:uppercase}
.hljs-keyword,.hljs-built_in,.hljs-literal{color:#f0a83a}
.hljs-string,.hljs-regexp{color:#9fd39b}
.hljs-number{color:#e6b673}
.hljs-comment{color:#7d8a96;font-style:italic}
.hljs-title,.hljs-title.function_{color:#7fb2dc}
.hljs-attr,.hljs-property{color:#c9a7e8}
.hljs-params{color:#dfe4ea}
.hljs-type,.hljs-class{color:#7fd1c7}
.hljs-meta{color:#7d8a96}
.hljs-variable.language_{color:#ef7d70}

table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
.tbl{overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--panel-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- widgets ---------- */
.wdg{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:16px 0;overflow:hidden;box-shadow:var(--shadow)}
.wdg>.wh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2);flex-wrap:wrap}
.wdg>.wh h4{font-size:15px;flex:1;min-width:200px}
.wdg>.wb{padding:14px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sel{background:var(--steel-soft);border-color:var(--steel)}
label.rng{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
label.rng input{accent-color:var(--accent)}
.out{font:13px/1.5 var(--f-mono);background:var(--code-bg);color:var(--code-ink);border-radius:6px;padding:10px 12px;white-space:pre-wrap;min-height:40px;max-height:320px;overflow:auto}
.stepnote{margin-top:12px;padding:10px 12px;background:var(--steel-soft);border-radius:6px;min-height:48px}
.stepnote b{color:var(--steel)}
.counter{font:500 12px var(--f-mono);color:var(--muted)}

/* flow player */
.flow svg{width:100%;height:auto;display:block}
.flow .fn rect{fill:var(--panel-2);stroke:var(--line);stroke-width:1.2;transition:fill .25s,stroke .25s}
.flow .fn text{fill:var(--ink);font:500 12px var(--f-body)}
.flow .fn text.s{fill:var(--muted);font-size:10px;font-family:var(--f-mono)}
.flow .fn.on rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.flow .fn.err rect{fill:var(--bad-soft);stroke:var(--bad);stroke-width:2}
.flow .fe{stroke:var(--line);stroke-width:1.5;fill:none}
.flow .fe.on{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 5;animation:dash .7s linear infinite}
.flow .fe.err{stroke:var(--bad)}
.flow .fel{fill:var(--muted);font:10px var(--f-mono)}
@keyframes dash{to{stroke-dashoffset:-11}}
@media (prefers-reduced-motion:reduce){.flow .fe.on{animation:none}}
.flow .payload{margin-top:8px}
.svgwrap{overflow-x:auto}

/* event loop */
.el-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
.el-code{font:13px/1.7 var(--f-mono);background:var(--code-bg);color:var(--code-ink);border-radius:6px;padding:8px 0;overflow-x:auto}
.el-code div{padding:0 12px;white-space:pre}
.el-code div.hl{background:rgba(240,168,58,.22);box-shadow:inset 3px 0 0 #f0a83a}
.el-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.el-col{border:1px solid var(--line);border-radius:6px;padding:6px;min-height:64px;background:var(--panel-2)}
.el-col h5{margin:0 0 4px;font:600 10.5px var(--f-mono);text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.el-chip{font:12px var(--f-mono);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 6px;margin:3px 0;animation:pop .25s ease}
.el-chip.hot{border-color:var(--accent);background:var(--accent-soft)}
@keyframes pop{from{transform:scale(.9);opacity:.3}}
@media (prefers-reduced-motion:reduce){.el-chip{animation:none}}
.phases{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.phases span{font:11px var(--f-mono);padding:3px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.phases span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* chunker */
.chunks{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.chunk{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13.5px;background:var(--panel-2)}
.chunk .ch{font:600 11px var(--f-mono);color:var(--muted);display:block;margin-bottom:2px}
.chunk mark{background:var(--accent-soft);color:inherit;border-bottom:2px solid var(--accent)}
.chunk .ov{background:var(--steel-soft);color:inherit}

/* bars */
.bars{display:grid;gap:4px;margin-top:8px}
.bar{display:grid;grid-template-columns:110px 1fr 64px;gap:8px;align-items:center;font:12.5px var(--f-mono)}
.bar .t{height:16px;background:var(--panel-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.bar .t i{display:block;height:100%;background:var(--steel);transition:width .3s}
.bar.in .t i{background:var(--accent)}
.bar.out-n{opacity:.45}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}

/* timeline lanes */
.lanes{position:relative;margin-top:10px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);overflow:hidden}
.lane{height:24px;border-bottom:1px solid var(--line);position:relative}
.lane:last-child{border-bottom:0}
.lane .lab{position:absolute;left:6px;top:4px;font:11px var(--f-mono);color:var(--muted)}
.task{position:absolute;top:3px;height:17px;border-radius:3px;font:10.5px/17px var(--f-mono);padding:0 4px;color:#fff;overflow:hidden;white-space:nowrap}
.task.ok{background:var(--ok)} .task.fail{background:var(--bad)} .task.run{background:var(--accent);color:var(--accent-ink)} .task.wait{background:transparent;border:1px dashed var(--muted);color:var(--muted)}

/* workflow sim */
.wf-steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.wf-step{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12.5px;background:var(--panel-2);min-width:90px;text-align:center}
.wf-step small{display:block;font:10.5px var(--f-mono);color:var(--muted)}
.wf-step.running{border-color:var(--accent);background:var(--accent-soft)}
.wf-step.success{border-color:var(--ok);background:var(--ok-soft)}
.wf-step.failed{border-color:var(--bad);background:var(--bad-soft)}
.wf-step.suspended{border-color:var(--steel);background:var(--steel-soft)}
.wf-arrow{color:var(--muted)}
.wf-panels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.status-chip{font:600 12px var(--f-mono);padding:2px 8px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line)}
.status-chip.running{color:var(--accent);border-color:var(--accent)}
.status-chip.suspended{color:var(--steel);border-color:var(--steel)}
.status-chip.success{color:var(--ok);border-color:var(--ok)}
.status-chip.failed{color:var(--bad);border-color:var(--bad)}
.status-chip.down{color:var(--bad);border-color:var(--bad)}

/* quizzes */
.mcq{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;background:var(--panel)}
.mcq .mt{font-weight:600;margin-bottom:6px}
.mcq label{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:5px;cursor:pointer}
.mcq label:hover{background:var(--panel-2)}
.mcq label.right{background:var(--ok-soft)}
.mcq label.wrong{background:var(--bad-soft)}

<template id="tpl-p01">
<x-obj><ul><li>Give a 90-second introduction that ends on DocMind, not on your degree.</li><li>Explain a two-year gap honestly, with evidence, without apologising.</li><li>Answer “weakness”, “why you” and “why AI backend” with real examples.</li><li>Handle uncomfortable follow-ups without getting defensive.</li></ul></x-obj>
<x-pre><ul><li>Nothing technical. Have your project list open: DocMind, TaskForge, Cinegraph, BiteSwift, BookVerse, portfolio.</li><li>Know your real numbers (GitHub streak, DSA days, DocMind phases built). Never round them up.</li></ul></x-pre>

<h2 class="sec"><span class="k">1.0</span>How the first five minutes work</h2>
<div class="prose">
<p>The first block of a 90-minute interview (0–5 min) looks like small talk. It isn’t. The interviewer is deciding three things: <b>can you communicate clearly</b>, <b>are you honest about where you are</b>, and <b>what should I dig into for the next 85 minutes</b>. Whatever you mention in your introduction becomes the map for the rest of the interview. Mention DocMind’s agent loop and you will be asked about it; mention “I know Kubernetes” and you will be asked about that too.</p>
</div>
<div class="note"><b>What the interviewer is evaluating in this part (from the bank):</b> honesty, communication, ownership, consistency, motivation, and the ability to explain the employment gap without making excuses.</div>

<x-lesson t="Introducing yourself: the 90-second story" tag="must">
<x-def>A self-introduction is a short spoken summary that answers “who are you, what can you do, and why are you here”. Think of it as the README of you: what it is, what it does, how to run it, where it’s going.</x-def>
<x-why>Without a planned introduction, people either recite their CV in date order (boring, and it buries the strongest part at the end) or ramble. A structured one lets you choose what the interviewer asks next.</x-why>
<x-in><p>Use four beats, about 20 seconds each:</p><ol><li><b>Present:</b> what you are now. “I’m a backend-focused developer building AI applications in Node.js.”</li><li><b>Past (short):</b> how you got here. Degree, then two years of structured self-learning with shipped projects.</li><li><b>Proof:</b> one project in some depth, with one technical decision and one number.</li><li><b>Future:</b> why this role, connected to what you just proved.</li></ol></x-in>
<x-an>A good trailer shows the best scene and stops. It doesn’t play the whole film from minute one.</x-an>
<x-real>Every interview, every recruiter call, every networking message. The 30-second version opens LinkedIn DMs; the 90-second version opens interviews.</x-real>
<x-impl><p><b>A version built from your real facts (edit the words, keep the shape):</b></p>
<div class="part say"><div class="pl">Sample · about 90 seconds</div>“I’m Shiv. I’m a backend developer working mostly in Node.js and Express, and for the last few months I’ve focused on AI backends. I finished my B.Tech in computer science from LPU in 2024. Since then I’ve been learning full time in a structured way: I’ve shipped several full-stack projects, kept a GitHub streak of over 300 days, and practised DSA for over 100 days.<br><br>The project that best shows where I am now is DocMind. You upload a PDF and chat with it. Uploads go through a BullMQ queue so the API answers in about two seconds while a worker embeds the chunks into Postgres with pgvector. Chat goes through an intent router and then a small agent loop I wrote myself on the Gemini REST API, with two tools, searchDocuments and listDocuments, and every query is scoped to the user from the JWT. Answers stream over server-sent events.<br><br>I’m applying for this role because that’s exactly the work I enjoy: making LLM features reliable, with queues, validation, and proper user isolation around them. I’d like to do it with a team that reviews my code.”</div>
<p>Notice what it does: it gives the interviewer five things to pick from (BullMQ, pgvector, router, agent loop, user isolation), and you can defend every one of them.</p></x-impl>
<x-walk><p><b>How the interviewer uses it:</b></p><ol><li>They hear “agent loop I wrote myself” → likely question: “Why not use a framework?”</li><li>They hear “scoped to the user from the JWT” → “What happens if I change the document id in the request?”</li><li>They hear “about two seconds” → they now trust you know your numbers.</li></ol></x-walk>
<x-mist><ul><li>Starting with school marks and hobbies.</li><li>Listing 15 technologies. Each one is an invitation to be quizzed.</li><li>Memorised delivery that sounds read. Learn the four beats, not the sentences.</li><li>Claiming “production experience” for personal projects. Say “deployed and live”, which is true and still strong.</li></ul></x-mist>
</x-lesson>

<x-lesson t="Explaining an employment gap without making excuses" tag="must">
<x-def>A gap answer explains what you did between graduation and now, why, and what evidence shows it was productive.</x-def>
<x-why>A two-year gap makes interviewers wonder: was this person stuck, unmotivated, or unable to pass interviews? Silence or vagueness confirms the worry. A specific, honest answer replaces it with evidence.</x-why>
<x-in><p>Formula: <b>fact → choice → evidence → what changed → now</b>.</p><ul><li><b>Fact:</b> “I graduated in 2024 and I haven’t had a full-time developer job yet.” Say it plainly; don’t make them dig.</li><li><b>Choice:</b> what you decided to do with the time.</li><li><b>Evidence:</b> things they can check: GitHub history, live projects, commit messages, write-ups.</li><li><b>What changed:</b> what you can do now that you couldn’t then.</li><li><b>Now:</b> why you want a team, not more solo work.</li></ul></x-in>
<x-an>A gap in a CV is like a long gap in a Git history. A messy history with real commits is fine; an empty one raises questions. Show the commits.</x-an>
<x-impl><div class="part say"><div class="pl">Strong answer</div>“I graduated in 2024. I applied to some roles then but my skills weren’t strong enough yet, so I decided to learn properly instead of taking anything. I set a structure: build real projects end to end, deploy them, and keep a daily habit. My GitHub has a 300-plus day streak, and the projects are live. This year I moved into AI backends with DocMind, where I built the queue, the vector search, auth and an agent loop step by step and wrote down what broke. What I’m missing is working in a team, with code review and real users, and that’s why I’m applying now.”</div>
<div class="part no"><div class="pl">Weak answers</div>“The market was bad.” (blames the world) · “I was preparing for government exams and also learning” (unclear focus, unless true, then say it plainly) · “I was freelancing” (if you can’t name a client, don’t say it) · a long story that never reaches “now”.</div></x-impl>
<x-mist><ul><li>Apologising repeatedly. One honest sentence is enough.</li><li>Overclaiming: calling side projects “industry experience”.</li><li>Inventing freelance work. It falls apart on the first follow-up.</li></ul></x-mist>
</x-lesson>

<x-lesson t="Projects, strengths and weaknesses: the evidence rule" tag="must">
<x-def>Every claim you make about yourself should come with a piece of evidence: a project, a decision, a bug, a number.</x-def>
<x-why>“I’m a fast learner” is said by everyone and believed by no one. “I learned MySQL and Rails in one day for a walk-in interview and could answer their joins questions” is believed.</x-why>
<x-in><p>Use STAR for stories (Situation, Task, Action, Result), but keep the Action technical and the Result measurable. For weaknesses: name a real one, show what you do about it, and show progress.</p></x-in>
<x-impl><table><thead><tr><th>Claim</th><th>Evidence from your own work</th></tr></thead><tbody>
<tr><td>I debug systematically</td><td>DocMind rate limiter: measured the proxy hop count on Render with the RateLimit-Policy header instead of guessing; 1 and 2 were wrong, 3 was right.</td></tr>
<tr><td>I care about security</td><td>Every repository function takes a required userId, so forgetting it is a compile error. Someone else’s document returns 404, not 403.</td></tr>
<tr><td>I measure before I optimise</td><td>Measured BullMQ’s idle Redis usage: defaults would use ~204% of the Upstash free limit; tuned settings ~33%.</td></tr>
<tr><td>I learn fast under pressure</td><td>Learned MySQL and Ruby on Rails basics in one session before a walk-in interview.</td></tr>
</tbody></table></x-impl>
<x-mist><ul><li>Weakness = disguised strength (“I work too hard”). Interviewers have heard it a thousand times.</li><li>A weakness that disqualifies you for the role (“I don’t like debugging”).</li></ul></x-mist>
</x-lesson>

<h2 class="sec"><span class="k">1.1</span>Personal introduction</h2>

<x-q n="1.1" tag="must basic"><x-t>Tell me about yourself.</x-t>
<x-say>Use the four beats: present role, short past, one project in depth with a number, why this role. Keep it under 90 seconds and end on the project you most want to be asked about.</x-say>
<x-simple><p>This is not a request for your life story. It is “give me the summary and a hook”. Use the sample in the lesson above. Practise it out loud until you can say it in your own words with a different opening each time.</p></x-simple>
<x-fu q="You mentioned an agent loop. Walk me through one request.">Message arrives → embedded once → router decides it’s a document question → the agent sends the conversation and two tool schemas to Gemini → Gemini answers with a function call to searchDocuments with a query it wrote → my code validates the args with Zod, runs a pgvector search scoped to the user, sends the chunks back → Gemini writes the answer, streamed over SSE. Max three model calls; the last one has no tools so it must answer.</x-fu>
<x-no>Reading your CV aloud in date order. Starting with “So basically I am from…”. Ending with “that’s it”.</x-no>
<x-ev>Clarity, structure, and whether you can choose what matters.</x-ev>
</x-q>

<x-q n="1.2" tag="must basic"><x-t>Walk me through your development journey.</x-t>
<x-say>Three stages with a lesson each: college basics; full-stack projects after graduation (TaskForge, Cinegraph, BiteSwift); then AI backends with DocMind. Each stage ends with what you could do that you couldn’t before.</x-say>
<x-simple><p>Make it a progression, not a list. Example: “In college I learned the basics and built small apps. After 2024 I built full-stack projects and learned to deploy, test and secure them (TaskForge has JWT, Zod, Swagger and CI). Then I added AI: Cinegraph calls Gemini through a Cloudflare Worker so the key never reaches the browser. This year I went deep into the backend side of AI with DocMind: embeddings, pgvector, RAG, streaming, queues and agents, one step at a time.”</p></x-simple>
<x-fu q="What was the hardest jump?">Going from “call an API and show the text” to “make it reliable”: queues, retries, idempotent jobs, rate limits, structured output with validation. The model call is the easy 10%.</x-fu>
<x-no>“I learned HTML, then CSS, then JavaScript…” (too granular).</x-no>
<x-ev>Whether your growth has direction and whether you reflect on it.</x-ev>
</x-q>

<x-q n="1.3" tag="should basic"><x-t>Why did you choose software development?</x-t>
<x-say>Give a short, true reason and connect it to something you still enjoy today, such as making a system work end to end and seeing real people use it.</x-say>
<x-simple><p>The interviewer wants genuine motivation, not passion speeches. Example: “I like that you can build something, deploy it, and other people can use it the same day. What keeps me here is debugging: finding out why something actually fails, like a stream that showed nothing because Gemini ends lines with \r\n.”</p></x-simple>
<x-no>“Because IT has good salary.” (Maybe true, but it doesn’t predict you’ll stick with hard problems.)</x-no>
<x-ev>Motivation that will survive boring weeks.</x-ev>
</x-q>

<x-q n="1.4" tag="must basic"><x-t>Why are you interested in AI backend development?</x-t>
<x-say>Because the hard part of AI products is the backend around the model: retrieval, validation, queues, cost, security. That’s where my backend skills matter, and DocMind showed me I enjoy exactly that.</x-say>
<x-simple><p>Show you understand what the job really is. An AI backend developer mostly writes normal backend code: APIs, databases, jobs, auth. The new parts are LLM calls (unreliable, slow, priced per token), embeddings and vector search, structured output, agents and workflows. Mention one specific thing you found interesting, e.g. “the model only proposes a tool call; my code decides whether to run it”.</p></x-simple>
<x-fu q="Isn’t AI going to replace backend developers?">It changes what we write. Someone still has to design the data model, enforce permissions, handle failures and costs, and verify generated code. That’s the part I want to be good at.</x-fu>
<x-no>“AI is the future” with nothing specific after it.</x-no>
<x-ev>Whether you know what the work actually involves.</x-ev>
</x-q>

<x-q n="1.5" tag="should basic"><x-t>What made you transition from traditional backend development towards AI?</x-t>
<x-say>I already built REST APIs with auth and databases. Adding Gemini to Cinegraph showed me how much backend work an AI feature needs, so I built DocMind to learn that work properly.</x-say>
<x-simple><p>A transition story should show continuity: AI backends reuse everything you already know (Express, validation, Postgres, JWT) and add new problems. Say what was new: embeddings, retrieval quality, streaming, non-deterministic outputs that must be validated, per-token cost and rate limits.</p></x-simple>
<x-no>Pretending you abandoned backend work. You didn’t: AI backend is backend.</x-no>
<x-ev>Coherent career logic.</x-ev>
</x-q>

<x-q n="1.6" tag="must basic"><x-t>What technologies are you most comfortable working with?</x-t>
<x-say>Node.js, Express, JavaScript/TypeScript, PostgreSQL with Drizzle and pgvector, MongoDB, Zod, JWT auth, React on the frontend. For AI: Gemini’s REST API, embeddings, RAG, SSE streaming, BullMQ.</x-say>
<x-simple><p>Group them by confidence, and be ready to be tested on every item. A good structure: “strong” (use daily), “working knowledge” (built one thing with it), “learning”. Honest labels are a strength: an interviewer who finds one exaggeration will doubt everything else.</p></x-simple>
<x-fu q="You said TypeScript is working knowledge. What does that mean?">DocMind’s backend is strict TypeScript and I use types to catch mistakes (a required userId parameter turned 15 call sites into compile errors). I’m less fluent with advanced generics and declaration files.</x-fu>
<x-no>A list of 25 tools with equal weight.</x-no>
<x-ev>Self-awareness and honesty.</x-ev>
</x-q>

<x-q n="1.7" tag="must solid"><x-t>What is the most technically challenging project you’ve built?</x-t>
<x-say>DocMind. The challenge wasn’t calling an LLM, it was making uploads, retrieval and chat reliable and isolated per user: a queue with idempotent jobs, pgvector search scoped by owner, and an agent loop that can’t run forever.</x-say>
<x-simple><p>Pick one hard problem and tell it as a story. Good candidates from DocMind:</p><ul><li><b>Background ingestion:</b> moving embedding out of the request into BullMQ; making the job idempotent (delete chunks, re-insert all) so a retry never duplicates; handling “user deleted the document while the job ran”.</li><li><b>Agent loop:</b> Gemini requires every model turn to be sent back with its thoughtSignature byte for byte; leaving it out gave a 400.</li><li><b>Rate limiting behind proxies:</b> measuring the right trust-proxy hop count on Render.</li></ul></x-simple>
<x-fu q="What would you do differently?">Add automated tests from day one (there are none yet), use real migrations instead of hand-run SQL, and add timeouts + retries on every Gemini call.</x-fu>
<x-no>Choosing a project you can’t explain line by line.</x-no>
<x-ev>Depth, ownership and honest reflection.</x-ev>
</x-q>

<x-q n="1.8" tag="must basic"><x-t>Which project best represents your current technical abilities?</x-t>
<x-say>DocMind, because it covers the whole backend: auth, Postgres, vector search, queues, streaming, structured output and agents, all deployed and live.</x-say>
<x-simple><p>Give the scope in one breath, then offer a tour: “Happy to walk you through the architecture or any one piece.” Mention that it’s live (Render + Vercel) and that the commit history shows each step.</p></x-simple>
<x-ev>Whether your best work matches the role.</x-ev>
</x-q>

<x-q n="1.9" tag="should solid"><x-t>What have you learned recently that genuinely changed how you approach development?</x-t>
<x-say>That the model is an untrusted client. Its output, tool arguments and JSON all go through the same validation as a user request. That changed how I design every AI feature.</x-say>
<x-simple><p>Other true options from DocMind: “measure, don’t guess” (trust-proxy hops, Redis command counts); “make background jobs idempotent first, then add retries”; “authorization belongs in the query, not in the UI”. Pick one and give the concrete moment you learned it.</p></x-simple>
<x-ev>Reflection and the ability to learn from your own mistakes.</x-ev>
</x-q>

<x-q n="1.10" tag="should basic"><x-t>Where do you see yourself in the next two years?</x-t>
<x-say>Being a dependable engineer on an AI product team: owning features end to end (API, data, LLM integration, monitoring), and getting good at evaluation and production reliability.</x-say>
<x-simple><p>Show ambition that fits the role and the company. Avoid “I want to start my own company” or “I want to be a manager”. Mentioning specific skills (evaluation, observability, system design) shows you know the path.</p></x-simple>
<x-ev>Fit and whether you’ll stay.</x-ev>
</x-q>

<h2 class="sec"><span class="k">1.2</span>Employment gap questions</h2>

<x-q n="1.11" tag="must basic"><x-t>You graduated in 2024. What have you been doing since graduation?</x-t>
<x-say>Structured, full-time self-learning with shipped projects: full-stack apps first, then AI backends with DocMind. My GitHub history shows it day by day.</x-say>
<x-simple><p>Use the gap formula from the lesson. Give one or two things they can check (a live link, the commit history). Don’t over-explain.</p></x-simple>
<x-fu q="Why not take any job and learn on the side?">Fair question. I applied, but I wasn’t ready for the roles I wanted, and I chose to close the gap properly. Now I want the team environment I can’t get on my own.</x-fu>
<x-no>Vague answers like “learning various technologies”.</x-no>
<x-ev>Honesty and whether the time was productive.</x-ev>
</x-q>

<x-q n="1.12" tag="must solid"><x-t>Why haven’t you secured a developer position yet?</x-t>
<x-say>Earlier my skills weren’t strong enough for the roles I wanted, and I didn’t interview well. I’ve worked on both: real projects, and practising explaining them. I’m in a much better position now.</x-say>
<x-simple><p>This question tests whether you blame others. Take ownership of what was in your control. You can mention the market briefly as context, never as the main reason.</p></x-simple>
<x-no>“Companies don’t hire freshers.” “The market is bad.” “HR rejected me for my CGPA.”</x-no>
<x-ev>Ownership versus excuses.</x-ev>
</x-q>

<x-q n="1.13" tag="must basic"><x-t>Have you been working on personal projects throughout this period?</x-t>
<x-say>Yes: TaskForge, Cinegraph, BiteSwift, BookVerse, my portfolio, and DocMind. All deployed. The GitHub streak is over 300 days.</x-say>
<x-simple><p>Name them, and offer the one most relevant to the role. If asked about quality, be honest about caveats (for example, if a project lacks tests, say so before they find it).</p></x-simple>
<x-ev>Consistency.</x-ev>
</x-q>

<x-q n="1.14" tag="should solid"><x-t>How do you ensure that your learning translates into actual development skills?</x-t>
<x-say>For every concept I build the smallest working version, deploy it, break it on purpose, and write down what I learned. DocMind was built that way, phase by phase.</x-say>
<x-simple><p>Show a loop: learn → build → test against reality → write notes. Evidence: DocMind’s plan files with results logs; learning scripts that measure things (e.g. Redis command usage of an idle worker); notes per topic.</p></x-simple>
<x-ev>Whether you can tell tutorials from skill.</x-ev>
</x-q>

<x-q n="1.15" tag="should basic"><x-t>Have you contributed to any open-source projects?</x-t>
<x-say>Not yet in a meaningful way, honestly. My public work is my own repositories. Contributing is something I want to do, starting with documentation and small bug fixes in libraries I use.</x-say>
<x-simple><p>If the answer is no, say no. Then show you understand how: read CONTRIBUTING.md, start with good-first-issue labels, reproduce the bug, small PR with a test. If you have any PR or issue you opened, mention it.</p></x-simple>
<x-no>Calling your own public repo “open-source contribution”.</x-no>
<x-ev>Honesty.</x-ev>
</x-q>

<x-q n="1.16" tag="should basic"><x-t>Have you worked with other developers?</x-t>
<x-say>Mostly in college team projects. My recent work is solo, which is the main thing I want to change: I want code reviews and shared ownership.</x-say>
<x-simple><p>Show you already use team habits alone: Git branches and PRs (DocMind’s auth went through a PR), written plans before building, clear commit messages, docs other people could follow.</p></x-simple>
<x-ev>Collaboration readiness.</x-ev>
</x-q>

<x-q n="1.17" tag="should basic"><x-t>How do you approach deadlines when working independently?</x-t>
<x-say>I break work into small steps that each end with something running, estimate them, and cut scope before I cut quality. I set myself a real deadline for DocMind and planned phases around it.</x-say>
<x-simple><p>Concrete habits: a written plan with steps; a “done” definition per step (works locally, tested, deployed); tracking what’s left; telling stakeholders early when something slips.</p></x-simple>
<x-ev>Planning and reliability.</x-ev>
</x-q>

<x-q n="1.18" tag="must solid"><x-t>What would you say is the biggest weakness in your technical abilities right now?</x-t>
<x-say>Automated testing. DocMind has none yet; I test by hand against the real stack. I’m fixing that next with unit tests for the services and integration tests for the routes.</x-say>
<x-simple><p>A good weakness is real, relevant but not disqualifying, and has a plan. Other honest options: no production on-call experience; limited experience with cloud infrastructure (AWS, Docker beyond basics); no experience working in a large codebase.</p></x-simple>
<x-no>“I’m a perfectionist.” “I don’t have weaknesses.”</x-no>
<x-ev>Self-awareness.</x-ev>
</x-q>

<x-q n="1.19" tag="must solid"><x-t>Why should we hire you over someone with six months of professional experience?</x-t>
<x-say>They have team experience I don’t. I bring depth in exactly this stack: I built and deployed a full AI backend myself and can explain every decision in it. I learn fast and I’m cheaper to grow than to hire senior.</x-say>
<x-simple><p>Don’t attack the other candidate. Acknowledge their advantage, then show your specific edge with evidence, and invite them to test it: “Ask me anything about DocMind.”</p></x-simple>
<x-ev>Confidence without arrogance.</x-ev>
</x-q>

<x-q n="1.20" tag="should basic"><x-t>Are you comfortable joining as a fresher despite having spent two years developing independently?</x-t>

<x-simple><p>They are checking expectations (salary, title, ego). Be clear and calm.</p></x-simple>
<x-ev>Realistic expectations.</x-ev>
</x-q>

<div class="two">
<div class="box"><h4>Weak</h4><p><b>Q:</b> What have you been doing since 2024?</p><p><b>A:</b> Actually market was very bad, so I was learning many things like React, Node, AI, DSA. Also I made some projects.</p><p><b>Q:</b> Which projects?</p><p><b>A:</b> Many projects, like a chat with PDF using LangChain and Pinecone…</p><p><b>Q:</b> How does Pinecone index the vectors?</p><p><b>A:</b> …</p><p class="counter">Blames the market, vague, names tools that weren’t used, collapses at the first follow-up.</p></div>
<div class="box"><h4>Strong</h4><p><b>Q:</b> What have you been doing since 2024?</p><p><b>A:</b> Learning full time with a structure. I shipped a few full-stack apps, then this year built DocMind, an AI document chat backend.</p><p><b>Q:</b> What’s in it?</p><p><b>A:</b> Postgres with pgvector, a BullMQ queue for embedding, JWT auth with per-user scoping, and an agent loop with two tools. It’s live.</p><p><b>Q:</b> Why pgvector and not a vector database?</p><p><b>A:</b> I already needed Postgres for users and chats, so vectors in the same database meant one system and joins for ownership. At my scale that’s plenty; at many millions of vectors I’d look at an index or a dedicated store.</p><p class="counter">Specific, honest, every claim survives a follow-up.</p></div>
</div>

<h2 class="sec"><span class="k">1.4</span>Handling uncomfortable questions</h2>
<div class="prose">
<ul>
<li><b>“Your CGPA is low.”</b> Agree briefly, don’t argue: “It’s 7.01. My projects are a better measure of what I can do now. Happy to go through one.”</li>
<li><b>“This looks like a tutorial project.”</b> Show the parts no tutorial has: “The idempotent job, the guest-to-user upgrade that keeps files, the measured trust-proxy setting.”</li>
