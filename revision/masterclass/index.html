<h2 class="sec"><span class="k">3.A</span>Node.js under the hood</h2>

<x-lesson t="Node.js architecture: V8, libuv and non-blocking I/O" tag="must">
<x-def>Node.js is a runtime that runs JavaScript outside the browser. It combines the V8 engine (compiles and runs JS) with libuv (event loop, async I/O, thread pool) and a standard library (http, fs, crypto, streams).</x-def>
<x-why>Classic servers used one thread per connection. Threads cost memory and context switches, and most of their time is spent waiting on I/O. Node’s bet: one thread runs your code, the OS waits on sockets for you, and callbacks fire when data is ready. That makes I/O-heavy servers (APIs, chat, proxies, LLM gateways that mostly wait) cheap to run.</x-why>
<x-in><ol><li>Your code calls <code>db.query()</code>. Node sends bytes on a socket and registers interest in the reply with the OS (epoll/kqueue/IOCP). It returns immediately with a pending promise.</li><li>The thread runs other callbacks (other requests).</li><li>The reply arrives; in the poll phase libuv sees the socket is readable and queues the callback; the promise resolves; your <code>await</code> continues as a microtask.</li><li>File system calls, DNS lookups, crypto (pbkdf2, scrypt) and zlib run on libuv’s thread pool (default 4 threads) because many OSes don’t offer good async file APIs.</li></ol></x-in>
<x-vis><x-w w="flow" f="queue"></x-w></x-vis>
<x-an>A restaurant with one very fast waiter and a kitchen full of cooks. The waiter never stands at the stove; they take orders and deliver plates when the bell rings.</x-an>
<x-real>An LLM chat endpoint spends ~99% of its time waiting for the provider. One Node process can hold hundreds of such requests open, as long as none of them does heavy CPU work on the main thread.</x-real>
<x-mist><ul><li>“Node is single-threaded.” JS execution is; the process isn’t.</li><li>Using sync APIs (<code>fs.readFileSync</code>, <code>bcrypt.hashSync</code>) inside request handlers.</li></ul></x-mist>
</x-lesson>

<x-lesson t="Streams and buffers" tag="must">
<x-def>A <b>Buffer</b> is a fixed-size chunk of raw bytes. A <b>stream</b> is data that arrives or leaves piece by piece, so you can process it without holding all of it in memory.</x-def>
<x-why>Reading a 2 GB file with <code>readFile</code> needs 2 GB of RAM (Render free has 512 MB). A stream reads ~64 KB at a time. Streams also let you start sending a response before it’s finished, which is exactly how LLM token streaming works.</x-why>
<x-in><ul><li><b>Readable</b> (fs.createReadStream, an HTTP request body), <b>Writable</b> (fs.createWriteStream, an HTTP response), <b>Duplex</b> (both, e.g. a TCP socket), <b>Transform</b> (a duplex that changes data, e.g. gzip).</li><li><b>Backpressure:</b> when the writer is slower than the reader, <code>write()</code> returns false; a correct pipeline pauses reading until the <code>drain</code> event. <code>stream.pipeline()</code> does this and handles errors and cleanup.</li></ul>
<pre data-l="js">import { createReadStream, createWriteStream } from 'node:fs';
import { createGzip } from 'node:zlib';
import { pipeline } from 'node:stream/promises';
import readline from 'node:readline';

// compress a huge file with constant memory
await pipeline(createReadStream('big.log'), createGzip(), createWriteStream('big.log.gz'));

// count lines of a 5 GB CSV without loading it
let n = 0;
const rl = readline.createInterface({ input: createReadStream('huge.csv'), crlfDelay: Infinity });
for await (const line of rl) n++;</pre></x-in>
<x-real>Uploads: stream the multipart body straight to object storage instead of buffering it. LLM responses: read <code>res.body</code> chunk by chunk with <code>getReader()</code> and forward each piece to the client as an SSE event.</x-real>
<x-dm><p>DocMind uses multer’s <b>memory storage</b> (the whole PDF in RAM) with a 10 MB cap, because pdf-parse needs the full bytes. Streaming to disk/storage would be the next step for big files. Gemini’s stream is read with <code>getReader()</code> + <code>TextDecoder</code>, normalising <code>\r\n</code> to <code>\n</code> on the whole buffer (a <code>\r\n</code> split across two reads was a real bug).</p></x-dm>
<x-mist><ul><li><code>a.pipe(b)</code> without error handling: an error on one side leaks the other. Use <code>pipeline</code>.</li><li>Decoding each chunk separately with <code>chunk.toString()</code>: a multi-byte UTF-8 character split across chunks becomes garbage. Use <code>TextDecoder</code> with <code>{ stream: true }</code> or <code>setEncoding('utf8')</code>.</li></ul></x-mist>
</x-lesson>

<h2 class="sec"><span class="k">3.B</span>Express and the mini application</h2>

<x-lesson t="The Express request-response lifecycle" tag="must">
<x-def>Express is a thin layer over Node’s http module: it gives you routing and a middleware pipeline. Every request walks through middleware functions in registration order until one sends a response.</x-def>
<x-in><p>A middleware is <code>(req, res, next) => {}</code>. It can read/modify <code>req</code> and <code>res</code>, end the request (<code>res.json()</code>), call <code>next()</code> to continue, or call <code>next(err)</code> to jump to error handlers. Error handlers have four parameters <code>(err, req, res, next)</code>. In Express 5, a rejected promise from an async handler is forwarded to <code>next(err)</code> automatically.</p></x-in>
<x-vis><x-w w="flow" f="http"></x-w></x-vis>
<x-an>An airport: check-in (parse), security (auth), passport control (validation), gate (handler). Fail at security and you never reach the gate; you’re sent to the help desk (error handler).</x-an>
<x-mist><ul><li>Registering <code>express.json()</code> after the routes that need it: <code>req.body</code> is undefined.</li><li>Calling <code>next()</code> after sending a response: “Cannot set headers after they are sent”.</li><li>Putting <code>requireAuth</code> before <code>cors()</code>: the browser’s preflight has no token and fails.</li></ul></x-mist>
</x-lesson>

<x-lesson t="Build it: a complete mini Express API" tag="must">
<x-def>A small documents API that shows every pattern interviewers ask about, in one file you can run. Node 20+, ES modules, Express 5, Zod 4, pg, jsonwebtoken, bcrypt.</x-def>
<x-impl><pre data-l="bash">npm i express@5 cors helmet express-rate-limit jsonwebtoken bcrypt pg zod
# package.json: "type": "module"   ·   env: DATABASE_URL, JWT_SECRET, FRONTEND_URL</pre>
<pre data-l="sql">CREATE TABLE users (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), email text UNIQUE NOT NULL,
  password_hash text NOT NULL, created_at timestamptz NOT NULL DEFAULT now());
CREATE TABLE documents (id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
  user_id uuid NOT NULL REFERENCES users(id) ON DELETE CASCADE, title text NOT NULL,
  created_at timestamptz NOT NULL DEFAULT now());
CREATE INDEX documents_user_created_idx ON documents (user_id, created_at DESC, id DESC);
CREATE TABLE idempotency_keys (user_id uuid NOT NULL, key text NOT NULL, response jsonb,
  created_at timestamptz NOT NULL DEFAULT now(), PRIMARY KEY (user_id, key));</pre>
<pre data-l="js">// server.js
import express from 'express';
import cors from 'cors';
import helmet from 'helmet';
import rateLimit from 'express-rate-limit';
import jwt from 'jsonwebtoken';
import bcrypt from 'bcrypt';
import pg from 'pg';
import { z } from 'zod';

const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, max: 10 });
const JWT_SECRET = process.env.JWT_SECRET;
if (!JWT_SECRET) throw new Error('JWT_SECRET is required');   // fail fast at boot

// ---------- errors ----------
class HttpError extends Error {
  constructor(status, message, details) { super(message); this.status = status; this.details = details; }
}

// ---------- middleware ----------
const validate = (schema, where = 'body') => (req, res, next) => {
  const r = schema.safeParse(req[where]);
  if (!r.success) return next(new HttpError(400, 'Invalid request', z.flattenError(r.error)));
  req.valid = { ...req.valid, [where]: r.data };   // Express 5: req.query is read-only, keep parsed data here
  next();
};

function requireAuth(req, res, next) {
  const [scheme, token] = (req.get('authorization') ?? '').split(' ');
  if (scheme !== 'Bearer' || !token) return next(new HttpError(401, 'Sign in required'));
  try {
    const payload = jwt.verify(token, JWT_SECRET, { algorithms: ['HS256'] }); // verify, never decode
    req.user = { id: payload.sub };
    next();
  } catch {
    next(new HttpError(401, 'Sign in required'));
  }
}

const authLimiter = rateLimit({ windowMs: 15 * 60 * 1000, limit: 20, standardHeaders: 'draft-8', legacyHeaders: false });

// ---------- schemas ----------
const Credentials = z.object({ email: z.string().trim().toLowerCase().pipe(z.email()), password: z.string().min(8).max(72) });
const NewDocument = z.strictObject({ title: z.string().trim().min(1).max(200) });
const ListQuery = z.object({ limit: z.coerce.number().int().min(1).max(50).default(20), cursor: z.string().optional() });
const IdParam = z.object({ id: z.uuid() });

// ---------- repositories: the only place with SQL ----------
const repo = {
  async createUser(email, hash) {
    const { rows } = await pool.query('INSERT INTO users (email, password_hash) VALUES ($1, $2) RETURNING id, email', [email, hash]);
    return rows[0];
  },
  async findUserByEmail(email) {
    const { rows } = await pool.query('SELECT id, email, password_hash FROM users WHERE email = $1', [email]);
    return rows[0] ?? null;
  },
  async listDocuments(userId, limit, cursor) {
    // keyset pagination: stable and fast, unlike OFFSET on big tables
    const params = [userId, limit + 1];
    let where = 'user_id = $1';
    if (cursor) {
      const [ts, id] = Buffer.from(cursor, 'base64url').toString().split('|');
      params.push(ts, id);
      where += ' AND (created_at, id) &lt; ($3::timestamptz, $4::uuid)';
    }
    const { rows } = await pool.query(
      `SELECT id, title, created_at FROM documents WHERE ${where} ORDER BY created_at DESC, id DESC LIMIT $2`, params);
    const hasMore = rows.length > limit;
    const page = rows.slice(0, limit);
    const last = page.at(-1);
    return { items: page, nextCursor: hasMore ? Buffer.from(`${last.created_at.toISOString()}|${last.id}`).toString('base64url') : null };
  },
  async getDocument(userId, id) {   // ownership is part of the query
    const { rows } = await pool.query('SELECT id, title, created_at FROM documents WHERE id = $1 AND user_id = $2', [id, userId]);
    return rows[0] ?? null;
  },
  async createDocumentIdempotent(userId, key, title) {
    const client = await pool.connect();
    try {
      await client.query('BEGIN');
      // claim the key; a concurrent duplicate waits on the PK lock, then sees the conflict
      const claim = await client.query(
        'INSERT INTO idempotency_keys (user_id, key) VALUES ($1, $2) ON CONFLICT DO NOTHING RETURNING key', [userId, key]);
      if (claim.rowCount === 0) {
        await client.query('ROLLBACK');
        const { rows } = await pool.query('SELECT response FROM idempotency_keys WHERE user_id = $1 AND key = $2', [userId, key]);
        return { replay: true, doc: rows[0]?.response };
      }
      const { rows } = await client.query(
        'INSERT INTO documents (user_id, title) VALUES ($1, $2) RETURNING id, title, created_at', [userId, title]);
      await client.query('UPDATE idempotency_keys SET response = $3 WHERE user_id = $1 AND key = $2', [userId, key, rows[0]]);
      await client.query('COMMIT');
      return { replay: false, doc: rows[0] };
    } catch (err) {
      await client.query('ROLLBACK');
      throw err;
    } finally {
      client.release();            // ALWAYS give the connection back to the pool
    }
  },
};

// ---------- app ----------
const app = express();
app.set('trust proxy', 1);                       // behind one proxy; measure this on your host
app.use(helmet());
app.use(cors({ origin: process.env.FRONTEND_URL })); // before auth: preflights carry no token
app.use(express.json({ limit: '100kb' }));

app.get('/health', (req, res) => res.json({ ok: true }));

app.post('/auth/register', authLimiter, validate(Credentials), async (req, res) => {
  const { email, password } = req.valid.body;
  const hash = await bcrypt.hash(password, 10);  // async: runs on the libuv pool
  try {
    const user = await repo.createUser(email, hash);
    res.status(201).json({ token: jwt.sign({}, JWT_SECRET, { subject: user.id, expiresIn: '15m' }) });
  } catch (err) {
    if (err.code === '23505') throw new HttpError(409, 'Email already registered'); // unique violation
    throw err;
  }
});

app.post('/auth/login', authLimiter, validate(Credentials), async (req, res) => {
  const { email, password } = req.valid.body;
  const user = await repo.findUserByEmail(email);
  const ok = user ? await bcrypt.compare(password, user.password_hash) : false;
  if (!ok) throw new HttpError(401, 'Invalid email or password');   // same message for both cases
  res.json({ token: jwt.sign({}, JWT_SECRET, { subject: user.id, expiresIn: '15m' }) });
});

app.use(requireAuth);                            // everything below needs a valid token

app.get('/documents', validate(ListQuery, 'query'), async (req, res) => {
  const { limit, cursor } = req.valid.query;
  res.json(await repo.listDocuments(req.user.id, limit, cursor));
});

app.get('/documents/:id', validate(IdParam, 'params'), async (req, res) => {
  const doc = await repo.getDocument(req.user.id, req.valid.params.id);
  if (!doc) throw new HttpError(404, 'Document not found');    // not yours = doesn't exist
  res.json(doc);
});

app.post('/documents', validate(NewDocument), async (req, res) => {
  const key = req.get('idempotency-key');
  if (!key) throw new HttpError(400, 'Idempotency-Key header required');
  const { replay, doc } = await repo.createDocumentIdempotent(req.user.id, key, req.valid.body.title);
  res.status(replay ? 200 : 201).json(doc);
});

// ---------- 404 + central error handler (4 params!) ----------
app.use((req, res) => res.status(404).json({ error: 'Not found' }));
app.use((err, req, res, next) => {
  const status = err.status ?? (err.type === 'entity.parse.failed' ? 400 : 500);
  if (status >= 500) console.error({ msg: err.message, stack: err.stack, path: req.path });
  res.status(status).json({ error: status >= 500 ? 'Internal server error' : err.message, details: err.details });
});

const server = app.listen(process.env.PORT ?? 3000);
process.on('SIGTERM', () => server.close(() => pool.end()));   // graceful shutdown on deploys</pre></x-impl>
<x-walk><ol><li><code>POST /auth/login</code> → helmet sets security headers → cors → json parser → rate limiter (20 per 15 min per IP) → Zod validates and lowercases the email → bcrypt compare (async) → JWT with <code>sub</code> = user id, 15 min expiry.</li><li><code>GET /documents/abc</code> → requireAuth verifies the token → IdParam rejects “abc” (not a UUID) with 400 before touching the DB.</li><li><code>GET /documents/&lt;someone else's id&gt;</code> → the SQL has <code>AND user_id = $2</code> → no row → 404.</li><li><code>POST /documents</code> twice with the same Idempotency-Key → the second request hits <code>ON CONFLICT DO NOTHING</code>, returns the stored response with 200, no duplicate row.</li><li>Any thrown error inside an async route → Express 5 passes it to the error handler → clean JSON; 5xx details only in logs.</li></ol></x-walk>
<x-mist><ul><li>Forgetting <code>client.release()</code> in <code>finally</code>: after 10 leaks the pool is empty and every request hangs (Phase 12, scenario 2).</li><li>Building SQL with template strings from user input. Above, only the fixed <code>where</code> fragment is interpolated; all values are <code>$n</code> parameters.</li><li>Returning 403 for another user’s document: it confirms the id exists.</li></ul></x-mist>
</x-lesson>

<x-lesson t="Authentication: JWT, refresh tokens and password hashing" tag="must">
<x-def><b>Authentication</b> proves who you are. A <b>JWT</b> is a signed token carrying claims (like the user id) that the server can verify without a database lookup. <b>bcrypt</b> is a slow, salted password hash.</x-def>
<x-why>HTTP is stateless: every request must prove identity again. Sending the password every time is dangerous; a short-lived signed token is safer. Passwords must be hashed so a stolen database doesn’t reveal them.</x-why>
<x-in><p>A JWT is <code>base64url(header).base64url(payload).base64url(signature)</code>. With HS256, signature = HMAC-SHA256(header.payload, secret). Anyone can read the payload; only the secret holder can produce a valid signature.</p></x-in>
<x-vis><x-w w="jwt"></x-w><x-w w="flow" f="auth"></x-w></x-vis>
<x-impl><p><b>Access + refresh token pattern:</b></p><ul><li>Access token: short-lived (5–15 min), sent as <code>Authorization: Bearer</code>.</li><li>Refresh token: long-lived (days), random opaque string stored <b>hashed</b> in a <code>refresh_tokens</code> table, sent in an <code>httpOnly; Secure; SameSite=Strict</code> cookie to one path (<code>/auth/refresh</code>).</li><li>On refresh: look it up, check not revoked/expired, <b>rotate</b> (delete old, issue new), return a new access token. If a revoked token is used again, treat it as theft and revoke the whole family.</li><li>Logout = delete the refresh token row. Access tokens die on their own within minutes.</li></ul>
<pre data-l="js">import crypto from 'node:crypto';
const sha256 = (s) => crypto.createHash('sha256').update(s).digest('hex');

app.post('/auth/refresh', async (req, res) => {
  const raw = req.cookies?.rt;                      // needs cookie-parser
  if (!raw) throw new HttpError(401, 'No session');
  const { rows } = await pool.query(
    'DELETE FROM refresh_tokens WHERE token_hash = $1 AND expires_at > now() RETURNING user_id', [sha256(raw)]);
  if (!rows[0]) throw new HttpError(401, 'Session expired');   // deleted = used once (rotation)
  const next = crypto.randomBytes(32).toString('base64url');
  await pool.query("INSERT INTO refresh_tokens (user_id, token_hash, expires_at) VALUES ($1, $2, now() + interval '7 days')",
    [rows[0].user_id, sha256(next)]);
  res.cookie('rt', next, { httpOnly: true, secure: true, sameSite: 'strict', path: '/auth/refresh', maxAge: 7 * 864e5 });
  res.json({ token: jwt.sign({}, JWT_SECRET, { subject: rows[0].user_id, expiresIn: '15m' }) });
});</pre></x-impl>
<x-dm><p>DocMind uses <b>only</b> access tokens: 7 days for registered users, 30 days for guests (an expired guest token means lost files), HS256 with the algorithm pinned, Bearer header in <code>localStorage</code> (Vercel and Render are different sites, so an API cookie would be third-party). No refresh tokens or server-side logout yet: listed as a known gap. That’s why answers are rendered with react-markdown and no raw HTML: a token in localStorage is readable by any XSS.</p></x-dm>
<x-mist><ul><li>Using <code>jwt.decode()</code> to “check” a token. It doesn’t verify anything.</li><li>Not pinning <code>algorithms</code> (historic “alg: none” and RS/HS confusion attacks).</li><li>Putting roles in a long-lived token and expecting role changes to apply immediately.</li></ul></x-mist>
</x-lesson>

<x-lesson t="Reliability patterns: background jobs, retries, idempotency, webhooks" tag="must">
<x-def><b>Idempotent</b> means doing it twice has the same effect as doing it once. <b>Retries</b> repeat failed calls. <b>Background jobs</b> move slow work out of the request. <b>Webhooks</b> are HTTP callbacks another system sends you when something happens.</x-def>
<x-why>Networks fail in the middle. A client that times out doesn’t know whether the server finished, so it retries. Without idempotency, retries create duplicate payments, duplicate documents, duplicate courses.</x-why>
<x-in><ul><li><b>Retry only what is safe and transient:</b> timeouts, 429, 5xx. Never 400/401/403/404/422.</li><li><b>Exponential backoff with jitter:</b> wait base × 2^attempt, randomised, capped; respect <code>Retry-After</code>.</li><li><b>Idempotency keys:</b> the client sends a unique key per logical operation; the server stores the result under (user, key) with a unique constraint and replays it for duplicates.</li><li><b>Idempotent jobs:</b> design the job so re-running it is harmless (upsert, delete-then-insert, “if already done, skip”).</li><li><b>Webhooks:</b> verify the signature (HMAC over the raw body with a shared secret), respond 2xx fast, enqueue the work, dedupe by event id because senders retry.</li></ul></x-in>
<x-vis><x-w w="retry"></x-w></x-vis>
<x-dm><p>DocMind’s ingest job uses <code>jobId = documentId</code> (BullMQ won’t add the same id twice), 3 attempts with 5 s then 10 s backoff, and is idempotent: it deletes the document’s chunks first, then inserts all of them. Tested with a forced failure on chunk 2 and with a hard kill mid-job. “Last attempt?” is checked with <code>await job.getState() === 'failed'</code>, because a stalled job can be failed before its attempts run out.</p></x-dm>
<x-mist><ul><li>Retrying inside a retry inside a retry (3 layers × 3 attempts = 27 calls).</li><li>Checking “does it exist?” then inserting: two concurrent requests both see “no”. Let a unique constraint decide.</li></ul></x-mist>
</x-lesson>

<h2 class="sec"><span class="k">3.1</span>Node.js</h2>

<x-q n="3.1" tag="must basic"><x-t>What is Node.js?</x-t>
<x-say>A JavaScript runtime built on Chrome’s V8 engine and libuv. It runs JS on servers with an event-driven, non-blocking I/O model, plus a standard library for HTTP, files, crypto and streams.</x-say>
<x-no>“Node is a framework” or “a language”. It’s a runtime; Express is the framework.</x-no>
<x-ev>Basics.</x-ev></x-q>

<x-q n="3.2" tag="must basic"><x-t>Why is Node.js suitable for backend development?</x-t>
<x-say>It handles many concurrent I/O-bound connections efficiently on one thread, shares a language and JSON with the frontend, has a huge package ecosystem, and is natural for streaming (SSE, WebSockets).</x-say>
<x-fu q="When is it a poor fit?">CPU-heavy work (video encoding, ML inference, big number crunching) unless offloaded to workers or other services.</x-fu>
<x-ev>Trade-off awareness.</x-ev></x-q>

<x-q n="3.3" tag="must basic"><x-t>What is non-blocking I/O?</x-t>
<x-say>Starting an I/O operation and continuing with other work instead of waiting. The result is delivered later through a callback or promise, so one thread can serve many requests that are all waiting on I/O.</x-say>
<x-eg>While request A waits 3 s for an LLM, requests B to Z are parsed, queried and answered.</x-eg>
<x-ev>Core concept.</x-ev></x-q>

<x-q n="3.4" tag="must basic"><x-t>What is the difference between Node.js and browser JavaScript?</x-t>
<x-say>Same language and engine family, different environments. The browser has the DOM, window, fetch, localStorage and a security sandbox. Node has fs, process, Buffer, http, child processes, require/ESM loading from disk, and no DOM.</x-say>
<x-simple><p>Event loops also differ: Node has libuv phases, process.nextTick and setImmediate. Modern Node also has fetch, Web Streams, AbortController and Web Crypto built in.</p></x-simple>
<x-ev>Environment awareness.</x-ev></x-q>

<x-q n="3.5" tag="must basic"><x-t>What are Node.js streams?</x-t>
<x-say>Objects that read or write data in chunks over time instead of all at once, which keeps memory constant and lets processing start immediately. They handle backpressure so a fast producer doesn’t flood a slow consumer.</x-say>
<x-eg>Streaming an S3 download to the HTTP response; parsing a large CSV line by line; forwarding LLM tokens as SSE.</x-eg>
<x-ev>Memory-aware design.</x-ev></x-q>

<x-q n="3.6" tag="must basic"><x-t>What are readable, writable and duplex streams?</x-t>
<x-say>Readable produces data (file read, request body). Writable consumes it (file write, response). Duplex does both independently (TCP socket). A Transform is a duplex whose output is computed from its input (gzip, CSV parser).</x-say>
<x-ev>Vocabulary.</x-ev></x-q>

<x-q n="3.7" tag="should basic"><x-t>What is the EventEmitter class?</x-t>
<x-say>Node’s publish/subscribe building block: an object you can <code>emit('event', data)</code> on, with listeners registered via <code>on</code>/<code>once</code>. Streams, HTTP servers and sockets are all EventEmitters.</x-say>
<x-code><pre data-l="js">import { EventEmitter } from 'node:events';
const jobs = new EventEmitter();
jobs.on('done', ({ id }) => console.log('job done', id));
jobs.emit('done', { id: 7 });   // listeners run synchronously, in order</pre></x-code>
<x-fu q="What happens if you emit 'error' with no listener?">Node throws it, crashing the process if nothing catches it. Always listen for 'error' on streams and emitters.</x-fu>
<x-ev>Node fundamentals.</x-ev></x-q>

<x-q n="3.8" tag="must basic"><x-t>What is the difference between CommonJS and ES Modules?</x-t>
<x-say>CommonJS uses <code>require</code>/<code>module.exports</code>, loads synchronously and is Node’s original format. ES Modules use <code>import</code>/<code>export</code>, are the JS standard, are loaded asynchronously, allow top-level await and static analysis (tree-shaking).</x-say>
<x-simple><p>ESM is enabled by <code>"type": "module"</code> or the <code>.mjs</code> extension. In ESM there’s no <code>__dirname</code> (use <code>import.meta.dirname</code> in recent Node or <code>import.meta.url</code>). Recent Node versions can <code>require()</code> synchronous ES modules too.</p></x-simple>
<x-dm>DocMind’s backend is CommonJS (<code>"type": "commonjs"</code>) compiled from TypeScript. Checking that Mastra ships a CJS build was one of the first checks in the Phase 8 plan.</x-dm>
<x-ev>Practical module knowledge.</x-ev></x-q>

<x-q n="3.9" tag="must basic"><x-t>How does Node.js handle environment variables?</x-t>
<x-say>Through <code>process.env</code>, a string-to-string map from the OS environment. Locally they often come from a .env file (dotenv, or <code>node --env-file=.env</code>); in production the platform sets them.</x-say>
<x-code><pre data-l="js">const Env = z.object({ DATABASE_URL: z.url(), JWT_SECRET: z.string().min(32), PORT: z.coerce.number().default(3000) });
export const env = Env.parse(process.env);   // crash at boot, not at the first request</pre></x-code>
<x-dm>DocMind refuses to start without JWT_SECRET, REDIS_URL and BULLMQ_PREFIX. A wrong BULLMQ_PREFIX on Render (copied from .env) once made production share the laptop’s queue.</x-dm>
<x-ev>Configuration hygiene.</x-ev></x-q>

<x-q n="3.10" tag="must basic"><x-t>What is the purpose of package.json?</x-t>
<x-say>The project manifest: name, version, module type, scripts, dependencies with version ranges, engines (Node version) and entry points.</x-say>
<x-dm>It must be strict JSON: a <code>//</code> comment added in DocMind’s package.json broke every npm command (EJSONPARSE).</x-dm>
<x-ev>Tooling basics.</x-ev></x-q>

<x-q n="3.11" tag="must basic"><x-t>What is the difference between dependencies and devDependencies?</x-t>
<x-say>dependencies are needed at runtime (express, pg, zod). devDependencies are only for development and builds (typescript, eslint, test runners). <code>npm ci --omit=dev</code> installs only dependencies for production.</x-say>
<x-ev>Build awareness.</x-ev></x-q>

<x-q n="3.12" tag="must basic"><x-t>What is npm?</x-t>
<x-say>Node’s package manager and registry: it installs packages into node_modules, resolves version ranges, runs scripts and publishes packages.</x-say>
<x-ev>Basics.</x-ev></x-q>

<x-q n="3.13" tag="must basic"><x-t>What is the purpose of package-lock.json?</x-t>
<x-say>It records the exact resolved version and integrity hash of every installed package, including transitive ones, so every machine and CI run installs the identical tree. Commit it; use <code>npm ci</code> in CI.</x-say>
<x-fu q="What’s a supply-chain risk here?">A compromised package version. Lockfiles plus integrity hashes, reviewing new dependencies, and <code>npm audit</code> reduce it.</x-fu>
<x-ev>Reproducible builds.</x-ev></x-q>

<x-q n="3.14" tag="must solid"><x-t>How would you handle file uploads in Node.js?</x-t>
<x-say>Use multipart/form-data with a parser like multer or busboy, enforce size and type limits early, store the file in object storage (not the DB), save metadata in a table, and process it in a background job.</x-say>
<x-code><pre data-l="js">import multer from 'multer';
const upload = multer({ storage: multer.memoryStorage(), limits: { fileSize: 10 * 1024 * 1024 } });
app.post('/upload', requireAuth, checkQuota, upload.single('file'), async (req, res) => {
  if (req.file?.mimetype !== 'application/pdf') throw new HttpError(400, 'PDF only');
  // also check magic bytes: %PDF-
  if (!req.file.buffer.subarray(0, 5).equals(Buffer.from('%PDF-'))) throw new HttpError(400, 'Not a PDF');
  const doc = await ingestion.queue(req.user.id, req.file);   // → 202
  res.status(202).json(doc);
});</pre></x-code>
<x-dm>DocMind runs <code>checkDocumentCap</code> before multer, so an over-limit user is rejected before the file is even read; 10 MB cap; 413 for oversize via the last-resort error handler.</x-dm>
<x-ev>Practical backend skill.</x-ev></x-q>

<x-q n="3.15" tag="must solid"><x-t>How would you process a large file without loading the entire file into memory?</x-t>
<x-say>Stream it: read with a readable stream and process chunk by chunk (or line by line with readline), using <code>pipeline</code> for backpressure and error handling. For uploads, stream directly to storage, then have a worker stream it back for processing.</x-say>
<x-simple><p>For PDFs specifically, many parsers need random access to the whole file, so you process page by page if the library supports it, and do it in a worker process with a memory limit.</p></x-simple>
<x-ev>Memory reasoning.</x-ev></x-q>

<h2 class="sec"><span class="k">3.2</span>Express.js</h2>

<x-q n="3.16" tag="must basic"><x-t>What is Express.js?</x-t>
<x-say>A minimal web framework for Node that adds routing, a middleware pipeline and helpers on top of the http module.</x-say>
<x-ev>Basics.</x-ev></x-q>

<x-q n="3.17" tag="must basic"><x-t>How does an Express request-response lifecycle work?</x-t>
<x-say>Node parses the HTTP request into req; Express runs matching middleware and routes in registration order; each calls next() or ends the response; errors skip to error-handling middleware; the response is sent once.</x-say>
<x-simple><p>Step through the “Express request” animation in lesson 3.B.</p></x-simple>
<x-ev>Mental model.</x-ev></x-q>

<x-q n="3.18" tag="must basic"><x-t>What is middleware?</x-t>
<x-say>A function <code>(req, res, next)</code> that runs during the request pipeline and can read or modify req/res, end the response, or pass control on with next().</x-say>
<x-eg>Logging, CORS, body parsing, auth, validation, rate limiting, compression.</x-eg>
<x-ev>Core Express concept.</x-ev></x-q>

<x-q n="3.19" tag="must basic"><x-t>What happens when you call next()?</x-t>
<x-say>Express runs the next matching middleware or route. <code>next(err)</code> skips to the next error handler. <code>next('route')</code> skips the remaining handlers of the current route. If you neither call next nor respond, the request hangs.</x-say>
<x-ev>Precision.</x-ev></x-q>

<x-q n="3.20" tag="must basic"><x-t>What is the difference between application-level and router-level middleware?</x-t>
<x-say>Application-level is registered with <code>app.use()</code> and applies to everything after it. Router-level is registered on an <code>express.Router()</code> and only applies to that router’s routes, so you can group concerns (e.g. admin routes with an admin check).</x-say>
<x-code><pre data-l="js">const admin = express.Router();
admin.use(requireRole('admin'));
admin.get('/stats', getStats);
app.use('/admin', requireAuth, admin);</pre></x-code>
<x-ev>Code organisation.</x-ev></x-q>

<x-q n="3.21" tag="must basic"><x-t>What is error-handling middleware?</x-t>
<x-say>Middleware with four parameters <code>(err, req, res, next)</code>. Express calls it when something calls next(err) or (Express 5) an async handler rejects. It should be registered last, log the error and send a safe response.</x-say>
<x-ev>Robustness.</x-ev></x-q>

<x-q n="3.22" tag="must basic"><x-t>Why does Express have a particular middleware execution order?</x-t>
<x-say>Because middleware is just a list processed top to bottom, and each step may depend on earlier ones: auth needs the parsed headers, validation needs the parsed body, routes need the authenticated user. Order is how you express those dependencies.</x-say>
<x-dm>DocMind mounts the public auth router, then <code>app.use(requireAuth)</code>, then every data router: a router added later is protected by default (“default deny”). cors() must stay above requireAuth.</x-dm>
<x-ev>Design reasoning.</x-ev></x-q>

<x-q n="3.23" tag="must solid"><x-t>How would you create a custom authentication middleware?</x-t>
<x-say>Read the Authorization header, require the Bearer scheme, verify the JWT with the secret and a pinned algorithm, attach the user id to req.user, call next(); on any failure respond 401 without calling next.</x-say>
<x-code><pre data-l="js">See requireAuth in the mini app above. Key points: verify (not decode), algorithms pinned,
a single generic 401 message, and no database lookup unless you need fresh user data.</pre></x-code>
<x-fu q="How do you revoke a JWT before it expires?">Short expiry + refresh tokens, or a denylist of token ids (jti) checked per request (adds a lookup), or a per-user “tokens valid after” timestamp.</x-fu>
<x-ev>Hands-on auth.</x-ev></x-q>

<x-q n="3.24" tag="must basic"><x-t>How would you validate incoming request data?</x-t>
<x-say>With a schema library like Zod at the edge of the API: parse body, params and query; reject with 400 and field-level errors; pass only the parsed, typed data to the service.</x-say>
<x-simple><p>Validate types and shapes, ranges and lengths, formats (email, uuid), and reject unknown fields where it matters (<code>z.strictObject</code>). Business rules (does the document belong to you? is it ready?) belong in the service.</p></x-simple>
<x-ev>Input hygiene.</x-ev></x-q>

<x-q n="3.25" tag="must basic"><x-t>What is the difference between route parameters, query parameters and request bodies?</x-t>
<x-say>Route params identify a resource in the path (<code>/documents/:id</code>). Query params filter, sort or paginate (<code>?limit=20&amp;cursor=…</code>). The body carries the data you create or update (JSON on POST/PUT/PATCH).</x-say>
<x-ev>REST conventions.</x-ev></x-q>

<x-q n="3.26" tag="must basic"><x-t>What’s the difference between req.params, req.query and req.body?</x-t>
<x-say><code>req.params</code> holds named path segments, <code>req.query</code> the parsed query string (all strings), <code>req.body</code> the parsed body, which is only present if a body parser like express.json() ran.</x-say>
<x-no>Treating query values as numbers without converting them.</x-no>
<x-ev>Basics.</x-ev></x-q>

<x-q n="3.27" tag="must basic"><x-t>What is CORS?</x-t>
<x-say>Cross-Origin Resource Sharing: a browser security rule. A page from origin A can only read responses from origin B if B’s response headers allow A (Access-Control-Allow-Origin). The server sets the headers; the browser enforces them.</x-say>
<x-simple><p>Origin = scheme + host + port. CORS doesn’t protect your API from curl or other servers; it protects users’ browsers from malicious sites reading data with their credentials.</p></x-simple>
<x-dm>DocMind: frontend on Vercel, API on Render, so FRONTEND_URL lists the allowed origins (comma-separated, trailing slashes stripped).</x-dm>
<x-ev>Web security basics.</x-ev></x-q>

<x-q n="3.28" tag="must solid"><x-t>What is preflight handling?</x-t>
<x-say>Before a “non-simple” cross-origin request (e.g. with an Authorization header, JSON content type, or PUT/DELETE), the browser sends an OPTIONS request asking which methods and headers are allowed. The server must answer it with the right CORS headers, without requiring auth.</x-say>
<x-fu q="How do you reduce preflight overhead?">Set <code>Access-Control-Max-Age</code> so the browser caches the preflight result.</x-fu>
<x-ev>Practical CORS.</x-ev></x-q>

<x-q n="3.29" tag="must basic"><x-t>What is rate limiting?</x-t>
<x-say>Limiting how many requests a client (IP, user or API key) can make in a time window, returning 429 when exceeded. It protects against abuse, brute force and runaway costs.</x-say>
<x-an>A nightclub door: only so many people per hour; everyone else waits outside.</x-an>
<x-simple><p>Algorithms: fixed window (simple, bursts at edges), sliding window, token bucket (allows short bursts, smooth average). With several server instances, keep counters in a shared store like Redis.</p></x-simple>
<x-dm>DocMind: one shared counter per IP for /auth/guest, /register and /login (20 per 15 min), in memory, so it resets on every restart. Behind Render + Cloudflare the right <code>trust proxy</code> value was 3, found by measuring.</x-dm>
<x-ev>Protection mindset.</x-ev></x-q>

<x-q n="3.30" tag="must solid"><x-t>How would you implement pagination?</x-t>
<x-say>Offset/limit for small or admin lists; cursor (keyset) pagination for large or live lists: order by a unique, stable key and ask for rows after the last one seen. Always cap the page size.</x-say>
<x-code><pre data-l="sql">-- offset: simple, but slow at high offsets and rows shift when new ones arrive
SELECT * FROM documents WHERE user_id = $1 ORDER BY created_at DESC LIMIT 20 OFFSET 40;
-- keyset: uses the index, stable
SELECT * FROM documents WHERE user_id = $1 AND (created_at, id) &lt; ($2, $3)
ORDER BY created_at DESC, id DESC LIMIT 20;</pre></x-code>
<x-ev>Scalability thinking.</x-ev></x-q>

<x-q n="3.31" tag="must solid"><x-t>How would you implement centralized error handling?</x-t>
<x-say>Throw typed errors (HttpError with a status) from anywhere, let Express forward them to one error middleware, which logs details with a request id and returns a consistent JSON shape, hiding internals for 5xx.</x-say>
<x-dm>DocMind’s <code>summarizeError()</code> exists because Drizzle errors embed the SQL and every bound parameter: for vector search that printed 3072 numbers and buried the real cause (ECONNRESET in the cause chain).</x-dm>
<x-ev>Maintainability.</x-ev></x-q>

<x-q n="3.32" tag="must solid"><x-t>How would you structure a large Express application?</x-t>
<x-say>By layer and feature: routes (thin, HTTP only) → services (business rules) → repositories (data access), plus middleware, schemas, config and a composition root (app.js builds the app, index.js starts it so tests can import the app without listening).</x-say>
<x-code><pre data-l="text">src/
  app.js            builds express app (no listen)
  index.js          env check, listen, graceful shutdown
  config.js
  middleware/       auth.js, rateLimit.js, errors.js
  routes/           documents.routes.js, chat.routes.js
  services/         documents.service.js, chat.service.js, llm.service.js
  repositories/     documents.repository.js, chunks.repository.js
  schemas/          zod schemas
  workers/          background jobs</pre></x-code>
<x-ev>Architecture sense.</x-ev></x-q>

<x-q n="3.33" tag="must basic"><x-t>What is the difference between a controller, service and repository?</x-t>
<x-say>Controller: translates HTTP into a function call and back (read req, send res). Service: business rules and orchestration, no HTTP. Repository: all database access for an entity, no business rules.</x-say>
<x-dm>DocMind’s rule: nothing outside repositories touches SQL, and services never touch req/res. <code>prepareChat()</code> returns <code>{ ok: false, status, error }</code> and the route sends it. That’s what let the BullMQ worker reuse ingestion code.</x-dm>
<x-ev>Separation of concerns.</x-ev></x-q>

<x-q n="3.34" tag="must basic"><x-t>Why shouldn’t business logic be placed entirely inside route handlers?</x-t>
<x-say>It can’t be reused (workers, CLI, other routes), it’s hard to unit test without HTTP, it mixes concerns, and handlers grow into unreadable files.</x-say>
<x-ev>Design judgement.</x-ev></x-q>

<x-q n="3.35" tag="must solid"><x-t>How would you protect an API against malicious input?</x-t>
<x-say>Validate everything at the boundary (types, lengths, formats, unknown fields), limit body size, use parameterized queries, escape output, enforce auth and ownership server-side, rate limit, and never pass raw input to shell, eval, file paths or LLM tools without checks.</x-say>
<x-simple><p>Also: helmet for headers, check file magic bytes, cap message length before sending to an LLM (DocMind has no cap yet: ISSUES #9), and treat LLM output as untrusted input too.</p></x-simple>
<x-ev>Security mindset.</x-ev></x-q>

<h2 class="sec"><span class="k">3.3</span>Authentication and security</h2>

<x-q n="3.36" tag="must basic"><x-t>What is authentication?</x-t>
<x-say>Verifying who someone is: password, token, OAuth login, API key.</x-say><x-ev>Basics.</x-ev></x-q>

<x-q n="3.37" tag="must basic"><x-t>What is authorization?</x-t>
<x-say>Deciding what an authenticated identity may do or access: this user may read their own documents but not yours; admins may delete.</x-say>
<x-eg>Logging in proves you’re Asha (authentication). Being allowed to open document 42 depends on whether it’s Asha’s (authorization).</x-eg>
<x-ev>The distinction is a classic red-flag check.</x-ev></x-q>

<x-q n="3.38" tag="must basic"><x-t>What is JWT?</x-t>
<x-say>JSON Web Token: a compact, signed token with JSON claims (like the user id and expiry). The server can verify it with a key, without storing sessions.</x-say><x-ev>Basics.</x-ev></x-q>

<x-q n="3.39" tag="must basic"><x-t>Explain the structure of a JWT.</x-t>
<x-say>Three base64url parts separated by dots: header (algorithm, type), payload (claims like sub, exp, iat), signature (computed over header.payload with the key).</x-say>
<x-simple><p>Try the JWT inspector in lesson 3.B: edit the payload with the old signature and verification fails.</p></x-simple>
<x-no>“The payload is encrypted.” It’s only encoded. Never put secrets in it.</x-no>
<x-ev>Precision.</x-ev></x-q>

<x-q n="3.40" tag="must basic"><x-t>How does JWT authentication work?</x-t>
<x-say>Login checks credentials and returns a signed token. The client sends it in the Authorization header on each request. Middleware verifies the signature and expiry and attaches the user id; routes then authorize using that id.</x-say><x-ev>Flow understanding.</x-ev></x-q>

<x-q n="3.41" tag="must solid"><x-t>What are access tokens and refresh tokens?</x-t>
<x-say>Access tokens are short-lived credentials sent with every request. Refresh tokens are long-lived, stored more safely, used only to get new access tokens, and can be revoked server-side. Together they give short exposure if a token leaks plus long sessions.</x-say>
<x-dm>DocMind has access tokens only (7/30 days). Adding refresh tokens is on the known-gaps list.</x-dm>
<x-ev>Session design.</x-ev></x-q>

<x-q n="3.42" tag="must solid"><x-t>Where should tokens be stored?</x-t>
<x-say>Trade-off. An httpOnly, Secure, SameSite cookie can’t be read by JavaScript (protects against XSS theft) but needs CSRF protection and works best on the same site. localStorage or memory is simple for cross-site APIs but readable by any XSS. A common pattern: access token in memory, refresh token in an httpOnly cookie.</x-say>
<x-dm>DocMind chose localStorage because Vercel and Render are different sites (an API cookie would be third-party), and compensated by rendering answers with no raw HTML.</x-dm>
<x-ev>Security trade-offs.</x-ev></x-q>

<x-q n="3.43" tag="must basic"><x-t>What happens when an access token expires?</x-t>
<x-say>verify() throws TokenExpiredError, the API returns 401, and the client either calls the refresh endpoint and retries the request once, or sends the user to log in.</x-say>
<x-ev>Flow handling.</x-ev></x-q>

<x-q n="3.44" tag="must solid"><x-t>How would you implement role-based access control?</x-t>
<x-say>Store roles (or permissions) per user, load them on the request (token claim or DB lookup), and check them in middleware or the service: <code>requireRole('admin')</code>. Combine with ownership checks for row-level access.</x-say>
<x-code><pre data-l="js">const requireRole = (...roles) => (req, res, next) =>
  roles.includes(req.user.role) ? next() : next(new HttpError(403, 'Forbidden'));
app.delete('/admin/users/:id', requireAuth, requireRole('admin'), deleteUser);</pre></x-code>
<x-fu q="Role in the token or in the DB?">In the token is fast but stale until expiry; in the DB is fresh but costs a lookup. Short-lived tokens make the token approach acceptable.</x-fu>
<x-ev>Authorization design.</x-ev></x-q>

<x-q n="3.45" tag="must basic"><x-t>What is password hashing?</x-t>
<x-say>Running the password through a one-way, slow, salted function (bcrypt, scrypt, Argon2) and storing only the result. At login you hash the attempt the same way and compare.</x-say><x-ev>Basics.</x-ev></x-q>

<x-q n="3.46" tag="must basic"><x-t>Why should passwords never be stored as plain text?</x-t>
<x-say>A database leak would expose every password, and people reuse passwords across sites. Even staff with DB access shouldn’t be able to read them.</x-say><x-ev>Responsibility.</x-ev></x-q>

<x-q n="3.47" tag="must basic"><x-t>What’s the difference between hashing and encryption?</x-t>
<x-say>Hashing is one-way: you can’t get the input back, only compare. Encryption is two-way: with the key you can decrypt. Passwords are hashed; data you need to read again (API keys of your users, tokens to third parties) is encrypted.</x-say><x-ev>Precision.</x-ev></x-q>

<x-q n="3.48" tag="must basic"><x-t>What is bcrypt?</x-t>
<x-say>A password hashing function with a built-in random salt and a cost factor that makes each hash deliberately slow (e.g. 10 rounds ≈ tens of milliseconds), so brute-forcing leaked hashes is expensive.</x-say>
<x-fu q="Any limits?">It only uses the first 72 bytes of the password, so cap passwords at 72 bytes (DocMind does). Use the async API so hashing runs on the thread pool, not the event loop.</x-fu>
<x-ev>Practical security.</x-ev></x-q>

<x-q n="3.49" tag="must basic"><x-t>What is SQL injection?</x-t>
<x-say>An attack where user input is concatenated into a SQL string and changes the query’s meaning, e.g. <code>' OR '1'='1</code> to bypass a login or <code>'; DROP TABLE users; --</code>.</x-say>
<x-code><pre data-l="js">// vulnerable
pool.query(`SELECT * FROM users WHERE email = '${email}'`);
// safe
pool.query('SELECT * FROM users WHERE email = $1', [email]);</pre></x-code><x-ev>Security basics.</x-ev></x-q>

<x-q n="3.50" tag="must basic"><x-t>How do parameterized queries prevent SQL injection?</x-t>
<x-say>The SQL text and the values are sent separately. The database parses the query structure first, then binds values as data, so a value can never become SQL syntax.</x-say>
<x-fu q="What can’t be parameterized?">Identifiers like table or column names and ORDER BY direction. Use an allow-list for those.</x-fu><x-ev>Mechanism, not just the rule.</x-ev></x-q>

<x-q n="3.51" tag="must basic"><x-t>What is XSS?</x-t>
<x-say>Cross-site scripting: an attacker gets their script to run in other users’ browsers on your site, usually by storing or reflecting unescaped input in HTML. It can steal tokens from localStorage and act as the user.</x-say>
<x-simple><p>Defences: escape output (React does by default), never inject raw HTML (no <code>dangerouslySetInnerHTML</code> / rehype-raw without a sanitizer like DOMPurify), Content-Security-Policy, httpOnly cookies. LLM output is user-controlled content too: a prompt injection can make the model emit a script tag.</p></x-simple><x-ev>Web security.</x-ev></x-q>

<x-q n="3.52" tag="must basic"><x-t>What is CSRF?</x-t>
<x-say>Cross-site request forgery: a malicious site makes the user’s browser send a request to your site, and the browser automatically attaches your cookies, so the request is authenticated without the user meaning it.</x-say>
<x-simple><p>Defences: SameSite cookies (Lax/Strict), CSRF tokens, checking Origin. Bearer tokens in headers aren’t sent automatically, so header-token APIs are naturally CSRF-resistant (but more XSS-exposed).</p></x-simple><x-ev>Web security.</x-ev></x-q>

<x-q n="3.53" tag="must basic"><x-t>How would you securely handle API keys?</x-t>
<x-say>Keep them server-side in environment variables or a secret manager, never in code or Git, send them in headers rather than URLs, give each environment its own key with least privilege, and rotate on exposure.</x-say>
<x-dm>DocMind moved the Gemini key from <code>?key=</code> in the URL to the <code>x-goog-api-key</code> header, because URLs end up in logs and error messages. A key once leaked through VS Code’s <code>.history</code> folder, so <code>.history/</code> is gitignored now.</x-dm><x-ev>Operational security.</x-ev></x-q>

<x-q n="3.54" tag="must basic"><x-t>Why shouldn’t API keys be exposed in frontend code?</x-t>
<x-say>Everything shipped to the browser is public: anyone can open dev tools and copy the key, then use your quota and run up your bill. Call the provider from your backend (or a proxy like a Cloudflare Worker) and authenticate users there.</x-say><x-ev>Basic security.</x-ev></x-q>

<h2 class="sec"><span class="k">3.4</span>Backend architecture</h2>

<x-q n="3.55" tag="must basic"><x-t>What is REST?</x-t>
<x-say>An architectural style for HTTP APIs: resources identified by URLs, manipulated with standard methods, stateless requests, standard status codes and representations like JSON.</x-say><x-ev>Basics.</x-ev></x-q>

<x-q n="3.56" tag="must basic"><x-t>What are HTTP methods?</x-t>
<x-say>GET reads, POST creates or triggers actions, PUT replaces, PATCH partially updates, DELETE removes; HEAD and OPTIONS are metadata. GET, HEAD, PUT and DELETE are idempotent; POST and PATCH aren’t guaranteed to be.</x-say><x-ev>Basics.</x-ev></x-q>

<x-q n="3.57" tag="must basic"><x-t>Explain HTTP status codes: 200, 201, 400, 401, 403, 404, 409, 429 and 500.</x-t>
<x-say>200 OK; 201 Created; 400 bad input; 401 not authenticated; 403 authenticated but not allowed; 404 not found; 409 conflict with current state; 429 too many requests; 500 server bug.</x-say>
<x-dm>DocMind uses 202 Accepted for uploads (queued), 409 for chatting with a document that’s still processing, 503 when Redis is down at upload time, 413 for an oversize file, and 404 (not 403) for another user’s document.</x-dm><x-ev>API design vocabulary.</x-ev></x-q>

<x-q n="3.58" tag="must basic"><x-t>What’s the difference between PUT and PATCH?</x-t>
<x-say>PUT replaces the whole resource with the body (missing fields are cleared) and is idempotent. PATCH changes only the given fields.</x-say><x-ev>Precision.</x-ev></x-q>

<x-q n="3.59" tag="must basic"><x-t>What is idempotency?</x-t>
<x-say>An operation is idempotent if doing it once or many times leaves the system in the same state. DELETE /docs/1 twice → still deleted. POST /payments twice → two payments, unless you add an idempotency key.</x-say><x-ev>Reliability concept.</x-ev></x-q>

<x-q n="3.60" tag="must solid"><x-t>Why is idempotency important in payment APIs and AI workflows?</x-t>
<x-say>Retries are unavoidable (timeouts, crashes, double clicks). In payments a duplicate charges twice; in AI workflows a duplicate spends tokens again and saves duplicate modules or lessons. Idempotency makes retries safe.</x-say><x-ev>Applied reliability.</x-ev></x-q>

<x-q n="3.61" tag="should basic"><x-t>What is API versioning?</x-t>
<x-say>Keeping old clients working while the API changes, via a version in the path (/v1), a header, or by only making additive changes. Breaking changes go to a new version with a deprecation period.</x-say>
<x-dm>DocMind’s new SSE events (status, sources, action) were additive; old frontends skip unknown events, so no version bump was needed.</x-dm><x-ev>Change management.</x-ev></x-q>

<x-q n="3.62" tag="must basic"><x-t>What is caching?</x-t>
<x-say>Storing the result of expensive work so the next request is served faster: in memory, in Redis, in HTTP caches/CDNs. The hard part is invalidation and staleness.</x-say>
<x-eg>Cache document lists for a few seconds; cache embeddings of identical text; cache LLM answers for identical prompts (exact cache) or similar ones (semantic cache, Phase 15).</x-eg><x-ev>Performance.</x-ev></x-q>

<x-q n="3.63" tag="must basic"><x-t>What is Redis, and when would you use it?</x-t>
<x-say>An in-memory key-value store with data structures (strings, hashes, lists, sorted sets, streams). Use it for caching, rate-limit counters, sessions, job queues (BullMQ), locks and pub/sub.</x-say>
<x-dm>DocMind uses Upstash Redis only for BullMQ. Free tier is 500K commands/month; an idle BullMQ worker polls Redis, so it was tuned (drainDelay 30 s, stalledInterval 5 min) from ~34K to ~5.5K commands per day.</x-dm><x-ev>Tool judgement.</x-ev></x-q>

<x-q n="3.64" tag="must basic"><x-t>What is a message queue?</x-t>
<x-say>A buffer between producers and consumers: producers add messages/jobs, workers take them and process them at their own pace, with acknowledgements and retries. It decouples and smooths load.</x-say><x-ev>Architecture basics.</x-ev></x-q>

<x-q n="3.65" tag="must basic"><x-t>What are background jobs?</x-t>
<x-say>Work done outside the request-response cycle by workers: sending emails, processing uploads, embedding documents, generating reports. The request records the job and returns quickly.</x-say><x-ev>Basics.</x-ev></x-q>

<x-q n="3.66" tag="must solid"><x-t>Why should long-running operations not necessarily execute inside an HTTP request?</x-t>
<x-say>Requests time out (proxies often at 30–100 s), the user can’t leave the page, a crash loses the work, and long requests tie up connections. A job queue gives retries, progress tracking and horizontal scaling.</x-say>
<x-dm>DocMind’s upload went from waiting for every embedding call to returning 202 in ~2 s, with ready in ~5 s.</x-dm><x-ev>Architecture judgement.</x-ev></x-q>

<x-q n="3.67" tag="must basic"><x-t>What is a webhook?</x-t>
<x-say>An HTTP request another service sends to your endpoint when an event happens (payment succeeded, file processed). You verify its signature, respond quickly, and process it idempotently because it may be delivered more than once.</x-say><x-ev>Integration basics.</x-ev></x-q>

<x-q n="3.68" tag="must solid"><x-t>How would you design a retry mechanism?</x-t>
<x-say>Retry only transient errors (timeouts, 429, 5xx), with a max attempt count, exponential backoff with jitter, a total time budget, and Retry-After respected; make the operation idempotent; log every attempt; give up with a clear error.</x-say>
<x-simple><p>Implementation: Phase 11 exercise 3 (runnable).</p></x-simple><x-ev>Reliability design.</x-ev></x-q>

<x-q n="3.69" tag="must basic"><x-t>What is exponential backoff?</x-t>
<x-say>Waiting longer after each failure: e.g. 0.5 s, 1 s, 2 s, 4 s, usually capped and with random jitter, so a struggling service gets room to recover and clients don’t retry in sync.</x-say><x-ev>Retry basics.</x-ev></x-q>

<x-q n="3.70" tag="must solid"><x-t>How would you prevent duplicate requests from creating duplicate records?</x-t>
<x-say>Idempotency keys stored under a unique constraint, natural unique constraints (e.g. one course per user + request key), upserts (<code>ON CONFLICT</code>), and disabling double submits in the UI. Rely on the database constraint, not a check-then-insert.</x-say>
<x-code><pre data-l="sql">INSERT INTO lessons (course_id, module_no, lesson_no, body) VALUES ($1, $2, $3, $4)
ON CONFLICT (course_id, module_no, lesson_no) DO NOTHING;</pre></x-code><x-ev>Practical reliability.</x-ev></x-q>

<h2 class="sec"><span class="k">✓</span>Checkpoint</h2>
<x-quiz id="qz-p03">
<x-mcq a="1"><x-t>A user changes <code>/documents/41</code> to <code>/documents/42</code> and sees another user’s file. They were logged in. What’s missing?</x-t><x-o>Authentication</x-o><x-o>Authorization (ownership check in the query)</x-o><x-o>CORS</x-o><x-o>Rate limiting</x-o><x-why>They were authenticated. The query must include <code>AND user_id = $2</code>.</x-why></x-mcq>
<x-mcq a="2"><x-t>Express 5: an async handler throws. What happens?</x-t><x-o>The process crashes</x-o><x-o>The request hangs</x-o><x-o>The rejection is forwarded to the error-handling middleware</x-o><x-o>Express retries the handler</x-o><x-why>Express 5 forwards rejected promises to next(err). Express 4 needed a wrapper.</x-why></x-mcq>
<x-mcq a="0"><x-t>Which status for “document is still being processed, try later”?</x-t><x-o>409 Conflict</x-o><x-o>404 Not Found</x-o><x-o>500</x-o><x-o>401</x-o><x-why>The request conflicts with the resource’s current state.</x-why></x-mcq>
<x-mcq a="3"><x-t>What does <code>jwt.decode()</code> check?</x-t><x-o>Signature</x-o><x-o>Expiry</x-o><x-o>Both</x-o><x-o>Nothing; it only reads the payload</x-o><x-why>Always use verify() with a pinned algorithm.</x-why></x-mcq>
<x-mcq a="1"><x-t>Your pool has max 10 connections and every request hangs after an hour. Most likely?</x-t><x-o>Postgres is down</x-o><x-o>A code path doesn’t release checked-out clients</x-o><x-o>The JWT secret changed</x-o><x-o>CORS</x-o><x-why>Leaked clients: always release in finally.</x-why></x-mcq>

</x-quiz>
