<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Backend Interview Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: an engineer's workbench. Fixed phase rail on the left, one lesson column on the right,
   amber marks what you are doing now, steel blue marks the system talking back. */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --panel-2:#eceee9; --ink:#1b2128; --muted:#5c6670; --line:#d5d9d3;
  --accent:#b86e00; --accent-ink:#ffffff; --accent-soft:#f6e7cf; --steel:#2f6690; --steel-soft:#dde9f2;
  --ok:#2d7a46; --ok-soft:#dcefe2; --warn:#a46b00; --warn-soft:#f8ecd2; --bad:#b03a2e; --bad-soft:#f6dedb;
  --code-bg:#1d232b; --code-ink:#dfe4ea;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:8px; --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --panel:#171e26; --panel-2:#1e2731; --ink:#e3e7ec; --muted:#93a0ad; --line:#2b3540;
    --accent:#f0a83a; --accent-ink:#1a1206; --accent-soft:#3a2c14; --steel:#7fb2dc; --steel-soft:#1d3346;
    --ok:#6cc58b; --ok-soft:#173326; --warn:#e9b44c; --warn-soft:#3a2e12; --bad:#ef7d70; --bad-soft:#3d1d1a;
    --code-bg:#0b0f14; --code-ink:#dfe4ea; --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --panel:#171e26; --panel-2:#1e2731; --ink:#e3e7ec; --muted:#93a0ad; --line:#2b3540;
  --accent:#f0a83a; --accent-ink:#1a1206; --accent-soft:#3a2c14; --steel:#7fb2dc; --steel-soft:#1d3346;
  --ok:#6cc58b; --ok-soft:#173326; --warn:#e9b44c; --warn-soft:#3a2e12; --bad:#ef7d70; --bad-soft:#3d1d1a;
  --code-bg:#0b0f14; --code-ink:#dfe4ea; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--steel)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
code,kbd,pre{font-family:var(--f-mono);font-size:.88em}
:not(pre)>code{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:0 .3em}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto 1fr;height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:17px;white-space:nowrap}
.brand-mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 13px var(--f-mono)}
.brand small{font:500 12px var(--f-body);color:var(--muted)}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;padding:7px 12px 7px 32px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.top .spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.icon-btn:hover{border-color:var(--accent)}
.menu-btn{display:none}

.side{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:10px 8px 40px}
.side .nav-top a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:14px}
.side .nav-top a:hover{background:var(--panel-2)}
.side .nav-top a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.stage{margin-top:14px}
.stage-h{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 10px}
.ph{border-radius:6px}
.ph-link{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:13.5px;line-height:1.3}
.ph-link:hover{background:var(--panel-2)}
.ph-link.on{background:var(--accent-soft);font-weight:600}
.ph-num{font:500 11px var(--f-mono);color:var(--muted)}
.ph-prog{width:34px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.ph-prog i{display:block;height:100%;background:var(--ok)}
.toc{margin:2px 0 6px 34px;border-left:1px solid var(--line);padding-left:8px;display:none}
.ph.open .toc{display:block}
.toc a{display:block;font-size:12.5px;color:var(--muted);text-decoration:none;padding:3px 4px;line-height:1.35}
.toc a:hover{color:var(--ink)}

.main{overflow-y:auto;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){.main{scroll-behavior:auto}}
.wrap{max-width:980px;margin:0 auto;padding:28px 24px 120px}
.prose{max-width:74ch}
.prose p,.prose li{margin:.5em 0}

/* ---------- phase header ---------- */
.phase-h{display:grid;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.eyebrow{font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.phase-h h1{font-size:34px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 12px var(--f-body);padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);white-space:nowrap}
.pill.must{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.pill.should{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.pill.good{border-color:var(--steel);color:var(--steel);background:var(--steel-soft)}
.pill.basic{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pill.solid{color:var(--steel);border-color:var(--steel);background:var(--steel-soft)}
.pill.bonus{color:var(--muted);border-style:dashed}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.box h4{font-size:15px;margin-bottom:6px}
.box ul{margin:4px 0;padding-left:18px}

h2.sec{font-size:24px;margin:38px 0 14px;padding-top:6px;display:flex;align-items:baseline;gap:10px}
h2.sec .k{font:600 12px var(--f-mono);color:var(--muted)}
h3.grp{font-size:18px;margin:26px 0 10px;color:var(--ink)}
.note{border-left:3px solid var(--steel);background:var(--steel-soft);padding:10px 14px;border-radius:0 6px 6px 0;margin:12px 0}
.warn{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 6px 6px 0;margin:12px 0}
.verify{border-left:3px solid var(--bad);background:var(--bad-soft);padding:10px 14px;border-radius:0 6px 6px 0;margin:12px 0}

/* ---------- lesson ---------- */
.lesson{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:18px 0;box-shadow:var(--shadow)}
.lesson>header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.lesson>header h3{font-size:20px;flex:1}
.lesson .body{padding:6px 18px 18px}
.lesson.closed .body{display:none}
.lesson.closed>header{border-bottom:0}
.lsec{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.lsec:last-child{border-bottom:0}
.lsec.wide{grid-template-columns:1fr;gap:6px}
.lsec>.lab{font:600 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-top:3px}
.lsec>.lab b{display:block;color:var(--accent);font-size:13px}
.lsec>.c{min-width:0}
.lsec>.c>:first-child{margin-top:0}
.chev{transition:transform .2s;color:var(--muted)}
.closed .chev{transform:rotate(-90deg)}
.done-tg{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--panel)}
.done-tg.on{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}

/* ---------- question card ---------- */
.qc{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:8px 0}
.qc>.qh{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 14px;cursor:pointer}
.qc .qn{font:600 12px var(--f-mono);color:var(--muted);padding-top:3px;min-width:44px}
.qc .qt{font-weight:600;line-height:1.4}
.qc .qtags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.qc .qb{display:none;padding:2px 16px 16px 68px}
.qc.open .qb{display:block}
.qc.open{border-color:var(--accent)}
.qc.is-done .qn{color:var(--ok)}
.star{border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 2px}
.star.on{color:var(--accent)}
.part{margin:10px 0}
.part>.pl{font:600 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:3px}
.part.say{background:var(--accent-soft);border-radius:6px;padding:10px 12px}
.part.say>.pl{color:var(--accent)}
.part.no{background:var(--bad-soft);border-radius:6px;padding:8px 12px}
.part.no>.pl{color:var(--bad)}
.part.fu{border-left:3px solid var(--steel);padding:4px 0 4px 12px}
.part.fu .fq{font-style:italic;color:var(--steel);font-weight:500}
.part.ev{color:var(--muted);font-size:14px}
.part.dm{border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--panel-2)}
.part.dm>.pl{color:var(--ok)}
.qactions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* scenario / exercise */
.card-x{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--steel);border-radius:8px;margin:14px 0;box-shadow:var(--shadow)}
.card-x.ex{border-left-color:var(--accent)}
.card-x>header{display:flex;gap:10px;align-items:center;padding:12px 16px;cursor:pointer}
.card-x>header h4{flex:1;font-size:17px}
.card-x .body{padding:0 16px 16px}
.card-x.closed .body{display:none}
.sq{margin:8px 0;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2)}
.sq .sqq{font-weight:600}
.reveal{border:1px dashed var(--line);border-radius:6px;margin:10px 0}
.reveal>button{width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--steel)}
.reveal>.rc{display:none;padding:0 12px 12px}
.reveal.open>.rc{display:block}

/* code */
pre{position:relative;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:14px 16px;overflow-x:auto;line-height:1.55;margin:10px 0;font-size:13px}
pre .copy{position:absolute;top:6px;right:6px;font:500 11px var(--f-body);background:#2b3540;color:#cfd6dd;border:0;border-radius:4px;padding:3px 8px;cursor:pointer;opacity:.75}
pre .copy:hover{opacity:1}
pre .lang{position:absolute;top:7px;right:60px;font:500 10px var(--f-mono);color:#7d8a96;text-transform:uppercase}
.hljs-keyword,.hljs-built_in,.hljs-literal{color:#f0a83a}
.hljs-string,.hljs-regexp{color:#9fd39b}
.hljs-number{color:#e6b673}
.hljs-comment{color:#7d8a96;font-style:italic}
.hljs-title,.hljs-title.function_{color:#7fb2dc}
.hljs-attr,.hljs-property{color:#c9a7e8}
.hljs-params{color:#dfe4ea}
.hljs-type,.hljs-class{color:#7fd1c7}
.hljs-meta{color:#7d8a96}
.hljs-variable.language_{color:#ef7d70}

table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
.tbl{overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--panel-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- widgets ---------- */
.wdg{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:16px 0;overflow:hidden;box-shadow:var(--shadow)}
.wdg>.wh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2);flex-wrap:wrap}
.wdg>.wh h4{font-size:15px;flex:1;min-width:200px}
.wdg>.wb{padding:14px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sel{background:var(--steel-soft);border-color:var(--steel)}
label.rng{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
label.rng input{accent-color:var(--accent)}
.out{font:13px/1.5 var(--f-mono);background:var(--code-bg);color:var(--code-ink);border-radius:6px;padding:10px 12px;white-space:pre-wrap;min-height:40px;max-height:320px;overflow:auto}
.stepnote{margin-top:12px;padding:10px 12px;background:var(--steel-soft);border-radius:6px;min-height:48px}
.stepnote b{color:var(--steel)}
.counter{font:500 12px var(--f-mono);color:var(--muted)}

/* flow player */
.flow svg{width:100%;height:auto;display:block}
.flow .fn rect{fill:var(--panel-2);stroke:var(--line);stroke-width:1.2;transition:fill .25s,stroke .25s}
.flow .fn text{fill:var(--ink);font:500 12px var(--f-body)}
.flow .fn text.s{fill:var(--muted);font-size:10px;font-family:var(--f-mono)}
.flow .fn.on rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.flow .fn.err rect{fill:var(--bad-soft);stroke:var(--bad);stroke-width:2}
.flow .fe{stroke:var(--line);stroke-width:1.5;fill:none}
.flow .fe.on{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 5;animation:dash .7s linear infinite}
.flow .fe.err{stroke:var(--bad)}
.flow .fel{fill:var(--muted);font:10px var(--f-mono)}
@keyframes dash{to{stroke-dashoffset:-11}}
@media (prefers-reduced-motion:reduce){.flow .fe.on{animation:none}}
.flow .payload{margin-top:8px}
.svgwrap{overflow-x:auto}

/* event loop */
.el-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
.el-code{font:13px/1.7 var(--f-mono);background:var(--code-bg);color:var(--code-ink);border-radius:6px;padding:8px 0;overflow-x:auto}
.el-code div{padding:0 12px;white-space:pre}
.el-code div.hl{background:rgba(240,168,58,.22);box-shadow:inset 3px 0 0 #f0a83a}
.el-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.el-col{border:1px solid var(--line);border-radius:6px;padding:6px;min-height:64px;background:var(--panel-2)}
.el-col h5{margin:0 0 4px;font:600 10.5px var(--f-mono);text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.el-chip{font:12px var(--f-mono);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 6px;margin:3px 0;animation:pop .25s ease}
.el-chip.hot{border-color:var(--accent);background:var(--accent-soft)}
@keyframes pop{from{transform:scale(.9);opacity:.3}}
@media (prefers-reduced-motion:reduce){.el-chip{animation:none}}
.phases{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.phases span{font:11px var(--f-mono);padding:3px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.phases span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* chunker */
.chunks{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.chunk{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13.5px;background:var(--panel-2)}
.chunk .ch{font:600 11px var(--f-mono);color:var(--muted);display:block;margin-bottom:2px}
.chunk mark{background:var(--accent-soft);color:inherit;border-bottom:2px solid var(--accent)}
.chunk .ov{background:var(--steel-soft);color:inherit}

/* bars */
.bars{display:grid;gap:4px;margin-top:8px}
.bar{display:grid;grid-template-columns:110px 1fr 64px;gap:8px;align-items:center;font:12.5px var(--f-mono)}
.bar .t{height:16px;background:var(--panel-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.bar .t i{display:block;height:100%;background:var(--steel);transition:width .3s}
.bar.in .t i{background:var(--accent)}
.bar.out-n{opacity:.45}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}

/* timeline lanes */
.lanes{position:relative;margin-top:10px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);overflow:hidden}
.lane{height:24px;border-bottom:1px solid var(--line);position:relative}
.lane:last-child{border-bottom:0}
.lane .lab{position:absolute;left:6px;top:4px;font:11px var(--f-mono);color:var(--muted)}
.task{position:absolute;top:3px;height:17px;border-radius:3px;font:10.5px/17px var(--f-mono);padding:0 4px;color:#fff;overflow:hidden;white-space:nowrap}
.task.ok{background:var(--ok)} .task.fail{background:var(--bad)} .task.run{background:var(--accent);color:var(--accent-ink)} .task.wait{background:transparent;border:1px dashed var(--muted);color:var(--muted)}

/* workflow sim */
.wf-steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.wf-step{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12.5px;background:var(--panel-2);min-width:90px;text-align:center}
.wf-step small{display:block;font:10.5px var(--f-mono);color:var(--muted)}
.wf-step.running{border-color:var(--accent);background:var(--accent-soft)}
.wf-step.success{border-color:var(--ok);background:var(--ok-soft)}
.wf-step.failed{border-color:var(--bad);background:var(--bad-soft)}
.wf-step.suspended{border-color:var(--steel);background:var(--steel-soft)}
.wf-arrow{color:var(--muted)}
.wf-panels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.status-chip{font:600 12px var(--f-mono);padding:2px 8px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line)}
.status-chip.running{color:var(--accent);border-color:var(--accent)}
.status-chip.suspended{color:var(--steel);border-color:var(--steel)}
.status-chip.success{color:var(--ok);border-color:var(--ok)}
.status-chip.failed{color:var(--bad);border-color:var(--bad)}
.status-chip.down{color:var(--bad);border-color:var(--bad)}

/* quizzes */
.mcq{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;background:var(--panel)}
.mcq .mt{font-weight:600;margin-bottom:6px}
.mcq label{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:5px;cursor:pointer}
.mcq label:hover{background:var(--panel-2)}
.mcq label.right{background:var(--ok-soft)}
.mcq label.wrong{background:var(--bad-soft)}
.mcq .why{display:none;margin-top:8px;font-size:14px;border-top:1px dashed var(--line);padding-top:8px}
.mcq.graded .why{display:block}
.qz-foot{display:flex;gap:10px;align-items:center;margin-top:10px}
.score{font:600 14px var(--f-mono)}

/* runner */
.runner textarea{width:100%;min-height:260px;font:13px/1.55 var(--f-mono);background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;resize:vertical;tab-size:2}
.t-pass{color:#6cc58b} .t-fail{color:#ef7d70}

/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile .n{font:600 26px var(--f-display);font-variant-numeric:tabular-nums}
.tile .l{font-size:12.5px;color:var(--muted)}
.stage-card{margin:14px 0}
.ph-row{display:grid;grid-template-columns:44px 1fr 90px 90px 120px;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.ph-row:hover{background:var(--panel-2)}
.ph-row .pb{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.ph-row .pb i{display:block;height:100%;background:var(--ok)}
.ok-t{color:var(--ok);font-weight:600} .bad-t{color:var(--bad);font-weight:600}

/* drill */
.drill-q{font:600 22px/1.35 var(--f-display);margin:14px 0}
.timer{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums}

/* score card */
.sc-row{display:grid;grid-template-columns:1fr 200px 70px;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.sc-row input{width:100%;accent-color:var(--accent)}
.verdict{font:600 20px var(--f-display);padding:12px 14px;border-radius:8px;margin-top:12px}

.hidden{display:none!important}
.searchres a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:6px;margin:6px 0;text-decoration:none;color:var(--ink);background:var(--panel)}
.searchres a:hover{border-color:var(--accent)}
.searchres small{color:var(--muted);font-family:var(--f-mono)}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:none}}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:52px;bottom:0;left:0;width:300px;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .side.show{transform:none}
  .menu-btn{display:inline-flex}
  .two,.three,.el-grid,.wf-panels{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}
  .lsec{grid-template-columns:1fr;gap:4px}
  .qc .qb{padding-left:16px}
  .seg-wide{display:none}
  .ph-row{grid-template-columns:36px 1fr 70px}
  .ph-row .hide-s{display:none}
  .brand small{display:none}
}
@media (max-width:420px){.wrap{padding:18px 16px 100px}.phase-h h1{font-size:26px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open phase list">☰</button>
    <div class="brand"><span class="brand-mark">AI</span><span>Backend Masterclass <small>fresher → strong junior</small></span></div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search 600+ questions, lessons, scenarios…" aria-label="Search">
    </div>
    <div class="spacer"></div>
    <div class="seg seg-wide" role="group" aria-label="Mode">
      <button data-mode="learn" aria-pressed="true">Learn</button>
      <button data-mode="interview" aria-pressed="false">Interview</button>
      <button data-mode="revision" aria-pressed="false">Revision</button>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark">◐</button>
  </header>
  <nav class="side" id="side" aria-label="Phases"></nav>
  <main class="main" id="main"><div class="wrap" id="view"></div></main>
</div>
